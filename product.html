<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | Trends by AK</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--black:#171717;--gold:#b28a4b;--cream:#f7f3ed;--line:#e8e2d9}*{box-sizing:border-box}body{margin:0;color:#222;font:15px Arial,sans-serif}header{border-bottom:1px solid var(--line);padding:15px 5%;display:flex;justify-content:space-between;align-items:center;gap:15px;position:sticky;top:0;background:#fff;z-index:10}.logo{font:600 25px Georgia}.logo span{color:var(--gold)}header a{color:#222;text-decoration:none}.cart{border:1px solid var(--line);padding:9px 12px;border-radius:8px}.page{max-width:1150px;margin:auto;padding:35px 18px 70px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:55px}.media{background:var(--cream);border-radius:16px;min-height:520px;display:flex;align-items:center;justify-content:center;overflow:hidden}.media img{width:100%;height:520px;object-fit:cover}.cat{font-size:11px;color:#92703b;text-transform:uppercase;letter-spacing:1.5px}.title{font:600 40px Georgia;margin:10px 0 18px}.price{display:flex;gap:10px;align-items:center;margin-bottom:18px}.now{font-size:27px;font-weight:700}.old{text-decoration:line-through;color:#999}.desc{color:#666;line-height:1.7}.option-group{margin:20px 0}.option-label{font-weight:700;font-size:13px;margin-bottom:8px}.options{display:flex;gap:8px;flex-wrap:wrap}.option{border:1px solid #d9d2c8;background:#fff;border-radius:8px;padding:10px 14px;cursor:pointer}.option.selected{border-color:var(--black);background:var(--black);color:#fff}.option.disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}.stock{background:#faf8f4;border:1px solid #eee7dc;border-radius:9px;padding:12px;margin:15px 0}.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;width:130px;margin:12px 0}.qty button{width:40px;height:42px;border:0;background:#fff;font-size:20px}.qty span{flex:1;text-align:center;font-weight:700}.btn{width:100%;padding:14px;border:0;border-radius:9px;margin-top:8px;font-weight:700;cursor:pointer}.add{background:var(--black);color:#fff}.buy{background:var(--gold);color:#fff}.wa{display:flex;justify-content:center;text-decoration:none;background:#fff;color:#222;border:1px solid #222}.state{text-align:center;padding:80px 20px}.toast{position:fixed;right:18px;bottom:18px;background:#171717;color:#fff;padding:12px 15px;border-radius:8px;display:none}.toast.show{display:block}@media(max-width:800px){.layout{grid-template-columns:1fr;gap:25px}.media,.media img{min-height:360px;height:360px}.title{font-size:32px}}

const URL="https://ltxrycmreumoqfpcbwnb.supabase.co",KEY="sb_publishable_wdc4ImKB1f0Q-v4Po9DOwA_xIpPXHkh",db=window.supabase.createClient(URL,KEY);let product=null,variants=[],selected=null,qty=1;
const esc=v=>String(v??"").replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));function money(v){return '₹'+Number(v||0).toLocaleString('en-IN')}function cart(){try{return JSON.parse(localStorage.getItem('trendsbyak_cart')||'[]')}catch{return[]}}function save(c){localStorage.setItem('trendsbyak_cart',JSON.stringify(c));count()}function count(){document.getElementById('cartCount').textContent=cart().reduce((s,x)=>s+Number(x.quantity||0),0)}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function selectedPrice(){const v=selected;return v?Number(v.sale_price??v.price??0):Number(product.sale_price??product.price??0)}function selectedStock(){return selected?Number(selected.stock||0):Number(product.stock||0)}
function render(){const sizes=[...new Set(variants.map(v=>v.size).filter(Boolean))],colors=[...new Set(variants.map(v=>v.color).filter(Boolean))];const vprice=selectedPrice(),base=selected?Number(selected.price||0):Number(product.price||0);document.getElementById('root').innerHTML=`<div class="layout"><div class="media">${product.image_url?`<img src="${esc(selected?.image_url||product.image_url)}" alt="${esc(product.name)}">`:'No image'}</div><section><div class="cat">${esc(product.category||product.collection||'Products')}</div><h1 class="title">${esc(product.name)}</h1><div class="price"><span class="now">${money(vprice)}</span>${vprice<base?`<span class="old">${money(base)}</span>`:''}</div><div class="desc">${esc(product.description||'')}</div>${sizes.length?`<div class="option-group"><div class="option-label">Size</div><div class="options">${sizes.map(s=>{const active=selected?.size===s;const possible=variants.some(v=>v.size===s&&(!selected?.color||v.color===selected.color)&&v.status==='active'&&Number(v.stock)>0);return `<button class="option ${active?'selected':''} ${possible?'':'disabled'}" ${possible?`onclick="chooseSize('${esc(s)}')"`:''}>${esc(s)}</button>`}).join('')}</div></div>`:''}${colors.length?`<div class="option-group"><div class="option-label">Color</div><div class="options">${colors.map(c=>{const active=selected?.color===c;const possible=variants.some(v=>v.color===c&&(!selected?.size||v.size===selected.size)&&v.status==='active'&&Number(v.stock)>0);return `<button class="option ${active?'selected':''} ${possible?'':'disabled'}" ${possible?`onclick="chooseColor('${esc(c)}')"`:''}>${esc(c)}</button>`}).join('')}</div></div>`:''}<div class="stock">${selectedStock()>0?`<b style="color:#55764f">✓ In stock</b> · ${selectedStock()} available`:'<b style="color:#a14f4f">Currently sold out</b>'}</div>${selectedStock()>0?`<div>Quantity</div><div class="qty"><button onclick="change(-1)">−</button><span id="qty">${qty}</span><button onclick="change(1)">+</button></div><button class="btn add" onclick="add(false)">🛒 Add to Cart</button><button class="btn buy" onclick="add(true)">Buy Now</button><a class="btn wa" href="https://wa.me/918433998962?text=${encodeURIComponent('Hi Trends by AK, I want to order '+product.name+(selected?` (${selected.size||''}${selected.size&&selected.color?' / ':''}${selected.color||''})`:''))}" target="_blank">Order on WhatsApp</a>`:'<button class="btn" disabled>Sold Out</button>'}</section></div>`}
function pick(){if(!variants.length){selected=null;return}selected=variants.find(v=>v.status==='active'&&Number(v.stock)>0)||variants[0]}
function chooseSize(s){const next=variants.find(v=>v.status==='active'&&Number(v.stock)>0&&v.size===s&&(!selected?.color||v.color===selected.color))||variants.find(v=>v.status==='active'&&Number(v.stock)>0&&v.size===s);if(next){selected=next;qty=1;render()}}function chooseColor(c){const next=variants.find(v=>v.status==='active'&&Number(v.stock)>0&&v.color===c&&(!selected?.size||v.size===selected.size))||variants.find(v=>v.status==='active'&&Number(v.stock)>0&&v.color===c);if(next){selected=next;qty=1;render()}}function change(d){qty=Math.max(1,Math.min(qty+d,selectedStock()));const e=document.getElementById('qty');if(e)e.textContent=qty}
function add(go){const stock=selectedStock();if(stock<1){toast('This option is sold out.');return}const c=cart(),key=String(product.id)+'_'+String(selected?.id||'base'),item=c.find(x=>x.key===key);if(item){if(item.quantity+qty>stock){toast('Only '+stock+' available.');return}item.quantity+=qty}else c.push({key,product_id:product.id,variant_id:selected?.id||null,name:product.name,variant_size:selected?.size||null,variant_color:selected?.color||null,variant_sku:selected?.sku||null,price:selectedPrice(),image_url:selected?.image_url||product.image_url||'',quantity:qty});save(c);toast('Added to cart ✓');if(go)location.href='checkout.html'}
async function load(){const id=new URLSearchParams(location.search).get('id');if(!id){document.getElementById('root').innerHTML='<div class="state">Product not found</div>';return}const r=await db.from('products').select('*').eq('id',id).eq('status','active').maybeSingle();if(r.error||!r.data){document.getElementById('root').innerHTML='<div class="state">Product not found</div>';return}product=r.data;const vr=await db.from('product_variants').select('*').eq('product_id',id).eq('status','active').order('id');variants=vr.data||[];pick();render();count()}load();
</script></body></html>
