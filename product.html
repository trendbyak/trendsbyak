<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Analytics 4 -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product | Trends by AK</title>
<meta name="description" content="Shop Trends by AK">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap');

:root{
  --black:#171717;
  --gold:#b28a4b;
  --gold-dark:#92703b;
  --cream:#f7f3ed;
  --white:#fff;
  --text:#222;
  --muted:#777;
  --line:#e8e2d9;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  background:#fff;
  color:var(--text);
  font-family:"DM Sans",Arial,sans-serif;
}

a{text-decoration:none;color:inherit}

/* HEADER */
.site-header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(255,255,255,.97);
  border-bottom:1px solid var(--line);
}

.header-inner{
  max-width:1240px;
  height:78px;
  margin:auto;
  padding:0 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:30px;
}

.logo{
  font-family:"Playfair Display",serif;
  font-size:28px;
  font-weight:600;
  letter-spacing:.2px;
  white-space:nowrap;
}

.logo span{
  color:var(--gold);
}

.nav{
  display:flex;
  align-items:center;
  gap:26px;
  font-size:14px;
}

.nav a{
  color:#333;
  transition:.2s;
}

.nav a:hover{color:var(--gold)}

.nav-actions{
  display:flex;
  align-items:center;
  gap:12px;
}

.cart-link{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:10px 13px;
  border:1px solid var(--line);
  border-radius:8px;
}

.cart-count{
  min-width:20px;
  height:20px;
  padding:0 6px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:20px;
  background:var(--gold);
  color:#fff;
  font-size:11px;
  font-weight:600;
}

.whatsapp{
  background:var(--black);
  color:#fff!important;
  padding:11px 17px;
  border-radius:8px;
}

.whatsapp:hover{background:var(--gold)!important}

/* PRODUCT */
.page{
  max-width:1240px;
  margin:auto;
  padding:55px 28px 90px;
}

.breadcrumb{
  color:#8a8a8a;
  font-size:13px;
  margin-bottom:30px;
}

.product-layout{
  display:grid;
  grid-template-columns:minmax(0,1.05fr) minmax(360px,.95fr);
  gap:70px;
  align-items:start;
}

.product-media{
  background:var(--cream);
  border-radius:18px;
  overflow:hidden;
  min-height:560px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.product-media img{
  width:100%;
  height:560px;
  object-fit:cover;
  display:block;
}

.product-info{
  padding:12px 0;
}

.category{
  color:var(--gold-dark);
  font-size:12px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:1.8px;
  margin-bottom:13px;
}

.product-title{
  font-family:"Playfair Display",serif;
  font-size:42px;
  line-height:1.12;
  font-weight:600;
  margin:0 0 18px;
}

.price{
  display:flex;
  align-items:center;
  gap:12px;
  margin:0 0 22px;
}

.current-price{
  font-size:27px;
  font-weight:600;
}

.old-price{
  color:#999;
  text-decoration:line-through;
  font-size:16px;
}

.description{
  color:#666;
  line-height:1.8;
  font-size:15px;
  margin-bottom:25px;
}

.stock-box{
  padding:14px 16px;
  background:#faf8f4;
  border:1px solid #eee8df;
  border-radius:10px;
  margin-bottom:24px;
  font-size:14px;
}

.in-stock{color:#55764f;font-weight:600}
.out-stock{color:#a14f4f;font-weight:600}

.qty-label{
  font-size:13px;
  font-weight:600;
  margin-bottom:9px;
}

.qty{
  width:135px;
  height:46px;
  border:1px solid var(--line);
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  overflow:hidden;
  margin-bottom:14px;
}

.qty button{
  width:42px;
  height:100%;
  border:0;
  background:#fff;
  font-size:20px;
  cursor:pointer;
}

.qty button:hover{background:var(--cream)}

.qty span{
  font-weight:600;
}

.action{
  width:100%;
  min-height:50px;
  border:0;
  border-radius:8px;
  font-family:inherit;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  margin-bottom:10px;
}

.add{
  background:var(--black);
  color:#fff;
}

.buy{
  background:var(--gold);
  color:#fff;
}

.action:hover{opacity:.9}

.order-whatsapp{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:50px;
  border:1px solid var(--black);
  border-radius:8px;
  font-size:14px;
  font-weight:600;
  margin-bottom:20px;
}

.order-whatsapp:hover{
  background:var(--black);
  color:#fff;
}

.back{
  display:inline-block;
  color:#777;
  font-size:13px;
  padding-top:5px;
}

.back:hover{color:var(--gold)}

.features{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:35px;
  padding-top:25px;
  border-top:1px solid var(--line);
}

.feature{
  font-size:12px;
  color:#666;
  line-height:1.5;
}

.feature strong{
  display:block;
  color:#222;
  margin-bottom:3px;
}

/* LOADING / ERROR */
.state{
  text-align:center;
  padding:100px 20px;
}

.state h2{
  font-family:"Playfair Display",serif;
  font-size:30px;
}

.state a{
  display:inline-block;
  margin-top:12px;
  background:var(--black);
  color:#fff;
  padding:12px 20px;
  border-radius:8px;
}

/* TOAST */
.toast{
  position:fixed;
  right:22px;
  bottom:22px;
  z-index:2000;
  background:var(--black);
  color:#fff;
  padding:14px 18px;
  border-radius:9px;
  font-size:13px;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
  opacity:0;
  transform:translateY(15px);
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

/* MOBILE */
.mobile-menu{
  display:none;
  border:1px solid var(--line);
  background:#fff;
  border-radius:8px;
  padding:9px 11px;
  cursor:pointer;
}

@media(max-width:900px){
  .nav{display:none}
  .mobile-menu{display:block}
  .header-inner{height:70px;padding:0 18px}
  .logo{font-size:24px}
  .product-layout{
    grid-template-columns:1fr;
    gap:35px;
  }
  .product-media{min-height:420px}
  .product-media img{height:420px}
  .product-title{font-size:35px}
}

@media(max-width:560px){
  .page{padding:30px 16px 60px}
  .header-inner{padding:0 15px;gap:10px}
  .nav-actions .whatsapp{display:none}
  .cart-link{padding:8px 10px}
  .product-media{min-height:340px;border-radius:14px}
  .product-media img{height:340px}
  .product-title{font-size:31px}
  .features{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header class="site-header">
  <div class="header-inner">

    <a href="index.html" class="logo">
      Trends <span>by AK</span>
    </a>

    <nav class="nav">
      <a href="index.html#collections">Collections</a>
      <a href="index.html#products">Products</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
    </nav>

    <div class="nav-actions">
      <a href="checkout.html" class="cart-link">
        🛒 <span>Cart</span>
        <span class="cart-count" id="cartCount">0</span>
      </a>

      <a
        class="whatsapp"
        href="https://wa.me/918433998962"
        target="_blank"
        rel="noopener"
      >
        WhatsApp
      </a>

      <button class="mobile-menu" onclick="mobileMenu()">
        ☰
      </button>
    </div>

  </div>
</header>

<div id="mobileNav" style="
  display:none;
  background:#fff;
  border-bottom:1px solid #e8e2d9;
  padding:15px 20px;
">
  <a href="index.html#collections" style="display:block;padding:10px 0">Collections</a>
  <a href="index.html#products" style="display:block;padding:10px 0">Products</a>
  <a href="index.html#about" style="display:block;padding:10px 0">About</a>
  <a href="index.html#contact" style="display:block;padding:10px 0">Contact</a>
</div>

<main class="page" id="productPage">
  <div class="state">
    <h2>Loading product...</h2>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL="https://ltxrycmreumoqfpcbwnb.supabase.co";
const SUPABASE_KEY="sb_publishable_wdc4ImKB1f0Q-v4Po9DOwA_xIpPXHkh";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentProduct=null;
let quantity=1;

function escapeHtml(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function getCart(){
  try{
    return JSON.parse(localStorage.getItem("trendsbyak_cart")||"[]");
  }catch(e){
    return [];
  }
}

function saveCart(cart){
  localStorage.setItem("trendsbyak_cart",JSON.stringify(cart));
  updateCartCount();
}

function updateCartCount(){
  const count=getCart().reduce(
    (sum,item)=>sum+Number(item.quantity||0),0
  );
  document.getElementById("cartCount").textContent=count;
}

function showToast(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(
    ()=>el.classList.remove("show"),
    2500
  );
}

function changeQuantity(amount){
  if(!currentProduct)return;

  const stock=Number(currentProduct.stock||0);

  quantity+=amount;

  if(quantity<1)quantity=1;
  if(stock>0 && quantity>stock)quantity=stock;

  document.getElementById("quantity").textContent=quantity;
}
async function trackAnalyticsEvent(eventName, data = {}) {
  try {
    const visitorId =
      localStorage.getItem("trendsbyak_visitor_id") ||
      crypto.randomUUID();

    localStorage.setItem(
      "trendsbyak_visitor_id",
      visitorId
    );

    const sessionId =
      sessionStorage.getItem("trendsbyak_session_id") ||
      crypto.randomUUID();

    sessionStorage.setItem(
      "trendsbyak_session_id",
      sessionId
    );

    const params = new URLSearchParams(
      window.location.search
    );

    await supabaseClient
      .from("analytics_events")
      .insert({
        event_name: eventName,
        session_id: sessionId,
        visitor_id: visitorId,
        page_url: window.location.href,
        page_path: window.location.pathname,
        referrer: document.referrer || null,
        source: params.get("utm_source") || "direct",
        medium: params.get("utm_medium") || null,
        campaign: params.get("utm_campaign") || null,
        device_type: /Mobi|Android/i.test(navigator.userAgent)
          ? "mobile"
          : "desktop",
        user_agent: navigator.userAgent,
        product_id: data.product_id || null,
        product_name: data.product_name || null,
        value: data.value || null,
        currency: data.currency || "INR",
        metadata: data.metadata || {}
      });

  } catch (error) {
    console.error("Analytics tracking error:", error);
  }
}
function addToCart(goCheckout=false){
  if(!currentProduct)return;

  const stock=Number(currentProduct.stock||0);

  if(stock<=0){
    showToast("This product is out of stock.");
    return;
  }

  const cart=getCart();
  const id=String(currentProduct.id);

  const existing=cart.find(
    item=>String(item.product_id)===id
  );

  if(existing){
    const newQty=
      Number(existing.quantity||0)+quantity;

    if(newQty>stock){
      showToast("Only "+stock+" available.");
      return;
    }

    existing.quantity=newQty;
  }else{
    cart.push({
      product_id:currentProduct.id,
      name:currentProduct.name,
      price:Number(
        currentProduct.sale_price ??
        currentProduct.price ??
        0
      ),
      image_url:currentProduct.image_url||"",
      quantity:quantity
    });
  }

  saveCart(cart);
trackAnalyticsEvent("add_to_cart", {
  product_id: currentProduct.id,
  product_name: currentProduct.name,
  value: Number(
    currentProduct.sale_price ??
    currentProduct.price ??
    0
  ) * quantity,
  currency: "INR",
  metadata: {
    quantity: quantity
  }
});
  if(goCheckout){
    window.location.href="checkout.html";
    return;
  }

  showToast("Added to cart ✓");
}

function mobileMenu(){
  const nav=document.getElementById("mobileNav");
  nav.style.display=
    nav.style.display==="block"
      ? "none"
      : "block";
}
async function trackProductView(product) {
  try {
    const visitorId =
      localStorage.getItem("trendsbyak_visitor_id") ||
      (() => {
        const id = crypto.randomUUID();
        localStorage.setItem("trendsbyak_visitor_id", id);
        return id;
      })();

    const sessionId =
      sessionStorage.getItem("trendsbyak_session_id") ||
      (() => {
        const id = crypto.randomUUID();
        sessionStorage.setItem("trendsbyak_session_id", id);
        return id;
      })();

    const params = new URLSearchParams(window.location.search);

    const event = {
      event_name: "product_view",
      session_id: sessionId,
      visitor_id: visitorId,
      page_url: window.location.href,
      page_path: window.location.pathname,
      referrer: document.referrer || null,
      source: params.get("utm_source") || "direct",
      medium: params.get("utm_medium") || null,
      campaign: params.get("utm_campaign") || null,
      device_type:
        window.innerWidth <= 768 ? "mobile" : "desktop",
      user_agent: navigator.userAgent,
      product_id: product?.id || null,
      product_name: product?.name || null,
      value: Number(
        product?.sale_price ??
        product?.price ??
        0
      ),
      currency: "INR",
      metadata: {}
    };

    const { error } = await supabaseClient
      .from("analytics_events")
      .insert(event);

    if (error) {
      console.error("Analytics error:", error);
    }
  } catch (error) {
    console.error("Analytics tracking failed:", error);
  }
}
async function loadProduct(){

  const params=new URLSearchParams(
    window.location.search
  );

  const id=params.get("id");
  const container=document.getElementById("productPage");

  if(!id){
    container.innerHTML=`
      <div class="state">
        <h2>Product not found</h2>
        <a href="index.html#products">
          Back to Products
        </a>
      </div>`;
    return;
  }

  const {data,error}=await supabaseClient
    .from("products")
    .select("*")
    .eq("id",id)
    .maybeSingle();

  if(error||!data){
    console.error(error);

    container.innerHTML=`
      <div class="state">
        <h2>Product not found</h2>
        <p>We couldn't load this product.</p>
        <a href="index.html#products">
          Back to Products
        </a>
      </div>`;

    return;
  }

 currentProduct = data;
trackProductView(data);
quantity = 1;

  const price=Number(data.price||0);
  const sale=
    data.sale_price!==null &&
    data.sale_price!==undefined &&
    data.sale_price!==""
      ? Number(data.sale_price)
      : null;

  const displayPrice=
    sale!==null ? sale : price;

  const stock=Number(data.stock||0);
  const image=data.image_url||"";

  document.title=
    (data.name||"Product")+" | Trends by AK";

  container.innerHTML=`

    <div class="breadcrumb">
      <a href="index.html">Home</a>
      &nbsp; / &nbsp;
      ${escapeHtml(data.category||"Products")}
      &nbsp; / &nbsp;
      ${escapeHtml(data.name||"Product")}
    </div>

    <div class="product-layout">

      <div class="product-media">

        ${
          image
          ? `<img
              src="${escapeHtml(image)}"
              alt="${escapeHtml(data.name)}"
              onerror="this.style.display='none';this.parentElement.innerHTML='<div class=state><p>Image unavailable</p></div>'"
            >`
          : `<div class="state">
               <h2>No image</h2>
             </div>`
        }

      </div>

      <section class="product-info">

        ${
          data.category
          ? `<div class="category">
              ${escapeHtml(data.category)}
             </div>`
          : ""
        }

        <h1 class="product-title">
          ${escapeHtml(data.name||"Product")}
        </h1>

        <div class="price">

          <span class="current-price">
            ₹${displayPrice.toLocaleString("en-IN")}
          </span>

          ${
            sale!==null && sale<price
            ? `<span class="old-price">
                 ₹${price.toLocaleString("en-IN")}
               </span>`
            : ""
          }

        </div>

        ${
          data.description
          ? `<div class="description">
              ${escapeHtml(data.description)}
             </div>`
          : ""
        }

        <div class="stock-box">

          ${
            stock>0
            ? `<span class="in-stock">
                 ✓ In stock
               </span>
               <br>
               <small>
                 ${stock} available
               </small>`
            : `<span class="out-stock">
                 Currently sold out
               </span>`
          }

        </div>

        ${
          stock>0
          ? `

            <div class="qty-label">
              Quantity
            </div>

            <div class="qty">
              <button onclick="changeQuantity(-1)">
                −
              </button>

              <span id="quantity">1</span>

              <button onclick="changeQuantity(1)">
                +
              </button>
            </div>

            <button
              class="action add"
              onclick="addToCart(false)"
            >
              🛒 Add to Cart
            </button>

            <button
              class="action buy"
              onclick="addToCart(true)"
            >
              Buy Now
            </button>

            <a
              class="order-whatsapp"
              href="https://wa.me/918433998962?text=${encodeURIComponent(
                "Hi Trends by AK, I would like to order: "+
                data.name
              )}"
              target="_blank"
              rel="noopener"
            >
              Order on WhatsApp
            </a>

          `
          : `
            <button
              class="action"
              disabled
              style="
                background:#e5e5e5;
                color:#888;
                cursor:not-allowed;
              "
            >
              Sold Out
            </button>
          `
        }

        <a
          class="back"
          href="index.html#products"
        >
          ← Back to Products
        </a>

        <div class="features">

          <div class="feature">
            <strong>Premium Quality</strong>
            Carefully selected products.
          </div>

          <div class="feature">
            <strong>Easy Ordering</strong>
            Secure website checkout.
          </div>

          <div class="feature">
            <strong>Need Help?</strong>
            Order directly on WhatsApp.
          </div>

        </div>

      </section>

    </div>
  `;
}

updateCartCount();
loadProduct();
</script>

</body>
</html>
