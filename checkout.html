<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Trends by AK</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://checkout.razorpay.com/v1/checkout.js"></script><style>:root{--black:#171717;--gold:#b28a4b;--cream:#f7f4ef;--line:#e7e1d8}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#222;font:14px Arial,sans-serif}header{background:var(--black);color:#fff;padding:16px 5%}header a{color:#fff;text-decoration:none}.wrap{max-width:1050px;margin:auto;padding:25px 14px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px}h2{margin-top:0}label{display:block;font-size:12px;font-weight:700;margin:13px 0 6px}input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit}textarea{min-height:75px}.pay{border:1px solid var(--line);padding:12px;border-radius:9px;margin:9px 0}.pay.selected{border-color:var(--gold);background:#faf7f1}.pay input{width:auto}.item{display:grid;grid-template-columns:52px 1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.item img{width:52px;height:52px;object-fit:cover;border-radius:7px}.name{font-weight:700}.meta{font-size:11px;color:#777;margin-top:3px}.row{display:flex;justify-content:space-between;padding:8px 0;color:#666}.grand{border-top:1px solid #eee;padding-top:15px;color:#222;font-size:18px;font-weight:700}.btn{width:100%;padding:13px;border:0;border-radius:8px;background:var(--black);color:#fff;font-weight:700;margin-top:15px;cursor:pointer}.btn:disabled{opacity:.5}.msg{padding:11px;border-radius:8px;margin-bottom:15px;display:none}.msg.show{display:block}.err{background:#fff0f0;color:#a33}.ok{background:#edf7ed;color:#356b35}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style></head><body><header><a href="cart.html">← Back to Cart</a></header><main class="wrap"><div id="message" class="msg"></div><div class="grid"><section class="card"><h2>Delivery details</h2><label>Full name *</label><input id="name"><label>Phone *</label><input id="phone" inputmode="tel"><label>Email</label><input id="email" type="email"><label>Address *</label><input id="address1"><label>Apartment / Landmark</label><input id="address2"><label>City *</label><input id="city"><label>State *</label><input id="state"><label>PIN code *</label><input id="postal" inputmode="numeric" maxlength="6"><label>Order notes</label><textarea id="notes"></textarea><h3 style="margin-top:22px">Payment</h3><label class="pay selected" id="razorpayOption"><input type="radio" name="payment" value="razorpay" checked onchange="selectPayment('razorpay')"> Pay Online — Razorpay</label><label class="pay" id="whatsappOption"><input type="radio" name="payment" value="whatsapp" onchange="selectPayment('whatsapp')"> Pay via WhatsApp</label><button id="place" class="btn" onclick="placeOrder()">Place Order & Pay</button></section><aside class="card"><h2>Your order</h2><div id="cartBox"></div><div class="row"><span>Subtotal</span><span id="subtotal">₹0</span></div><div class="row"><span>Shipping</span><span>₹0</span></div><div class="row grand"><span>Total</span><span id="total">₹0</span></div></aside></div></main><script>
const URL="https://ltxrycmreumoqfpcbwnb.supabase.co",KEY="sb_publishable_wdc4ImKB1f0Q-v4Po9DOwA_xIpPXHkh",db=window.supabase.createClient(URL,KEY),WA="918433998962";let cart=JSON.parse(localStorage.getItem('trendsbyak_cart')||'[]');function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}function money(v){return '₹'+Number(v||0).toLocaleString('en-IN')}function msg(t,err=true){const e=document.getElementById('message');e.textContent=t;e.className='msg show '+(err?'err':'ok');window.scrollTo({top:0,behavior:'smooth'})}
function selectPayment(m){document.getElementById('razorpayOption').classList.toggle('selected',m==='razorpay');document.getElementById('whatsappOption').classList.toggle('selected',m==='whatsapp');document.getElementById('place').textContent=m==='whatsapp'?'Create Order & Continue to WhatsApp':'Place Order & Pay'}function key(x){return x.key||String(x.product_id)+'_'+String(x.variant_id||'base')}function totals(){return cart.reduce((s,x)=>s+Number(x.price||0)*Number(x.quantity||0),0)}function render(){if(!cart.length){document.getElementById('cartBox').innerHTML='<p>Your cart is empty.</p>';document.getElementById('place').disabled=true;return}document.getElementById('cartBox').innerHTML=cart.map(x=>{const o=[x.variant_size,x.variant_color].filter(Boolean).join(' / ');return `<div class="item"><img src="${esc(x.image_url||'')}" alt=""><div><div class="name">${esc(x.name)}</div>${o?`<div class="meta">${esc(o)}</div>`:''}${x.variant_sku?`<div class="meta">SKU: ${esc(x.variant_sku)}</div>`:''}<div class="meta">${money(x.price)} × ${x.quantity}</div></div><b>${money(Number(x.price||0)*Number(x.quantity||0))}</b></div>`}).join('');document.getElementById('subtotal').textContent=money(totals());document.getElementById('total').textContent=money(totals())}
function data(){const p=new URLSearchParams(location.search);return {customer_name:document.getElementById('name').value.trim(),customer_email:document.getElementById('email').value.trim()||null,customer_phone:document.getElementById('phone').value.trim(),address_line1:document.getElementById('address1').value.trim(),address_line2:document.getElementById('address2').value.trim()||null,city:document.getElementById('city').value.trim(),state:document.getElementById('state').value.trim(),postal_code:document.getElementById('postal').value.trim(),country:'India',notes:document.getElementById('notes').value.trim()||null,payment_method:'razorpay',source:p.get('utm_source')||'website',medium:p.get('utm_medium')||'website',campaign:p.get('utm_campaign')||null,landing_page:location.href,referrer:document.referrer||null,session_id:localStorage.getItem('trendsbyak_session_id')||null,items:cart.map(x=>({product_id:Number(x.product_id),variant_id:x.variant_id?Number(x.variant_id):null,quantity:Number(x.quantity)})),discount:0,shipping_fee:0,tax:0}}
function validate(d){if(!d.customer_name||!d.customer_phone||!d.address_line1||!d.city||!d.state||!d.postal_code){msg('Please fill all required delivery details.');return false}if(!/^[0-9+ ()-]{8,18}$/.test(d.customer_phone)){msg('Please enter a valid phone number.');return false}if(!/^\d{6}$/.test(d.postal_code)){msg('Please enter a valid 6-digit PIN code.');return false}return true}
async function createWhatsApp(){const d=data();const r=await db.rpc('create_guest_order',{order_data:{...d,payment_method:'whatsapp'}});if(r.error){msg(r.error.message);return}const o=r.data||{};localStorage.removeItem('trendsbyak_cart');cart=[];const text=`Hi Trends by AK!\n\nI have placed an order.\nOrder No: ${o.order_number||''}\nCustomer: ${d.customer_name}\nTotal: ${money(o.total||totals())}\n\nPlease share the payment instructions.`;location.href='https://wa.me/'+WA+'?text='+encodeURIComponent(text)}
async function razorpay(){const d=data(),button=document.getElementById('place');button.textContent='Creating secure payment...';const r=await db.functions.invoke('create-razorpay-order',{body:{items:d.items,customer:{name:d.customer_name,email:d.customer_email,phone:d.customer_phone,address_line1:d.address_line1,address_line2:d.address_line2,city:d.city,state:d.state,postal_code:d.postal_code,country:d.country,notes:d.notes},attribution:{source:d.source,medium:d.medium,campaign:d.campaign,landing_page:d.landing_page,referrer:d.referrer,session_id:d.session_id}}});if(r.error||!r.data?.order_id){msg(r.error?.message||r.data?.error||'Could not start payment.');button.disabled=false;selectPayment('razorpay');return}const o=r.data;const rp=new Razorpay({key:o.key_id,amount:o.amount,currency:o.currency||'INR',name:'Trends by AK',description:'Trends by AK order',order_id:o.order_id,prefill:{name:d.customer_name,email:d.customer_email||'',contact:d.customer_phone},handler:verify,modal:{ondismiss:()=>{button.disabled=false;selectPayment('razorpay')}}});rp.on('payment.failed',x=>{msg(x?.error?.description||'Payment failed.');button.disabled=false;selectPayment('razorpay')});rp.open()}
async function verify(r){const b=document.getElementById('place');b.textContent='Verifying payment...';const x=await db.functions.invoke('verify-razorpay-payment',{body:{razorpay_payment_id:r.razorpay_payment_id,razorpay_order_id:r.razorpay_order_id,razorpay_signature:r.razorpay_signature}});if(x.error||!x.data?.success){msg(x.error?.message||x.data?.error||'Payment verification failed.');b.disabled=false;selectPayment('razorpay');return}localStorage.removeItem('trendsbyak_cart');location.href=x.data.redirect_url||('/payment-success.html?order='+encodeURIComponent(x.data.order_number||''))}
async function placeOrder(){document.getElementById('message').className='msg';if(!cart.length){msg('Your cart is empty.');return}const d=data();if(!validate(d))return;const b=document.getElementById('place');b.disabled=true;const method=document.querySelector('input[name="payment"]:checked')?.value||'razorpay';if(method==='whatsapp')await createWhatsApp();else await razorpay()}
render();selectPayment('razorpay');
</script></body></html>
