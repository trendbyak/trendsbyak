<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://ltxrycmreumoqfpcbwnb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_wdc4ImKB1f0Q-v4Po9DOwA_xIpPXHkh";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   SETTINGS
========================================================= */

const WHATSAPP_NUMBER = "918433998962";


/* =========================================================
   CART
========================================================= */

let cart =
  JSON.parse(
    localStorage.getItem("trendsbyak_cart") || "[]"
  );


/* =========================================================
   HELPERS
========================================================= */

function money(n){

  return "₹" +
    Number(n || 0).toLocaleString(
      "en-IN",
      {
        maximumFractionDigits:2
      }
    );
}


function escapeHtml(v){

  return String(v ?? "").replace(
    /[&<>"']/g,
    function(c){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[c];

    }
  );
}


/* =========================================================
   PAYMENT SELECTION
========================================================= */

function selectPayment(method){

  const razorpayOption =
    document.getElementById("razorpayOption");

  const whatsappOption =
    document.getElementById("whatsappOption");

  const button =
    document.getElementById("placeOrderBtn");

  razorpayOption.classList.toggle(
    "selected",
    method === "razorpay"
  );

  whatsappOption.classList.toggle(
    "selected",
    method === "whatsapp"
  );

  button.textContent =
    method === "whatsapp"
      ? "Create Order & Continue to WhatsApp"
      : "Place Order & Pay";
}


/* =========================================================
   TOTALS
========================================================= */

function getTotals(){

  const subtotal =
    cart.reduce(
      function(sum,item){

        return sum +
          Number(item.price || 0) *
          Number(item.quantity || 0);

      },
      0
    );

  return {
    subtotal:subtotal,
    shipping:0,
    total:subtotal
  };
}


/* =========================================================
   SAVE CART
========================================================= */

function saveCart(){

  localStorage.setItem(
    "trendsbyak_cart",
    JSON.stringify(cart)
  );

  renderCart();
}


/* =========================================================
   CHANGE QUANTITY
========================================================= */

function changeQty(id,delta){

  const item =
    cart.find(
      function(x){

        return String(x.product_id) ===
          String(id);

      }
    );

  if(!item)return;

  item.quantity =
    Number(item.quantity || 1) + delta;

  if(item.quantity < 1){

    cart =
      cart.filter(
        function(x){

          return String(x.product_id) !==
            String(id);

        }
      );
  }

  saveCart();
}


/* =========================================================
   RENDER CART
========================================================= */

function renderCart(){

  const box =
    document.getElementById("cart");

  const button =
    document.getElementById("placeOrderBtn");

  if(!cart.length){

    box.innerHTML =
      '<p class="empty">Your cart is empty.</p>';

    document.getElementById("subtotal")
      .textContent = "₹0";

    document.getElementById("shipping")
      .textContent = "₹0";

    document.getElementById("grandTotal")
      .textContent = "₹0";

    button.disabled = true;

    return;
  }

  const totals = getTotals();

  box.innerHTML =
    cart.map(
      function(item){

        const quantity =
          Number(item.quantity || 1);

        const line =
          Number(item.price || 0) * quantity;

        return `
          <div class="item">

            <img
              src="${escapeHtml(item.image_url || "")}"
              alt="${escapeHtml(item.name)}"
            >

            <div>

              <div class="item-name">
                ${escapeHtml(item.name)}
              </div>

              <div class="item-price">
                ${money(item.price)} each
              </div>

              <div class="qty">

                <button
                  type="button"
                  onclick="changeQty(${Number(item.product_id)},-1)"
                >
                  −
                </button>

                <span>
                  ${quantity}
                </span>

                <button
                  type="button"
                  onclick="changeQty(${Number(item.product_id)},1)"
                >
                  +
                </button>

              </div>

            </div>

            <div class="line-total">
              ${money(line)}
            </div>

          </div>
        `;

      }
    ).join("");

  document.getElementById("subtotal")
    .textContent =
      money(totals.subtotal);

  document.getElementById("shipping")
    .textContent =
      money(totals.shipping);

  document.getElementById("grandTotal")
    .textContent =
      money(totals.total);

  button.disabled = false;
}


/* =========================================================
   OPTIONAL PRODUCT FROM URL
   checkout.html?id=123
========================================================= */

async function addUrlProductIfNeeded(){

  const id =
    new URLSearchParams(
      location.search
    ).get("id");

  if(!id){

    renderCart();

    return;
  }

  const exists =
    cart.find(
      function(x){

        return String(x.product_id) ===
          String(id);

      }
    );

  if(exists){

    renderCart();

    return;
  }

  const result =
    await supabaseClient
      .from("products")
      .select(
        "id,name,price,sale_price,image_url,stock,status"
      )
      .eq("id",id)
      .eq("status","active")
      .maybeSingle();

  if(result.error || !result.data){

    showError(
      "Product could not be loaded."
    );

    return;
  }

  const product = result.data;

  if(Number(product.stock || 0) < 1){

    showError(
      "This product is out of stock."
    );

    return;
  }

  cart.push({

    product_id:product.id,

    name:product.name,

    price:
      Number(
        product.sale_price ??
        product.price ??
        0
      ),

    image_url:
      product.image_url || "",

    quantity:1

  });

  saveCart();
}


/* =========================================================
   ERROR MESSAGE
========================================================= */

function showError(text){

  document.getElementById("message")
    .innerHTML =
      '<div class="error">' +
      escapeHtml(text) +
      '</div>';

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* =========================================================
   CUSTOMER / ORDER DATA
========================================================= */

function getOrderData(){

  const params =
    new URLSearchParams(
      location.search
    );

  return {

    customer_name:
      document
        .getElementById("name")
        .value
        .trim(),

    customer_email:
      document
        .getElementById("email")
        .value
        .trim() || null,

    customer_phone:
      document
        .getElementById("phone")
        .value
        .trim(),

    address_line1:
      document
        .getElementById("address1")
        .value
        .trim(),

    address_line2:
      document
        .getElementById("address2")
        .value
        .trim() || null,

    city:
      document
        .getElementById("city")
        .value
        .trim(),

    state:
      document
        .getElementById("state")
        .value
        .trim(),

    postal_code:
      document
        .getElementById("postal")
        .value
        .trim(),

    country:"India",

    notes:
      document
        .getElementById("notes")
        .value
        .trim() || null,

    payment_method:
      "razorpay",

    source:
      params.get("utm_source") ||
      "website",

    medium:
      params.get("utm_medium") ||
      "website",

    campaign:
      params.get("utm_campaign") ||
      null,

    landing_page:
      location.href,

    referrer:
      document.referrer ||
      null,

    session_id:
      localStorage.getItem(
        "trendsbyak_session_id"
      ) || null,

    items:
      cart.map(
        function(x){

          return {
            product_id:Number(x.product_id),
            quantity:Number(x.quantity)
          };

        }
      ),

    discount:0,

    shipping_fee:0,

    tax:0
  };
}


/* =========================================================
   VALIDATE CUSTOMER
========================================================= */

function validateCustomer(){

  const data =
    getOrderData();

  if(
    !data.customer_name ||
    !data.customer_phone ||
    !data.address_line1 ||
    !data.city ||
    !data.state ||
    !data.postal_code
  ){

    showError(
      "Please fill all required delivery details."
    );

    return false;
  }

  if(
    !/^[0-9+ ()-]{8,18}$/.test(
      data.customer_phone
    )
  ){

    showError(
      "Please enter a valid phone number."
    );

    return false;
  }

  if(
    !/^[0-9]{6}$/.test(
      data.postal_code
    )
  ){

    showError(
      "Please enter a valid 6-digit PIN code."
    );

    return false;
  }

  if(
    data.customer_email &&
    !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
      data.customer_email
    )
  ){

    showError(
      "Please enter a valid email address."
    );

    return false;
  }

  return true;
}


/* =========================================================
   RAZORPAY PAYMENT
========================================================= */

async function startRazorpayPayment(){

  const button =
    document.getElementById(
      "placeOrderBtn"
    );

  button.textContent =
    "Creating secure payment...";

  try{

    const orderData =
      getOrderData();

    const result =
      await supabaseClient.functions.invoke(
        "create-razorpay-order",
        {
          body:{
            items:
              orderData.items,

            customer:{
              name:
                orderData.customer_name,

              email:
                orderData.customer_email,

              phone:
                orderData.customer_phone,

              address_line1:
                orderData.address_line1,

              address_line2:
                orderData.address_line2,

              city:
                orderData.city,

              state:
                orderData.state,

              postal_code:
                orderData.postal_code,

              country:
                orderData.country,

              notes:
                orderData.notes
            },

            attribution:{
              source:
                orderData.source,

              medium:
                orderData.medium,

              campaign:
                orderData.campaign,

              landing_page:
                orderData.landing_page,

              referrer:
                orderData.referrer,

              session_id:
                orderData.session_id
            }
          }
        }
      );

    if(result.error){

      console.error(
        "Razorpay create order error:",
        result.error
      );

      showError(
        result.error.message ||
        "Could not start Razorpay payment."
      );

      button.disabled = false;

      selectPayment("razorpay");

      return;
    }

    const data =
      result.data;

    if(!data?.order_id){

      console.error(
        "Invalid Razorpay response:",
        data
      );

      showError(
        data?.error ||
        "Razorpay order could not be created."
      );

      button.disabled = false;

      selectPayment("razorpay");

      return;
    }


    /* ================================================
       RAZORPAY CHECKOUT
    ================================================ */

    const options = {

      key:
        data.key_id,

      amount:
        data.amount,

      currency:
        data.currency || "INR",

      name:
        "Trends by AK",

      description:
        "Trends by AK order",

      order_id:
        data.order_id,

      prefill:{

        name:
          orderData.customer_name,

        email:
          orderData.customer_email || "",

        contact:
          orderData.customer_phone

      },

      notes:{

        order_number:
          data.order_number || ""

      },

      theme:{
        color:"#1d1d1d"
      },

      modal:{

        ondismiss:function(){

          button.disabled = false;

          selectPayment("razorpay");

          showError(
            "Payment was cancelled. Your order is still pending payment."
          );

        }

      },

      handler:
        async function(response){

          await verifyRazorpayPayment(
            response
          );

        }

    };


    if(typeof Razorpay === "undefined"){

      showError(
        "Razorpay could not be loaded. Please refresh the page and try again."
      );

      button.disabled = false;

      selectPayment("razorpay");

      return;
    }


    const razorpay =
      new Razorpay(options);


    razorpay.on(
      "payment.failed",
      function(response){

        console.error(
          "Razorpay payment failed:",
          response?.error
        );

        showError(
          response?.error?.description ||
          "Payment failed. Please try again."
        );

        button.disabled = false;

        selectPayment("razorpay");

      }
    );


    razorpay.open();

  }catch(error){

    console.error(
      "Razorpay error:",
      error
    );

    showError(
      "Could not connect to Razorpay. Please try again."
    );

    button.disabled = false;

    selectPayment("razorpay");
  }
}


/* =========================================================
   VERIFY RAZORPAY PAYMENT
========================================================= */

async function verifyRazorpayPayment(response){

  const button =
    document.getElementById(
      "placeOrderBtn"
    );

  button.disabled = true;

  button.textContent =
    "Verifying payment...";

  try{

    const result =
      await supabaseClient.functions.invoke(
        "verify-razorpay-payment",
        {
          body:{

            razorpay_payment_id:
              response.razorpay_payment_id,

            razorpay_order_id:
              response.razorpay_order_id,

            razorpay_signature:
              response.razorpay_signature

          }
        }
      );


    if(result.error){

      console.error(
        "Payment verification error:",
        result.error
      );

      showError(
        result.error.message ||
        "Payment verification failed."
      );

      button.disabled = false;

      selectPayment("razorpay");

      return;
    }


    const data =
      result.data;


    if(!data?.success){

      showError(
        data?.error ||
        "Payment could not be verified."
      );

      button.disabled = false;

      selectPayment("razorpay");

      return;
    }


    /*
      Payment has been verified by
      the Supabase backend.
    */

    localStorage.removeItem(
      "trendsbyak_cart"
    );

    cart = [];


    window.location.href =
      data.redirect_url ||
      (
        "/payment-success.html?order=" +
        encodeURIComponent(
          data.order_number || ""
        )
      );

  }catch(error){

    console.error(
      "Verification exception:",
      error
    );

    showError(
      "Payment verification failed. Please contact Trends by AK if money was deducted."
    );

    button.disabled = false;

    selectPayment("razorpay");
  }
}

        {
          order_data:{
            ...orderData,
            payment_method:"whatsapp"
          }
        }
      );


    if(result.error){

      console.error(
        "WhatsApp order error:",
        result.error
      );

      showError(
        result.error.message ||
        "Could not create your order."
      );

      button.disabled = false;

      selectPayment("whatsapp");

      return;
    }


    const order =
      result.data || {};


    const orderNumber =
      order.order_number || "";


    const total =
      order.total ??
      getTotals().total;


    const customerName =
      document
        .getElementById("name")
        .value
        .trim();


    /*
      Clear cart only after
      order has successfully been created.
    */

    localStorage.removeItem(
      "trendsbyak_cart"
    );

    cart = [];


    const message =
      "Hi Trends by AK!%0A%0A" +

      "I have placed an order.%0A" +

      "Order No: " +
      encodeURIComponent(orderNumber) +
      "%0A" +

      "Customer: " +
      encodeURIComponent(customerName) +
      "%0A" +

      "Total: " +
      encodeURIComponent(
        money(total)
      ) +

      "%0A%0A" +

      "Please share the payment instructions.";


    window.location.href =
      "https://wa.me/" +
      WHATSAPP_NUMBER +
      "?text=" +
      message;

  }catch(error){

    console.error(
      "WhatsApp order exception:",
      error
    );

    showError(
      "Could not create your order. Please try again."
    );

    button.disabled = false;

    selectPayment("whatsapp");
  }
}


/* =========================================================
   MAIN ORDER BUTTON
========================================================= */

async function placeOrder(){

  document.getElementById(
    "message"
  ).innerHTML = "";


  if(!cart.length){

    showError(
      "Your cart is empty."
    );

    return;
  }


  if(!validateCustomer()){

    return;
  }


  const method =
    document.querySelector(
      'input[name="paymentMethod"]:checked'
    )?.value ||
    "razorpay";


  const button =
    document.getElementById(
      "placeOrderBtn"
    );


  button.disabled = true;


  if(method === "whatsapp"){

    await createWhatsAppOrder();

    return;
  }


  await startRazorpayPayment();
}


/* =========================================================
   START
========================================================= */

selectPayment("razorpay");

addUrlProductIfNeeded();

</script>
