const URL="https://ltxrycmreumoqfpcbwnb.supabase.co",KEY="sb_publishable_wdc4ImKB1f0Q-v4Po9DOwA_xIpPXHkh",db=window.supabase.createClient(URL,KEY),WA="918433998962";let cart=JSON.parse(localStorage.getItem('trendsbyak_cart')||'[]'),coupons=[],appliedCoupon=null,productMap=new Map();function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}function money(v){return '₹'+Number(v||0).toLocaleString('en-IN')}function msg(t,err=true){const e=document.getElementById('message');e.textContent=t;e.className='msg show '+(err?'err':'ok');window.scrollTo({top:0,behavior:'smooth'})}function selectPayment(m){document.getElementById('razorpayOption').classList.toggle('selected',m==='razorpay');document.getElementById('whatsappOption').classList.toggle('selected',m==='whatsapp');document.getElementById('place').textContent=m==='whatsapp'?'Create Order & Continue to WhatsApp':'Place Order & Pay'}function totals(){return cart.reduce((s,x)=>s+Number(x.price||0)*Number(x.quantity||0),0)}function discountFor(c){if(!c)return 0;const min=Number(c.min_order_value||0),sub=totals();if(sub<min)return 0;const ids=Array.isArray(c.product_ids)?c.product_ids.map(Number):[],cats=Array.isArray(c.categories)?c.categories.map(x=>String(x).toLowerCase()):[],restricted=ids.length||cats.length;let eligible=0;for(const x of cart){const p=productMap.get(Number(x.product_id));if(!p)continue;if(!restricted||ids.includes(Number(x.product_id))||cats.includes(String(p.category||'').toLowerCase()))eligible+=Number(x.price||0)*Number(x.quantity||0)}if(eligible<=0)return 0;let d=c.discount_type==='percent'?eligible*Number(c.discount_value||0)/100:Math.min(Number(c.discount_value||0),eligible);if(c.max_discount!=null)d=Math.min(d,Number(c.max_discount));return Math.round(Math.max(0,d)*100)/100}function renderTotals(){const sub=totals(),d=discountFor(appliedCoupon);document.getElementById('subtotal').textContent=money(sub);document.getElementById('discount').textContent='-'+money(d);document.getElementById('discountRow').style.display=d>0?'flex':'none';document.getElementById('total').textContent=money(Math.max(0,sub-d));document.getElementById('couponApplied').textContent=d>0?'Coupon '+appliedCoupon.code+' applied — you save '+money(d):''}function renderOffers(){const box=document.getElementById('offersBox');if(!coupons.length){box.innerHTML='<div class="offer-note">No active offers apply to this cart right now.</div>';return}box.innerHTML=coupons.map(c=>{const d=discountFor(c),min=Number(c.min_order_value||0),remaining=Math.max(0,min-totals()),needsEmail=Number(c.per_customer_limit||0)>0&&!document.getElementById('email').value.trim();return `<div class="offer"><div class="offerline"><div><code>${esc(c.code)}</code><small>${esc(c.description||((c.discount_type==='percent'?c.discount_value+'% off':money(c.discount_value)+' off')))}</small></div><button class="apply ${appliedCoupon&&appliedCoupon.id===c.id?'applied':''}" data-code="${esc(c.code)}">${appliedCoupon&&appliedCoupon.id===c.id?'Applied':'Apply'}</button></div>${remaining>0?`<div class="offer-note">Add ${money(remaining)} more to use this offer.</div>`:''}${needsEmail?'<div class="offer-note">Email is required to verify this coupon.</div>':''}</div>`}).join('')}async function loadOffers(){if(!cart.length)return;const ids=[...new Set(cart.map(x=>Number(x.product_id)).filter(Number.isFinite))];const pr=await db.from('products').select('id,category').in('id',ids);if(pr.error){document.getElementById('offersBox').innerHTML='<div class="offer-note">Offers could not be loaded.</div>';return}(pr.data||[]).forEach(p=>productMap.set(Number(p.id),p));const cr=await db.from('coupons').select('id,code,description,discount_type,discount_value,min_order_value,max_discount,product_ids,categories,per_customer_limit').order('created_at',{ascending:false});if(cr.error){document.getElementById('offersBox').innerHTML='<div class="offer-note">Offers could not be loade aign,landing_page:d.landing_page,referrer:d.referrer,session_id:d.session_id}}});if(r.error||!r.data?.order_id){msg(r.error?.message||r.data?.error||'Could not start payment.');button.disabled=false;selectPayment('razorpay');return}const o=r.data;const rp=new Razorpay({key:o.key_id,amount:o.amount,currency:o.currency||'INR',name:'Trends by AK',description:'Trends by AK order',order_id:o.order_id,prefill:{name:d.customer_name,email:d.customer_email||'',contact:d.customer_phone},handler:verify,modal:{ondismiss:()=>{button.disabled=false;selectPayment('razorpay')}}});rp.on('payment.failed',x=>{msg(x?.error?.description||'Payment failed.');button.disabled=false;selectPayment('razorpay')});rp.open()}async function verify(r){const b=document.getElementById('place');b.textContent='Verifying payment...';const x=await db.functions.invoke('verify-razorpay-payment',{body:{razorpay_payment_id:r.razorpay_payment_id,razorpay_order_id:r.razorpay_order_id,razorpay_signature:r.razorpay_signature}});if(x.error||!x.data?.success){msg(x.error?.message||x.data?.error||'Payment verification failed.');b.disabled=false;selectPayment('razorpay');return}localStorage.removeItem('trendsbyak_cart');location.href=x.data.redirect_url||('/payment-success.html?order='+encodeURIComponent(x.data.order_number||''))}async function placeOrder(){document.getElementById('message').className='msg';if(!cart.length){msg('Your cart is empty.');return}const d=data();if(window.TAKTracker){window.TAKTracker.identify({name:d.customer_name,email:d.customer_email,phone:d.customer_phone});window.TAKTracker.event('checkout_submit');}if(!validate(d))return;const b=document.getElementById('place');b.disabled=true;const method=document.querySelector('input[name="payment"]:checked')?.value||'razorpay';if(method==='whatsapp')await createWhatsApp();else await razorpay()}document.getElementById('email').addEventListener('input',()=>{if(appliedCoupon&&Number(appliedCoupon.per_customer_limit||0)>0)renderOffers()});document.ge
