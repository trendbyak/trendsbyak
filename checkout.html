function escapeHtml(v){

    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",

  );

/*
 * VERIFY RAZORPAY PAYMENT
 */
async function verifyRazorpayPayment(
  response
){

  const btn =
    document.getElementById(
      "placeOrderBtn"
    );

  btn.disabled = true;

  btn.textContent =
    "Verifying payment...";

  try{

    const {
      data,
      error
    } =
      await supabaseClient.functions.invoke(
        "verify-razorpay-payment",
        {
          body:{

            razorpay_payment_id:
              response.razorpay_payment_id,

            razorpay_order_id:
              response.razorpay_order_id,

            razorpay_signature:
              response.razorpay_signature

          }

        }
      );

    if(error){

      console.error(
        "Payment verification error:",
        error
      );

      showError(
        error.message ||
        "Payment verification failed."
      );

      btn.disabled = false;

      selectPayment("razorpay");

      return;

    }

    if(!data?.success){

      showError(
        data?.error ||
        "Payment could not be verified."
      );

      btn.disabled = false;

      selectPayment("razorpay");

      return;

    }

    /*
     * Payment has been verified by the
     * Supabase backend.
     */

    localStorage.removeItem(
      "trendsbyak_cart"
    );

    cart = [];

    window.location.href =
      data.redirect_url ||
      (
        "/payment-success.html?order=" +
        encodeURIComponent(
          data.order_number || ""
        )
      );

  }catch(error){

    console.error(
      "Verification exception:",
      error
    );

    showError(
      "Payment verification failed. Please contact Trends by AK if money was deducted."
    );

    btn.disabled = false;

    selectPayment("razorpay");

  }

}


/*
 * MAIN ORDER BUTTON
 */
async function placeOrder(){

  document.getElementById(
    "message"
  ).innerHTML = "";

  if(!cart.length){

    showError(
      "Your cart is empty."
    );

    return;

  }

  if(!validateCustomer())return;

  const method =
    document.querySelector(
      'input[name="paymentMethod"]:checked'
    )?.value ||
    "razorpay";

  const btn =
    document.getElementById(
      "placeOrderBtn"
    );

  btn.disabled = true;

  /*
   * WHATSAPP ORDER
   */
  if(method === "whatsapp"){

    btn.textContent =
      "Creating order...";

    const result =
      await supabaseClient.rpc(
        "create_guest_order",
        {
          order_data:{
            ...getOrderData(),

            payment_method:
              "whatsapp"
          }
        }
      );

    if(result.error){

      console.error(
        result.error
      );

      showError(
        result.error.message ||
        "Could not create your order."
      );

      btn.disabled = false;

      selectPayment(
        "whatsapp"
      );

      return;

    }

    const order =
      result.data || {};

    const orderNumber =
      order.order_number || "";

    const total =
      order.total ??
      getTotals().total;

    const customerName =
      document
        .getElementById("name")
        .value
        .trim();

    localStorage.removeItem(
      "trendsbyak_cart"
    );

    cart = [];

    const message =
      `Hi Trends by AK!%0A%0A` +
      `I have placed an order.%0A` +
      `Order No: ${encodeURIComponent(orderNumber)}%0A` +
      `Customer: ${encodeURIComponent(customerName)}%0A` +
      `Total: ${encodeURIComponent(money(total))}%0A%0A` +
      `Please share the payment instructions.`;

    window.location.href =
      `https://wa.me/${WHATSAPP_NUMBER}?text=${message}`;

    return;

  }

  /*
   * RAZORPAY
   */
  await startRazorpayPayment();

}
