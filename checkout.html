<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | Trends by AK</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f4ef;color:#222;font-family:Arial,sans-serif}
header{background:#1b1b1b;color:#fff;padding:18px 24px}
header h1{margin:0;font-size:22px}
.wrap{max-width:1100px;margin:35px auto;padding:0 18px}
.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:24px}
.card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.05)}
h2{margin-top:0}
label{display:block;font-size:13px;margin:14px 0 6px;color:#555}
input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font:inherit}
input:focus,textarea:focus{outline:none;border-color:#b28a4b;box-shadow:0 0 0 3px rgba(178,138,75,.12)}
textarea{min-height:80px;resize:vertical}
.item{display:grid;grid-template-columns:58px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid #eee}
.item:last-child{border-bottom:0}
.item img{width:58px;height:58px;border-radius:8px;object-fit:cover;background:#f2f0ec}
.item-name{font-weight:700}
.item-price{font-size:12px;color:#777;margin-top:4px}
.qty{display:flex;align-items:center;gap:8px;margin-top:8px}
.qty button{width:30px;height:30px;border:1px solid #ddd;background:#fff;border-radius:6px;cursor:pointer}
.line-total{text-align:right;font-weight:700}
.summary-row{display:flex;justify-content:space-between;font-size:14px;padding:8px 0;color:#666}
.summary-row.total{border-top:1px solid #eee;margin-top:8px;padding-top:16px;color:#222;font-size:20px;font-weight:700}
.payment{margin-top:22px}
.payment-title{font-size:16px;font-weight:700;margin-bottom:10px}
.payment-option{display:flex;align-items:flex-start;gap:11px;border:1px solid #ddd;border-radius:11px;padding:15px;margin:10px 0;cursor:pointer}
.payment-option.selected{border-color:#b28a4b;background:#faf7f1}
.payment-option input{width:auto;margin-top:3px}
.payment-content strong{display:block;font-size:14px}
.payment-content span{display:block;color:#777;font-size:12px;margin-top:4px;line-height:1.4}
.btn{width:100%;border:0;border-radius:9px;padding:14px;background:#1d1d1d;color:#fff;font-weight:600;cursor:pointer;margin-top:18px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.note{background:#faf8f4;padding:12px;border-radius:8px;color:#666;font-size:13px;margin-top:15px;line-height:1.5}
.error{color:#b3261e;background:#fff0ef;padding:12px;border-radius:8px;margin-bottom:18px}
.success{text-align:center;padding:35px}
.success h2{color:#547653}
.small{font-size:12px;color:#777}
.back{display:inline-block;margin-bottom:20px;color:#222;text-decoration:none;font-size:13px}
@media(max-width:750px){.grid{grid-template-columns:1fr}.item{grid-template-columns:50px 1fr}.item img{width:50px;height:50px}.line-total{grid-column:2;text-align:left}}
</style>
</head>
<body>
<header><h1>Trends by AK — Checkout</h1></header>

<div class="wrap">
  <a class="back" href="cart.html">← Back to Cart</a>
  <div id="message"></div>

  <div class="grid" id="checkoutGrid">
    <section class="card">
      <h2>Delivery details</h2>

      <label>Full name *</label>
      <input id="name" autocomplete="name">

      <label>Phone *</label>
      <input id="phone" inputmode="tel" autocomplete="tel">

      <label>Email</label>
      <input id="email" type="email" autocomplete="email">

      <label>Address *</label>
      <input id="address1" autocomplete="street-address">

      <label>Apartment / Landmark</label>
      <input id="address2">

      <label>City *</label>
      <input id="city" autocomplete="address-level2">

      <label>State *</label>
      <input id="state" autocomplete="address-level1">

      <label>PIN code *</label>
      <input id="postal" inputmode="numeric" autocomplete="postal-code">

      <label>Order notes</label>
      <textarea id="notes" placeholder="Any delivery instructions?"></textarea>

      <div class="payment">
        <div class="payment-title">Payment method</div>

        <label class="payment-option selected" id="payuOption">
          <input type="radio" name="paymentMethod" value="payu" checked onchange="selectPayment('payu')">
          <div class="payment-content">
            <strong>Pay Online — PayU</strong>
            <span>Secure checkout using UPI, cards, net banking and the payment methods enabled on your PayU account.</span>
          </div>
        </label>

        <label class="payment-option" id="whatsappOption">
          <input type="radio" name="paymentMethod" value="whatsapp" onchange="selectPayment('whatsapp')">
          <div class="payment-content">
            <strong>Pay via WhatsApp</strong>
            <span>Create your order as payment pending and continue to WhatsApp for payment instructions.</span>
          </div>
        </label>
      </div>

      <button class="btn" id="placeOrderBtn" onclick="placeOrder()">Place Order &amp; Pay</button>

      <div class="note">
        Cash on Delivery is not available. PayU payment is being connected securely through the server.
      </div>
    </section>

    <aside class="card">
      <h2>Your order</h2>
      <div id="cart"></div>

      <div class="summary-row"><span>Subtotal</span><span id="subtotal">₹0</span></div>
      <div class="summary-row"><span>Shipping</span><span id="shipping">₹0</span></div>
      <div class="summary-row total"><span>Total</span><span id="grandTotal">₹0</span></div>
    </aside>
  </div>
</div>

<script>
const SUPABASE_URL = "https://ltxrycmreumoqfpcbwnb.supabase.co";
const SUPABASE_KEY = "sb_publishable_wdc4ImKB1f0Q-v4Po9DOwA_xIpPXHkh";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const WHATSAPP_NUMBER = "918433998962";
let cart = JSON.parse(localStorage.getItem("trendsbyak_cart") || "[]");

function money(n){
  return "₹" + Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
}

function escapeHtml(v){
  return String(v??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function selectPayment(method){
  document.getElementById("payuOption").classList.toggle("selected",method==="payu");
  document.getElementById("whatsappOption").classList.toggle("selected",method==="whatsapp");
  document.getElementById("placeOrderBtn").textContent =
    method==="whatsapp" ? "Create Order & Continue to WhatsApp" : "Place Order & Pay";
}

function getTotals(){
  const subtotal=cart.reduce((sum,item)=>
    sum+Number(item.price||0)*Number(item.quantity||0),0);
  return {subtotal,shipping:0,total:subtotal};
}

async function addUrlProductIfNeeded(){
  const id=new URLSearchParams(location.search).get("id");
  if(!id){renderCart();return;}

  const exists=cart.find(x=>String(x.product_id)===String(id));
  if(exists){renderCart();return;}

  const {data,error}=await supabaseClient.from("products")
    .select("id,name,price,sale_price,image_url,stock,status")
    .eq("id",id).eq("status","active").maybeSingle();

  if(error||!data)return showError("Product could not be loaded.");
  if(Number(data.stock||0)<1)return showError("This product is out of stock.");

  cart.push({
    product_id:data.id,
    name:data.name,
    price:Number(data.sale_price||data.price||0),
    image_url:data.image_url||"",
    quantity:1
  });
  saveCart();
}

function saveCart(){
  localStorage.setItem("trendsbyak_cart",JSON.stringify(cart));
  renderCart();
}

function changeQty(id,delta){
  const item=cart.find(x=>String(x.product_id)===String(id));
  if(!item)return;
  item.quantity+=delta;
  if(item.quantity<1)cart=cart.filter(x=>String(x.product_id)!==String(id));
  saveCart();
}

function renderCart(){
  const box=document.getElementById("cart");
  const btn=document.getElementById("placeOrderBtn");

  if(!cart.length){
    box.innerHTML="<p>Your cart is empty.</p>";
    document.getElementById("subtotal").textContent="₹0";
    document.getElementById("shipping").textContent="₹0";
    document.getElementById("grandTotal").textContent="₹0";
    btn.disabled=true;
    return;
  }

  const totals=getTotals();

  box.innerHTML=cart.map(item=>{
    const quantity=Number(item.quantity||1);
    const line=Number(item.price||0)*quantity;
    return `<div class="item">
      <img src="${escapeHtml(item.image_url||"")}" alt="${escapeHtml(item.name)}">
      <div>
        <div class="item-name">${escapeHtml(item.name)}</div>
        <div class="item-price">${money(item.price)} each</div>
        <div class="qty">
          <button onclick="changeQty(${Number(item.product_id)},-1)">−</button>
          <span>${quantity}</span>
          <button onclick="changeQty(${Number(item.product_id)},1)">+</button>
        </div>
      </div>
      <div class="line-total">${money(line)}</div>
    </div>`;
  }).join("");

  document.getElementById("subtotal").textContent=money(totals.subtotal);
  document.getElementById("shipping").textContent=money(totals.shipping);
  document.getElementById("grandTotal").textContent=money(totals.total);
  btn.disabled=false;
}

function showError(text){
  document.getElementById("message").innerHTML='<div class="error">'+escapeHtml(text)+'</div>';
  window.scrollTo({top:0,behavior:"smooth"});
}

function getOrderData(){
  const params=new URLSearchParams(location.search);

  return {
    customer_name:document.getElementById("name").value.trim(),
    customer_email:document.getElementById("email").value.trim() || null,
    customer_phone:document.getElementById("phone").value.trim(),
    address_line1:document.getElementById("address1").value.trim(),
    address_line2:document.getElementById("address2").value.trim() || null,
    city:document.getElementById("city").value.trim(),
    state:document.getElementById("state").value.trim(),
    postal_code:document.getElementById("postal").value.trim(),
    country:"India",
    notes:document.getElementById("notes").value.trim() || null,
    payment_method:"payu",
    source:params.get("utm_source") || "website",
    medium:params.get("utm_medium") || "website",
    campaign:params.get("utm_campaign") || null,
    landing_page:location.href,
    referrer:document.referrer || null,
    session_id:localStorage.getItem("trendsbyak_session_id") || null,
    items:cart.map(x=>({
      product_id:Number(x.product_id),
      quantity:Number(x.quantity)
    })),
    discount:0,
    shipping_fee:0,
    tax:0
  };
}

function validateCustomer(){
  const data=getOrderData();

  if(!data.customer_name||!data.customer_phone||!data.address_line1||
     !data.city||!data.state||!data.postal_code){
    showError("Please fill all required delivery details.");
    return false;
  }

  if(!/^[0-9+ ()-]{8,18}$/.test(data.customer_phone)){
    showError("Please enter a valid phone number.");
    return false;
  }

  if(!/^[0-9]{6}$/.test(data.postal_code)){
    showError("Please enter a valid 6-digit PIN code.");
    return false;
  }

  return true;
}

async function placeOrder(){
  document.getElementById("message").innerHTML="";
  if(!cart.length)return showError("Your cart is empty.");
  if(!validateCustomer())return;

  const method=document.querySelector('input[name="paymentMethod"]:checked')?.value || "payu";
  const btn=document.getElementById("placeOrderBtn");
  btn.disabled=true;

  if(method==="whatsapp"){
    btn.textContent="Creating order...";

    const result=await supabaseClient.rpc("create_guest_order",{
      order_data:{
        ...getOrderData(),
        payment_method:"whatsapp"
      }
    });

    if(result.error){
      console.error(result.error);
      showError(result.error.message || "Could not create your order.");
      btn.disabled=false;
      selectPayment("whatsapp");
      return;
    }

    const order=result.data || {};
    const orderNumber=order.order_number || "";
    const total=order.total ?? getTotals().total;
    const customerName=document.getElementById("name").value.trim();

    localStorage.removeItem("trendsbyak_cart");
    cart=[];

    const message =
      `Hi Trends by AK!%0A%0A`+
      `I have placed an order.%0A`+
      `Order No: ${encodeURIComponent(orderNumber)}%0A`+
      `Customer: ${encodeURIComponent(customerName)}%0A`+
      `Total: ${encodeURIComponent(money(total))}%0A%0A`+
      `Please share the payment instructions.`;

    window.location.href=`https://wa.me/${WHATSAPP_NUMBER}?text=${message}`;
    return;
  }

  btn.textContent="Starting secure PayU payment...";

  try{
    const {data,error}=await supabaseClient.functions.invoke("create-payu-payment",{
      body:{order_data:getOrderData()}
    });

    if(error){
      console.error(error);
      showError(error.message || "Could not start PayU payment.");
      btn.disabled=false;
      selectPayment("payu");
      return;
    }

    if(!data?.checkout_url){
      showError(data?.error || "PayU did not return a payment URL.");
      btn.disabled=false;
      selectPayment("payu");
      return;
    }

    window.location.href=data.checkout_url;
  }catch(error){
    console.error(error);
    showError("Could not connect to PayU. Please try again.");
    btn.disabled=false;
    selectPayment("payu");
  }
}

addUrlProductIfNeeded();
</script>
</body>
</html>
