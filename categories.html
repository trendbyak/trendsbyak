<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Shop categories at Trends by AK — jewellery, scrunchies, hair accessories, gifts and more.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://trendsbyak.in/categories.html">
<title>Shop by Category | Trends by AK</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#f8f4ed;color:#1d1b19}.categories-page{max-width:1200px;margin:auto;padding:34px 20px 70px}.categories-head{text-align:center;margin-bottom:30px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#8b6b42;font-weight:700}.categories-head h1{font-family:"Playfair Display",serif;font-size:clamp(32px,5vw,48px);margin:7px 0 8px}.categories-head p{color:#6f6860;margin:0}.category-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}.category-card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #e7e1d8;border-radius:18px;padding:14px;text-align:center;box-shadow:0 8px 25px rgba(29,27,25,.05);transition:transform .2s,box-shadow .2s}.category-card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(29,27,25,.1)}.category-card img,.category-placeholder{width:120px;height:120px;border-radius:50%;object-fit:cover;margin:auto;background:#eee3d3;display:block}.category-card h2{font-size:14px;margin:12px 0 2px;font-weight:700}.empty{text-align:center;color:#777;padding:40px}.back{display:inline-block;margin-bottom:22px;color:#1d1b19;text-decoration:none;font-size:13px;font-weight:700}
@media(max-width:500px){.category-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.category-card img,.category-placeholder{width:100px;height:100px}}
</style>
</head>
<body>
<main class="categories-page">
<a class="back" href="index.html">← Back to Trends by AK</a>
<header class="categories-head">
<div class="eyebrow">Trends by AK</div>
<h1>Shop by Category</h1>
<p>Find your favourites, all in one place.</p>
</header>
<section id="grid" class="category-grid"><div class="empty">Loading categories…</div></section>
</main>
<script>
const db=window.supabase.createClient("https://ltxrycmreumoqfpcbwnb.supabase.co","sb_publishable_wdc4ImKB1f0Q-v4PoPXHkh");
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function load(){
 const r=await db.from("categories").select("name,thumbnail_url,display_order").order("display_order",{ascending:true}).order("name");
 if(r.error){document.getElementById("grid").innerHTML='<div class="empty">Categories could not be loaded.</div>';return}
 const cats=r.data||[];
 document.getElementById("grid").innerHTML=cats.map(c=>{
   const name=String(c.name||"").trim();
   const img=c.thumbnail_url||"";
   return '<a class="category-card" href="shop.html?category='+encodeURIComponent(name)+'">'+(img?'<img src="'+esc(img)+'" alt="'+esc(name)+'" loading="lazy" onerror="this.style.opacity=.25">':'<div class="category-placeholder"></div>')+'<h2>'+esc(name)+'</h2></a>';
 }).join("")||'<div class="empty">No categories available yet.</div>';
}
load();
</script>
</body>
</html>
