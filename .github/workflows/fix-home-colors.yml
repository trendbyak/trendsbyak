name: Apply Trends by AK homepage colors

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-home-colors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply beige and gold homepage palette
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8-sig")
          marker = "/* TRENDS BY AK — BEIGE GOLD HOMEPAGE PALETTE */"

          if marker in text:
              print("Palette already applied; nothing to do.")
              raise SystemExit(0)

          override = '''
<style>
/* TRENDS BY AK — BEIGE GOLD HOMEPAGE PALETTE */
:root {
    --cream: #fbf6ee !important;
    --beige: #f3e8d8 !important;
    --soft-beige: #e7d6bd !important;
    --gold: #a77b3f !important;
    --text: #342b24 !important;
    --muted: #806f5d !important;
    --border: #dfcfb8 !important;
}

body {
    background: #fbf6ee !important;
    color: #342b24 !important;
}

.site-header,
.brand-copy strong,
.main-nav a {
    background-color: #fffaf3 !important;
    color: #342b24 !important;
}

.site-header {
    border-bottom-color: #dfcfb8 !important;
}

.announcement {
    background: #a77b3f !important;
    color: #fffaf3 !important;
}

.trust-strip,
.home-category-section,
.new-launches-section,
.instagram-section,
.about-section,
.section {
    background-color: #fbf6ee !important;
}

.home-category-section {
    background: #fffaf3 !important;
}

.home-collections-section,
.reviews-section {
    background: #f3e8d8 !important;
}

#homepageCategories .category-image,
#homepageCategories .category-image-fallback,
#homepageCollections .collection-card,
#homepageCollections .collection-image-fallback,
.loading-card,
.instagram-placeholder,
.new-launch-card .product-image {
    background: #eadcc8 !important;
    border-color: #d9c4a6 !important;
}

#homepageCategories .category-name,
#homepageCollections .collection-content h3,
.new-launch-info h3 a,
.section-heading h2,
.home-category-heading h2,
.home-collections-heading h2,
.about-copy h2,
.bulk-copy h2,
.whatsapp-cta h2 {
    color: #342b24 !important;
}

.eyebrow,
.trust-strip span,
.review-stars,
#homepageCategories .category-count,
.new-launch-category {
    color: #a77b3f !important;
}

.trust-strip {
    border-bottom-color: #dfcfb8 !important;
}

.trust-strip > div {
    border-right-color: #dfcfb8 !important;
}

.review-card {
    background: #fffaf3 !important;
    border-color: #dfcfb8 !important;
}

.new-launch-add-cart {
    border-color: #a77b3f !important;
    color: #7f5b2e !important;
}

.new-launch-add-cart:hover,
.btn-dark {
    background: #a77b3f !important;
    color: #fffaf3 !important;
    border-color: #a77b3f !important;
}

.btn-light {
    background: #fffaf3 !important;
    color: #7f5b2e !important;
    border-color: #a77b3f !important;
}

.btn-light:hover {
    background: #a77b3f !important;
    color: #fffaf3 !important;
}

.bulk-section,
.whatsapp-cta {
    background: #eadcc8 !important;
}

.site-footer {
    background: #342b24 !important;
    color: #f3e8d8 !important;
}
</style>
'''

          text = text.replace("</head>", override + "\n</head>", 1)
          path.write_text(text, encoding="utf-8")

      - name: Commit homepage palette
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix homepage beige and gold palette"
          git push
