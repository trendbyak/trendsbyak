<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expenses | Trends by AK</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--b:#171717;--g:#b28a4b;--c:#f7f4ef;--l:#e7e1d8;--m:#777}*{box-sizing:border-box}body{margin:0;background:var(--c);font:14px Arial;color:#222}.top{background:var(--b);color:#fff;padding:14px 18px;display:flex;justify-content:space-between}.top a{color:#fff}.wrap{max-width:1000px;margin:auto;padding:18px 12px}.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.field label{display:block;font-size:11px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--l);border-radius:8px;font:inherit}.full{grid-column:1/-1}.btn{padding:10px 14px;border-radius:8px;border:1px solid var(--l);background:#fff;font-weight:700;cursor:pointer}.primary{background:var(--g);color:#fff;border-color:var(--g)}.danger{color:#a33}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #eee;text-align:left}.table th{font-size:10px;color:var(--m);text-transform:uppercase}.msg{display:none;padding:10px;border-radius:8px;margin-bottom:10px}.show{display:block}.ok{background:#edf7ed;color:#356b35}.err{background:#fff0f0;color:#a33}.muted{color:var(--m)}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.full{grid-column:1/-1}.table-wrap{overflow:auto}.table{min-width:650px}}@media(max-width:480px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><b>Trends by AK · Expenses</b><div><a href="profit.html">Profit Analytics</a> &nbsp; <a href="products.html">Products</a></div></header><main class="wrap"><div id="msg" class="msg"></div><section class="card"><h2 style="margin-top:0">Add business expense</h2><div class="grid"><div class="field"><label>Date</label><input id="date" type="date"></div><div class="field"><label>Expense name *</label><input id="title" placeholder="e.g. Instagram Ads"></div><div class="field"><label>Category</label><select id="category"><option>Materials</option><option>Packaging</option><option>Shipping</option><option>Marketing</option><option>Payment Fees</option><option>Website</option><option>Salary</option><option>Equipment</option><option>Other</option></select></div><div class="field"><label>Amount *</label><input id="amount" type="number" min="0" step="0.01"></div><div class="field full"><label>Notes</label><textarea id="notes" rows="2"></textarea></div></div><button id="save" class="btn primary" style="margin-top:12px">+ Add Expense</button></section><section class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><h2 style="margin:0">Expense history</h2><div><input id="from" type="date" class="btn"><input id="to" type="date" class="btn"><button id="filter" class="btn">Filter</button></div></div><p class="muted">These business expenses are deducted after gross profit. Product-level cost, packaging and shipping are entered on Products or Bulk Excel.</p><div class="table-wrap" style="overflow:auto"><table class="table"><thead><tr><th>Date</th><th>Expense</th><th>Category</th><th>Amount</th><th>Notes</th><th></th></tr></thead><tbody id="body"></tbody></table></div></section></main><script>const U='https://ltxrycmreumoqfpcbwnb.supabase.co',K='sb_publishable_wdc4ImKB1f0Q-v4Po9DOwA_xIpPXHkh',db=window.supabase.createClient(U,K),$=x=>document.getElementById(x);function msg(t,e=false){$('msg').textContent=t;$('msg').className='msg show '+(e?'err':'ok');setTimeout(()=>$('msg').className='msg',3000)}async function auth(){let r=await db.auth.getSession();if(r.error||!r.data.session){location.href='login.html';return false}return true}async function load(){let q=db.from('expenses').select('*').order('expense_date',{ascending:false}).order('created_at',{ascending:false});if($('from').value)q=q.gte('expense_date',$('from').value);if($('to').value)q=q.lte('expense_date',$('to').value);let r=await q;if(r.error)return msg(r.error.message,true);$('body').innerHTML=(r.data||[]).map(x=>`<tr><td>${x.expense_date}</td><td><b>${x.title}</b></td><td>${x.category}</td><td>₹${Number(x.amount||0).toLocaleString('en-IN')}</td><td>${x.notes||''}</td><td><button class="btn danger" onclick="del('${x.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No expenses found.</td></tr>'}async function save(){let amount=Number($('amount').value||0),title=$('title').value.trim();if(!title||amount<=0)return msg('Enter an expense name and amount.',true);let r=await db.from('expenses').insert({expense_date:$('date').value||new Date().toISOString().slice(0,10),title,category:$('category').value,amount,notes:$('notes').value.trim()});if(r.error)return msg(r.error.message,true);$('title').value='';$('amount').value='';$('notes').value='';msg('Expense added.');load()}async function del(id){if(!confirm('Delete this expense?'))return;let r=await db.from('expenses').delete().eq('id',id);if(r.error)return msg(r.error.message,true);load()}$('date').value=new Date().toISOString().slice(0,10);$('save').onclick=save;$('filter').onclick=load;(async()=>{if(await auth())load()})();</script></body></html>
