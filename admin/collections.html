<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Collections | Trends by AK</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f8f5f0;
    color:#292929;
}


/* =========================================
   HEADER
========================================= */

.header{
    background:#292929;
    color:white;
    padding:18px 30px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h1{
    color:#d1ad72;
    font-size:22px;
}

.back{
    color:white;
    text-decoration:none;
    font-size:14px;
}

.back:hover{
    color:#d1ad72;
}


/* =========================================
   CONTAINER
========================================= */

.container{
    max-width:1100px;
    margin:40px auto;
    padding:0 20px;
}

.title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.title h2{
    font-size:30px;
}


/* =========================================
   BOX
========================================= */

.form-box,
.manager{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.form-box{
    margin-bottom:35px;
}

.manager h2{
    margin-bottom:8px;
}

.manager-subtitle{
    color:#777;
    margin-bottom:25px;
}


/* =========================================
   FORM
========================================= */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.full{
    grid-column:1/-1;
}

label{
    font-weight:bold;
    font-size:14px;
}

input,
textarea{
    width:100%;
    padding:12px;

    border:1px solid #ddd;
    border-radius:8px;

    font-family:inherit;
    font-size:14px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

input:focus,
textarea:focus{
    outline:none;
    border-color:#d1ad72;
}


/* =========================================
   IMAGE
========================================= */

.image-preview{
    width:150px;
    height:150px;

    object-fit:cover;

    border-radius:10px;

    margin-top:10px;

    display:none;
}

.current-image-note{
    color:#777;
    font-size:12px;
}


/* =========================================
   BUTTONS
========================================= */

.save-btn{
    margin-top:25px;

    background:#292929;
    color:white;

    border:none;

    padding:14px 30px;

    border-radius:25px;

    cursor:pointer;

    font-size:15px;
}

.save-btn:hover{
    background:#d1ad72;
}

.save-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.cancel-btn{
    margin-top:25px;
    margin-left:10px;

    background:#eee;
    color:#292929;

    border:none;

    padding:14px 25px;

    border-radius:25px;

    cursor:pointer;

    font-size:15px;

    display:none;
}


/* =========================================
   STATUS
========================================= */

.status{
    display:none;

    margin-top:20px;

    padding:14px 16px;

    border-radius:8px;

    font-size:14px;

    line-height:1.5;
}

.status.success{
    display:block;
    background:#e8f5e9;
    color:#2e7d32;
}

.status.error{
    display:block;
    background:#ffebee;
    color:#c62828;
}

.status.warning{
    display:block;
    background:#fff8e1;
    color:#8a6500;
}

.status.info{
    display:block;
    background:#eef5ff;
    color:#24558a;
}


/* =========================================
   COLLECTION LIST
========================================= */

.collection-list{
    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(250px,1fr));

    gap:20px;
}

.collection-card{
    border:1px solid #eee;

    border-radius:12px;

    overflow:hidden;

    background:white;
}

.collection-card img{
    width:100%;

    height:180px;

    object-fit:cover;

    background:#f5f0eb;
}

.collection-image-placeholder{
    width:100%;
    height:180px;

    background:#f5f0eb;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#999;
}

.collection-info{
    padding:18px;
}

.collection-info h3{
    margin-bottom:8px;
}

.collection-info p{
    color:#777;

    font-size:14px;

    line-height:1.5;

    margin-bottom:15px;

    min-height:21px;
}

.buttons{
    display:flex;
    gap:8px;
}

.edit-btn,
.delete-btn{
    border:none;

    padding:9px 15px;

    border-radius:7px;

    cursor:pointer;

    color:white;
}

.edit-btn{
    background:#d1ad72;
}

.edit-btn:hover{
    background:#bd985f;
}

.delete-btn{
    background:#b85c5c;
}

.delete-btn:hover{
    background:#963f3f;
}


/* =========================================
   EMPTY / LOADING
========================================= */

.empty{
    padding:40px 30px;

    text-align:center;

    background:#faf8f5;

    border-radius:10px;

    color:#777;

    grid-column:1/-1;
}

.loading{
    padding:40px;

    text-align:center;

    color:#777;

    grid-column:1/-1;
}

.loader{
    width:30px;
    height:30px;

    margin:0 auto 15px;

    border:3px solid #e8e3db;

    border-top-color:#d1ad72;

    border-radius:50%;

    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:700px){

    .header{
        padding:18px 20px;
    }

    .header h1{
        font-size:19px;
    }

    .container{
        margin:25px auto;
    }

    .form-box,
    .manager{
        padding:20px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .title{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }

    .cancel-btn{
        margin-left:0;
    }

}

</style>

</head>


<body>


<header class="header">

    <h1>
        Trends by AK
    </h1>

    <a
        href="index.html"
        class="back"
    >
        ← Back to Dashboard
    </a>

</header>



<div class="container">


    <!-- =====================================
         TITLE
    ====================================== -->

    <div class="title">

        <h2>
            Collections
        </h2>

    </div>



    <!-- =====================================
         ADD / EDIT COLLECTION
    ====================================== -->

    <div class="form-box">

        <form id="collectionForm">


            <div class="form-grid">


                <!-- NAME -->

                <div class="field full">

                    <label>
                        Collection Name
                    </label>

                    <input
                        type="text"
                        id="collectionName"
                        placeholder="Example: Scrunchies"
                        required
                    >

                </div>



                <!-- IMAGE -->

                <div class="field full">

                    <label>
                        Collection Image
                    </label>

                    <input
                        type="file"
                        id="collectionImage"
                        accept="image/*"
                    >

                    <div
                        class="current-image-note"
                        id="currentImageNote"
                    >
                        Select an image for the collection.
                    </div>

                    <img
                        id="imagePreview"
                        class="image-preview"
                        alt="Collection preview"
                    >

                </div>



                <!-- DESCRIPTION -->

                <div class="field full">

                    <label>
                        Collection Description
                    </label>

                    <textarea
                        id="collectionDescription"
                        placeholder="Describe this collection..."
                    ></textarea>

                </div>


            </div>



            <button
                type="submit"
                class="save-btn"
                id="saveButton"
            >
                Save Collection
            </button>


            <button
                type="button"
                class="cancel-btn"
                id="cancelButton"
            >
                Cancel Edit
            </button>


        </form>


        <div
            id="formStatus"
            class="status"
        ></div>

    </div>



    <!-- =====================================
         COLLECTION MANAGER
    ====================================== -->

    <div class="manager">

        <h2>
            Collection Manager
        </h2>

        <p class="manager-subtitle">
            Collections stored in your Supabase database
        </p>


        <div
            id="collectionList"
            class="collection-list"
        >

            <div class="loading">

                <div class="loader"></div>

                Loading collections...

            </div>

        </div>

    </div>


</div>



<script>

"use strict";


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://ltxrycmreumoqfpcbwnb.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_wdc4ImKB1f0Q-v4Po9DOwA_xIpPXHkh";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   VARIABLES
========================================= */

let collections = [];

let editingCollectionId = null;

let selectedImageData = "";

let existingImageUrl = "";


/* =========================================
   HTML ESCAPE
========================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================
   STATUS
========================================= */

function showStatus(
    message,
    type
){

    const box =
        document.getElementById(
            "formStatus"
        );


    box.textContent =
        message;


    box.className =
        "status " + type;

}


function clearStatus(){

    const box =
        document.getElementById(
            "formStatus"
        );


    box.textContent = "";

    box.className =
        "status";

}


/* =========================================
   GET COLLECTION NAME
========================================= */

function getCollectionName(collection){

    return String(
        collection?.name ||
        collection?.title ||
        collection?.collection_name ||
        ""
    ).trim();

}


/* =========================================
   GET COLLECTION IMAGE
========================================= */

function getCollectionImage(collection){

    return String(
        collection?.image_url ||
        collection?.image ||
        collection?.cover_image ||
        ""
    ).trim();

}


/* =========================================
   GET DESCRIPTION
========================================= */

function getCollectionDescription(collection){

    return String(
        collection?.description ||
        ""
    ).trim();

}


/* =========================================
   LOAD COLLECTIONS
========================================= */

async function loadCollections(){

    const list =
        document.getElementById(
            "collectionList"
        );


    list.innerHTML = `

        <div class="loading">

            <div class="loader"></div>

            Loading collections...

        </div>

    `;


    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .from("collections")
            .select("*")
            .order(
                "id",
                {
                    ascending:true
                }
            );


        if(error){

            console.error(
                "Collections load error:",
                error
            );

            throw error;

        }


        collections =
            data || [];


        renderCollections();


    }catch(error){

        console.error(
            error
        );


        list.innerHTML = `

            <div class="empty">

                <strong>
                    Unable to load collections.
                </strong>

                <br><br>

                ${escapeHtml(
                    error.message ||
                    "Unknown error"
                )}

                <br><br>

                Make sure the Supabase
                <strong>collections</strong>
                table exists and its RLS policies
                allow authenticated users to access it.

            </div>

        `;

    }

}


/* =========================================
   RENDER COLLECTIONS
========================================= */

function renderCollections(){

    const list =
        document.getElementById(
            "collectionList"
        );


    if(!collections.length){

        list.innerHTML = `

            <div class="empty">

                No collections added yet.

                <br><br>

                Create your first collection above.

            </div>

        `;

        return;

    }


    list.innerHTML =
        collections
        .map(
            collection =>
            collectionCard(
                collection
            )
        )
        .join("");

}


/* =========================================
   COLLECTION CARD
========================================= */

function collectionCard(collection){

    const id =
        String(
            collection.id
        );


    const name =
        getCollectionName(
            collection
        );


    const image =
        getCollectionImage(
            collection
        );


    const description =
        getCollectionDescription(
            collection
        );


    return `

        <div
            class="collection-card"
            data-id="${escapeHtml(id)}"
        >

            ${
                image

                ?

                `
                <img
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(name)}"
                    onerror="
                        this.style.display='none';
                        this.nextElementSibling.style.display='flex';
                    "
                >

                <div
                    class="collection-image-placeholder"
                    style="display:none"
                >
                    No image
                </div>
                `

                :

                `
                <div
                    class="collection-image-placeholder"
                >
                    No image
                </div>
                `
            }


            <div class="collection-info">


                <h3>
                    ${escapeHtml(
                        name ||
                        "Unnamed Collection"
                    )}
                </h3>


                <p>
                    ${
                        escapeHtml(
                            description
                        ) ||
                        "No description"
                    }
                </p>


                <div class="buttons">


                    <button
                        type="button"
                        class="edit-btn"
                        onclick="
                            editCollection(
                                '${escapeHtml(id)}'
                            )
                        "
                    >
                        Edit
                    </button>


                    <button
                        type="button"
                        class="delete-btn"
                        onclick="
                            deleteCollection(
                                '${escapeHtml(id)}'
                            )
                        "
                    >
                        Delete
                    </button>


                </div>


            </div>


        </div>

    `;

}


/* =========================================
   IMAGE PREVIEW
========================================= */

document
.getElementById(
    "collectionImage"
)
.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];


        if(!file){

            return;

        }


        if(
            !file.type.startsWith(
                "image/"
            )
        ){

            showStatus(
                "Please select a valid image file.",
                "warning"
            );

            this.value = "";

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            function(event){

                selectedImageData =
                    event.target.result;


                const preview =
                    document.getElementById(
                        "imagePreview"
                    );


                preview.src =
                    selectedImageData;


                preview.style.display =
                    "block";


                document.getElementById(
                    "currentImageNote"
                ).textContent =
                    "New image selected.";


            };


        reader.readAsDataURL(
            file
        );

    }
);


/* =========================================
   SAVE COLLECTION
========================================= */

document
.getElementById(
    "collectionForm"
)
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        await saveCollection();

    }
);


/* =========================================
   SAVE COLLECTION FUNCTION
========================================= */

async function saveCollection(){

    clearStatus();


    const name =
        String(
            document.getElementById(
                "collectionName"
            ).value || ""
        ).trim();


    const description =
        String(
            document.getElementById(
                "collectionDescription"
            ).value || ""
        ).trim();


    if(!name){

        showStatus(
            "Please enter a collection name.",
            "warning"
        );

        return;

    }


    /*
     * Image is optional when editing
     * because the existing image can be retained.
     */

    if(
        !editingCollectionId &&
        !selectedImageData
    ){

        showStatus(
            "Please select a collection image.",
            "warning"
        );

        return;

    }


    const button =
        document.getElementById(
            "saveButton"
        );


    button.disabled = true;

    button.textContent =
        editingCollectionId
        ? "Updating..."
        : "Saving...";


    try{

        /*
         * Check duplicate collection names.
         */

        const duplicate =
            collections.some(
                collection => {

                    const collectionId =
                        String(
                            collection.id
                        );


                    return (
                        collectionId !==
                        String(
                            editingCollectionId
                        ) &&
                        getCollectionName(
                            collection
                        ).toLowerCase() ===
                        name.toLowerCase()
                    );

                }
            );


        if(duplicate){

            throw new Error(
                "A collection with this name already exists."
            );

        }


        /*
         * IMPORTANT:
         *
         * We store the selected image as a
         * data URL for now.
         *
         * This means the collection image
         * remains inside the database record.
         *
         * Later we can move these images to
         * Supabase Storage if required.
         */

        let imageValue =
            existingImageUrl;


        if(selectedImageData){

            imageValue =
                selectedImageData;

        }


        /*
         * INSERT
         */

        if(!editingCollectionId){

            const insertData = {

                name:name,

                description:description,

                image:imageValue

            };


            const {
                data,
                error
            } =
            await supabaseClient
                .from("collections")
                .insert([
                    insertData
                ])
                .select();


            if(error){

                throw error;

            }


            if(data?.length){

                collections.push(
                    data[0]
                );

            }


            showStatus(
                `"${name}" was added successfully.`,
                "success"
            );

        }


        /*
         * UPDATE
         */

        else{

            const updateData = {

                name:name,

                description:description,

                image:imageValue

            };


            const {
                data,
                error
            } =
            await supabaseClient
                .from("collections")
                .update(
                    updateData
                )
                .eq(
                    "id",
                    editingCollectionId
                )
                .select();


            if(error){

                throw error;

            }


            if(data?.length){

                const index =
                    collections.findIndex(
                        collection =>
                        String(
                            collection.id
                        ) ===
                        String(
                            editingCollectionId
                        )
                    );


                if(index !== -1){

                    collections[index] =
                        data[0];

                }

            }


            showStatus(
                `"${name}" was updated successfully.`,
                "success"
            );

        }


        resetForm();

        renderCollections();

        /*
         * Reload from database to ensure
         * the page reflects the real DB state.
         */

        await loadCollections();


    }catch(error){

        console.error(
            "Save collection error:",
            error
        );


        showStatus(
            error.message ||
            "Could not save collection.",
            "error"
        );

    }


    button.disabled = false;

    button.textContent =
        editingCollectionId
        ? "Update Collection"
        : "Save Collection";

}


/* =========================================
   EDIT COLLECTION
========================================= */

function editCollection(id){

    const collection =
        collections.find(
            item =>
            String(
                item.id
            ) ===
            String(id)
        );


    if(!collection){

        showStatus(
            "Collection could not be found.",
            "error"
        );

        return;

    }


    editingCollectionId =
        collection.id;


    document.getElementById(
        "collectionName"
    ).value =
        getCollectionName(
            collection
        );


    document.getElementById(
        "collectionDescription"
    ).value =
        getCollectionDescription(
            collection
        );


    existingImageUrl =
        getCollectionImage(
            collection
        );


    selectedImageData = "";


    const preview =
        document.getElementById(
            "imagePreview"
        );


    if(existingImageUrl){

        preview.src =
            existingImageUrl;

        preview.style.display =
            "block";


        document.getElementById(
            "currentImageNote"
        ).textContent =
            "Current image. Select a new image only if you want to replace it.";

    }else{

        preview.src = "";

        preview.style.display =
            "none";


        document.getElementById(
            "currentImageNote"
        ).textContent =
            "No image currently saved.";

    }


    document.getElementById(
        "saveButton"
    ).textContent =
        "Update Collection";


    document.getElementById(
        "cancelButton"
    ).style.display =
        "inline-block";


    clearStatus();


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================
   DELETE COLLECTION
========================================= */

async function deleteCollection(id){

    const collection =
        collections.find(
            item =>
            String(
                item.id
            ) ===
            String(id)
        );


    if(!collection){

        return;

    }


    const name =
        getCollectionName(
            collection
        );


    const confirmed =
        confirm(
            `Are you sure you want to delete "${name}"?`
        );


    if(!confirmed){

        return;

    }


    try{

        const {
            error
        } =
        await supabaseClient
            .from("collections")
            .delete()
            .eq(
                "id",
                id
            );


        if(error){

            throw error;

        }


        showStatus(
            `"${name}" was deleted successfully.`,
            "success"
        );


        await loadCollections();


    }catch(error){

        console.error(
            "Delete collection error:",
            error
        );


        showStatus(
            error.message ||
            "Could not delete collection.",
            "error"
        );

    }

}


/* =========================================
   CANCEL EDIT
========================================= */

document
.getElementById(
    "cancelButton"
)
.addEventListener(
    "click",
    function(){

        resetForm();

        clearStatus();

    }
);


/* =========================================
   RESET FORM
========================================= */

function resetForm(){

    document.getElementById(
        "collectionForm"
    ).reset();


    editingCollectionId =
        null;


    selectedImageData =
        "";


    existingImageUrl =
        "";


    const preview =
        document.getElementById(
            "imagePreview"
        );


    preview.src = "";

    preview.style.display =
        "none";


    document.getElementById(
        "currentImageNote"
    ).textContent =
        "Select an image for the collection.";


    document.getElementById(
        "saveButton"
    ).textContent =
        "Save Collection";


    document.getElementById(
        "cancelButton"
    ).style.display =
        "none";

}


/* =========================================
   START
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    async function(){

        await loadCollections();

    }
);

</script>


</body>

</html>
