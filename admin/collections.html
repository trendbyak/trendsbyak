<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Collections | Trends by AK</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8f5f0;
            color: #292929;
        }

        .header {
            background: #292929;
            color: white;
            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #d1ad72;
            font-size: 22px;
        }

        .back {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .title h2 {
            font-size: 30px;
        }

        .form-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,.06);

            margin-bottom: 35px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            font-size: 14px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;

            border: 1px solid #ddd;
            border-radius: 8px;

            font-family: inherit;
            font-size: 14px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #d1ad72;
        }

        .image-preview {
            width: 150px;
            height: 150px;

            object-fit: cover;

            border-radius: 10px;

            margin-top: 10px;

            display: none;
        }

        .save-btn {
            margin-top: 25px;

            background: #292929;
            color: white;

            border: none;

            padding: 14px 30px;

            border-radius: 25px;

            cursor: pointer;

            font-size: 15px;
        }

        .save-btn:hover {
            background: #d1ad72;
        }

        /* COLLECTION MANAGER */

        .manager {
            background: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow: 0 5px 20px rgba(0,0,0,.06);
        }

        .manager h2 {
            margin-bottom: 8px;
        }

        .manager-subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        .collection-list {
            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(250px, 1fr));

            gap: 20px;
        }

        .collection-card {
            border: 1px solid #eee;

            border-radius: 12px;

            overflow: hidden;

            background: white;
        }

        .collection-card img {
            width: 100%;

            height: 180px;

            object-fit: cover;

            background: #f5f0eb;
        }

        .collection-info {
            padding: 18px;
        }

        .collection-info h3 {
            margin-bottom: 8px;
        }

        .collection-info p {
            color: #777;

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 15px;
        }

        .buttons {
            display: flex;

            gap: 8px;
        }

        .edit-btn,
        .delete-btn {
            border: none;

            padding: 9px 15px;

            border-radius: 7px;

            cursor: pointer;

            color: white;
        }

        .edit-btn {
            background: #d1ad72;
        }

        .delete-btn {
            background: #b85c5c;
        }

        .empty {
            padding: 30px;

            text-align: center;

            background: #faf8f5;

            border-radius: 10px;

            color: #777;
        }

        @media(max-width:700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .title {
                flex-direction: column;

                align-items: flex-start;

                gap: 15px;
            }

        }

    </style>

</head>


<body>


<header class="header">

    <h1>Trends by AK</h1>

    <a href="index.html" class="back">
        ← Back to Dashboard
    </a>

</header>



<div class="container">


    <!-- TITLE -->

    <div class="title">

        <h2>Collections</h2>

    </div>



    <!-- ADD COLLECTION -->

    <div class="form-box">

        <form id="collectionForm">


            <div class="form-grid">


                <div class="field full">

                    <label>
                        Collection Name
                    </label>

                    <input
                        type="text"
                        id="collectionName"
                        placeholder="Example: Scrunchies"
                        required
                    >

                </div>



                <div class="field full">

                    <label>
                        Collection Image
                    </label>

                    <input
                        type="file"
                        id="collectionImage"
                        accept="image/*"
                        required
                    >

                    <img
                        id="imagePreview"
                        class="image-preview"
                    >

                </div>



                <div class="field full">

                    <label>
                        Collection Description
                    </label>

                    <textarea
                        id="collectionDescription"
                        placeholder="Describe this collection..."
                    ></textarea>

                </div>


            </div>



            <button
                type="submit"
                class="save-btn"
            >
                Save Collection
            </button>


        </form>

    </div>



    <!-- COLLECTION MANAGER -->

    <div class="manager">

        <h2>
            Collection Manager
        </h2>

        <p class="manager-subtitle">
            Collections added to your store
        </p>


        <div
            id="collectionList"
            class="collection-list"
        ></div>

    </div>


</div>



<script>


let selectedImage = "";

let editingCollectionIndex = undefined;



/* IMAGE PREVIEW */

document
.getElementById("collectionImage")
.addEventListener("change", function() {


    const file = this.files[0];


    if (!file) {

        return;

    }


    const reader = new FileReader();


    reader.onload = function(event) {


        selectedImage = event.target.result;


        document.getElementById("imagePreview").src =
            selectedImage;


        document.getElementById("imagePreview").style.display =
            "block";


    };


    reader.readAsDataURL(file);


});



/* SAVE COLLECTION */

document
.getElementById("collectionForm")
.addEventListener("submit", function(event) {


    event.preventDefault();


    if (!selectedImage) {

        alert("Please select a collection image.");

        return;

    }


    const collection = {


        id: Date.now(),


        name:
            document.getElementById("collectionName").value,


        description:
            document.getElementById("collectionDescription").value,


        image:
            selectedImage

    };



    let collections =
        JSON.parse(
            localStorage.getItem("trendsbyakCollections")
        ) || [];



    if (editingCollectionIndex !== undefined) {


        collections[editingCollectionIndex] =
            collection;


        editingCollectionIndex =
            undefined;


    } else {


        collections.push(collection);

    }



    localStorage.setItem(
        "trendsbyakCollections",
        JSON.stringify(collections)
    );



    alert("Collection saved successfully!");



    this.reset();


    selectedImage = "";


    document.getElementById("imagePreview").src = "";


    document.getElementById("imagePreview").style.display =
        "none";


    document.querySelector(".save-btn").textContent =
        "Save Collection";


    loadCollections();


});



/* LOAD COLLECTIONS */

function loadCollections() {


    const collections =
        JSON.parse(
            localStorage.getItem("trendsbyakCollections")
        ) || [];


    const list =
        document.getElementById("collectionList");



    if (collections.length === 0) {


        list.innerHTML = `

            <div class="empty">

                No collections added yet.

            </div>

        `;


        return;

    }



    list.innerHTML = collections
    .map((collection, index) => {


        return `


            <div class="collection-card">


                <img
                    src="${collection.image}"
                    alt="${collection.name}"
                >


                <div class="collection-info">


                    <h3>
                        ${collection.name}
                    </h3>


                    <p>
                        ${collection.description || ""}
                    </p>


                    <div class="buttons">


                        <button
                            class="edit-btn"
                            onclick="editCollection(${index})"
                        >
                            Edit
                        </button>


                        <button
                            class="delete-btn"
                            onclick="deleteCollection(${index})"
                        >
                            Delete
                        </button>


                    </div>


                </div>


            </div>


        `;


    })
    .join("");

}



/* EDIT COLLECTION */

function editCollection(index) {


    const collections =
        JSON.parse(
            localStorage.getItem("trendsbyakCollections")
        ) || [];


    const collection =
        collections[index];


    document.getElementById("collectionName").value =
        collection.name || "";


    document.getElementById("collectionDescription").value =
        collection.description || "";


    selectedImage =
        collection.image || "";


    if (collection.image) {


        document.getElementById("imagePreview").src =
            collection.image;


        document.getElementById("imagePreview").style.display =
            "block";


    }


    editingCollectionIndex =
        index;


    document.querySelector(".save-btn").textContent =
        "Update Collection";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}



/* DELETE COLLECTION */

function deleteCollection(index) {


    const collections =
        JSON.parse(
            localStorage.getItem("trendsbyakCollections")
        ) || [];


    if (
        confirm(
            "Are you sure you want to delete this collection?"
        )
    ) {


        collections.splice(index, 1);


        localStorage.setItem(
            "trendsbyakCollections",
            JSON.stringify(collections)
        );


        loadCollections();

    }

}



/* START */

loadCollections();


</script>


</body>

</html>
