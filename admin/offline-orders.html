<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline Orders | Trends by AK</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f7f3ed;--card:#fff;--ink:#171411;--muted:#756d64;--line:#e7dfd6;--gold:#a97824;--danger:#b3261e;--ok:#24734b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Arial,sans-serif}
.wrap{max-width:1180px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.brand{font-weight:800;font-size:22px}.muted{color:var(--muted)}
a{color:inherit}.btn{border:1px solid #171411;background:#171411;color:#fff;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:700}.btn.white{background:#fff;color:#171411;border-color:var(--line)}.btn.danger{background:#fff;color:var(--danger);border-color:#e8b9b5}.btn:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.stat b{display:block;font-size:22px;margin-top:6px}
.card{margin-bottom:18px}.card h2{font-size:17px;margin:0 0 14px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d8d0c7;border-radius:8px;background:#fff;font:inherit}.field textarea{min-height:75px;resize:vertical}
.items{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:12px}.item{display:grid;grid-template-columns:2fr 90px 120px 120px 42px;gap:8px;padding:9px;border-bottom:1px solid var(--line);align-items:center}.item:last-child{border-bottom:0}.item input,.item select{width:100%;padding:9px;border:1px solid #d8d0c7;border-radius:7px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.notice{padding:11px 13px;border-radius:9px;background:#f2ede6;margin-bottom:12px}.notice.error{background:#fff0ef;color:var(--danger)}.notice.ok{background:#edf8f1;color:var(--ok)}
.order{border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:9px;background:#fff}.orderhead{display:flex;justify-content:space-between;gap:12px}.orderitems{margin:8px 0;color:var(--muted);line-height:1.6}.pill{display:inline-block;padding:3px 7px;border-radius:99px;background:#f2ede6;margin-right:5px;font-size:12px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.item{grid-template-columns:1fr 75px 100px 100px 38px;overflow:auto}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><div class="brand">Trends by AK · Offline Sales</div><div class="muted">Stall, cash, UPI, Instagram, WhatsApp, wholesale and other sales.</div></div><a class="btn white" href="/admin/command-center.html">← Back to Admin</a></div>

<div id="message" class="notice">Connecting to admin…</div>
<div class="grid">
<div class="stat">OFFLINE SALES<b id="sales">₹0</b></div>
<div class="stat">PRODUCT COST<b id="cost">₹0</b></div>
<div class="stat">EXPENSES<b id="expenses">₹0</b></div>
<div class="stat">NET PROFIT<b id="profit">₹0</b></div>
</div>

<div class="card">
<h2 id="formTitle">Enter offline order</h2>
<div class="formgrid">
<div class="field"><label>Customer name <span class="muted">(optional)</span></label><input id="customer"></div>
<div class="field"><label>Phone <span class="muted">(optional)</span></label><input id="phone"></div>
<div class="field"><label>Order date</label><input id="date" type="datetime-local"></div>
<div class="field"><label>Sales source</label><select id="source"><option>Offline</option><option>Stall</option><option>Cash sale</option><option>UPI sale</option><option>Instagram</option><option>WhatsApp</option><option>Wholesale</option><option>Other</option></select></div>
<div class="field"><label>Payment method</label><select id="payment"><option>Cash</option><option>UPI</option><option>Bank transfer</option><option>Card</option><option>Other</option></select></div>
</div>
<label style="display:block;font-weight:700;margin-top:14px">Items</label>
<div id="items" class="items"></div>
<div class="actions"><button class="btn white" type="button" onclick="addItem()">＋ Add product</button></div>
<div class="formgrid" style="margin-top:12px">
<div class="field"><label>Order discount</label><input id="discount" type="number" min="0" step="0.01" value="0"></div>
<div class="field"><label>Shipping / other income</label><input id="shipping" type="number" min="0" step="0.01" value="0"></div>
<div class="field"><label>Other cost for this order</label><input id="otherCost" type="number" min="0" step="0.01" value="0"></div>
<div class="field"><label>Notes</label><textarea id="notes"></textarea></div>
</div>
<div class="actions"><button id="saveBtn" class="btn" onclick="saveOrder()">Save offline order</button><button class="btn white" onclick="resetForm()">Clear</button></div>
</div>

<div class="card"><h2>Recent offline orders</h2><div id="orders">Loading…</div></div>
<div class="card"><h2>Add business expense</h2>
<div class="formgrid">
<div class="field"><label>Category</label><select id="expenseCategory"><option>Packaging</option><option>Raw material</option><option>Shipping</option><option>Marketing</option><option>Stall/Event</option><option>Platform/Software</option><option>Travel</option><option>Other</option></select></div>
<div class="field"><label>Description</label><input id="expenseDescription"></div>
<div class="field"><label>Amount</label><input id="expenseAmount" type="number" min="0" step="0.01"></div>
<div class="field"><label>Payment method</label><select id="expensePayment"><option>Cash</option><option>UPI</option><option>Bank transfer</option><option>Card</option><option>Other</option></select></div>
</div><div class="actions"><button class="btn" onclick="saveExpense()">Save expense</button></div>
</div>
<div class="card"><h2>Recent expenses</h2><div id="expenseList">Loading…</div></div>
</div>
<script>
const SUPABASE_URL='https://ltxrycmreumoqfpcbwnb.supabase.co';
const SUPABASE_KEY='sb_publishable_wdc4ImKB1f0Q-v4Po9DOwA_xIpPXHkh';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'trendsbyak-admin-auth'}});
let products=[],orders=[],editingId=null;

const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function msg(t,type=''){const e=document.getElementById('message');e.className='notice '+type;e.textContent=t}
function localDateValue(d=new Date()){const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,16)}
function productOptions(selected=''){return '<option value="">Select product…</option>'+products.map(p=>'<option value="'+esc(p.id)+'" '+(String(p.id)===String(selected)?'selected':'')+'>'+esc(p.name)+(p.sku?' · '+esc(p.sku):'')+'</option>').join('')}

async function waitForSession(){
  for(let i=0;i<12;i++){const r=await db.auth.getSession();if(r.data.session)return r.data.session;await new Promise(x=>setTimeout(x,250))}
  return null;
}
function addItem(data={}){
 const row=document.createElement('div');row.className='item';
 row.innerHTML='<select class="ip">'+productOptions(data.product_id||'')+'</select><input class="iq" type="number" min="1" value="'+Number(data.quantity||1)+'"><input class="iu" type="number" min="0" step="0.01" value="'+Number(data.unit_price||0)+'" placeholder="Sale price"><input class="ic" type="number" min="0" step="0.01" value="'+Number(data.unit_cost||0)+'" placeholder="Unit cost"><button class="btn danger" type="button">×</button>';
 row.querySelector('.ip').onchange=()=>fillPrice(row);
 row.querySelector('button').onclick=()=>{if(document.querySelectorAll('.item').length>1)row.remove();};
 document.getElementById('items').appendChild(row);
 if(data.product_name&&!data.product_id){const s=row.querySelector('.ip');s.innerHTML='<option value="">'+esc(data.product_name)+'</option>'}
}
function fillPrice(row){const p=products.find(x=>String(x.id)===row.querySelector('.ip').value);if(!p)return;row.querySelector('.iu').value=Number(p.sale_price||p.price||0);row.querySelector('.ic').value=Number(p.cost_price||0)}

async function loadProducts(){
 const r=await db.from('products').select('id,name,price,sale_price,cost_price,sku,status').order('name').limit(5000);
 if(r.error)throw new Error('Products: '+r.error.message);products=(r.data||[]).filter(p=>p.status==='active');if(!products.length)products=r.data||[];
}
async function loadOrders(){
 const r=await db.from('offline_orders').select('*').order('order_date',{ascending:false}).limit(100);
 if(r.error)throw new Error('Orders: '+r.error.message);
 orders=r.data||[];const ids=orders.map(x=>x.id);
 let items=[];
 if(ids.length){const q=await db.from('offline_order_items').select('*').in('order_id',ids).order('created_at');if(q.error)throw new Error('Order items: '+q.error.message);items=q.data||[]}
 const map={};items.forEach(i=>(map[i.order_id]??=[]).push(i));
 document.getElementById('orders').innerHTML=orders.length?orders.map(o=>'<div class="order"><div class="orderhead"><div><b>'+esc(o.order_number)+'</b> · '+esc(o.customer_name||'Walk-in')+'<div class="muted">'+esc(o.source||'Offline')+' · '+esc(o.payment_method||'')+' · '+new Date(o.order_date).toLocaleString('en-IN')+'</div></div><b>'+money(o.total)+'</b></div><div class="orderitems">'+((map[o.id]||[]).map(i=>esc(i.product_name)+' × '+i.quantity+' · '+money(i.line_total)).join('<br>')||'No item details')+'</div><span class="pill">Profit '+money(o.profit)+'</span><button class="btn white" style="float:right;padding:6px 9px" onclick="editOrder(\''+o.id+'\')">Edit</button><button class="btn danger" style="float:right;padding:6px 9px;margin-right:6px" onclick="deleteOrder(\''+o.id+'\')">Delete</button></div>').join(''):'<div class="muted">No offline orders found.</div>';
 const sales=orders.reduce((a,o)=>a+Number(o.total||0),0),cost=orders.reduce((a,o)=>a+Number(o.product_cost||0)+Number(o.other_cost||0),0);
 document.getElementById('sales').textContent=money(sales);document.getElementById('cost').textContent=money(cost);
 document.getElementById('profit').textContent=money(sales-cost);
}
async function loadExpenses(){
 const r=await db.from('business_expenses').select('*').order('expense_date',{ascending:false}).limit(100);
 if(r.error)throw new Error('Expenses: '+r.error.message);
 const a=r.data||[];document.getElementById('expenses').textContent=money(a.reduce((s,x)=>s+Number(x.amount||0),0));
 document.getElementById('expenseList').innerHTML=a.length?a.map(x=>'<div class="order"><b>'+esc(x.category)+'</b> · '+money(x.amount)+'<div class="muted">'+esc(x.description||'')+' · '+new Date(x.expense_date).toLocaleDateString('en-IN')+'</div></div>').join(''):'<div class="muted">No expenses recorded.</div>';
}
function resetForm(){editingId=null;document.getElementById('formTitle').textContent='Enter offline order';document.getElementById('saveBtn').textContent='Save offline order';['customer','phone','notes'].forEach(id=>document.getElementById(id).value='');document.getElementById('date').value=localDateValue();document.getElementById('discount').value=0;document.getElementById('shipping').value=0;document.getElementById('otherCost').value=0;document.getElementById('items').innerHTML='';addItem()}
async function editOrder(id){
 const o=orders.find(x=>x.id===id);if(!o)return;editingId=id;document.getElementById('formTitle').textContent='Edit offline order '+o.order_number;document.getElementById('saveBtn').textContent='Update offline order';
 document.getElementById('customer').value=o.customer_name||'';document.getElementById('phone').value=o.customer_phone||'';document.getElementById('date').value=localDateValue(new Date(o.order_date));document.getElementById('source').value=o.source||'Offline';document.getElementById('payment').value=o.payment_method||'Cash';document.getElementById('discount').value=o.discount||0;document.getElementById('shipping').value=o.shipping||0;document.getElementById('otherCost').value=o.other_cost||0;document.getElementById('notes').value=o.notes||'';
 const r=await db.from('offline_order_items').select('*').eq('order_id',id).order('created_at');if(r.error){msg(r.error.message,'error');return}document.getElementById('items').innerHTML='';(r.data||[]).forEach(addItem);if(!(r.data||[]).length)addItem();scrollTo({top:0,behavior:'smooth'});
}
async function saveOrder(){
 try{const session=await waitForSession();if(!session)throw new Error('Admin session not found. Open Admin Login and sign in again.');
 const rows=[...document.querySelectorAll('.item')].map(r=>{const p=products.find(x=>String(x.id)===r.querySelector('.ip').value);return{product_id:p?.id||null,product_name:p?.name||r.querySelector('.ip').selectedOptions[0]?.textContent||'Item',sku:p?.sku||null,quantity:Math.max(1,Number(r.querySelector('.iq').value||1)),unit_price:Number(r.querySelector('.iu').value||0),unit_cost:Number(r.querySelector('.ic').value||0)}});if(!rows.length||rows.some(x=>!x.product_name))throw new Error('Add at least one item.');
 const subtotal=rows.reduce((s,x)=>s+x.quantity*x.unit_price,0),discount=Number(document.getElementById('discount').value||0),shipping=Number(document.getElementById('shipping').value||0),other=Number(document.getElementById('otherCost').value||0),total=Math.max(0,subtotal-discount+shipping),productCost=rows.reduce((s,x)=>s+x.quantity*x.unit_cost,0);
 const payload={customer_name:document.getElementById('customer').value||null,customer_phone:document.getElementById('phone').value||null,order_date:new Date(document.getElementById('date').value||Date.now()).toISOString(),source:document.getElementById('source').value,payment_method:document.getElementById('payment').value,payment_status:'paid',notes:document.getElementById('notes').value||null,subtotal,discount,shipping,total,product_cost:productCost,other_cost:other};
 let id=editingId;
 if(id){const u=await db.from('offline_orders').update(payload).eq('id',id);if(u.error)throw u.error;const d=await db.from('offline_order_items').delete().eq('order_id',id);if(d.error)throw d.error}else{payload.order_number='OFF-'+Math.floor(10000000+Math.random()*90000000);const i=await db.from('offline_orders').insert(payload).select('id').single();if(i.error)throw i.error;id=i.data.id}
 const items=rows.map(x=>({...x,order_id:id,line_total:x.quantity*x.unit_price,line_cost:x.quantity*x.unit_cost,discount:0}));const ins=await db.from('offline_order_items').insert(items);if(ins.error)throw ins.error;
 msg(editingId?'Order updated successfully.':'Offline order saved successfully.','ok');resetForm();await refresh();
 }catch(e){msg(e.message||String(e),'error')}
}
async function deleteOrder(id){if(!confirm('Delete this offline order?'))return;try{const a=await db.from('offline_order_items').delete().eq('order_id',id);if(a.error)throw a.error;const r=await db.from('offline_orders').delete().eq('id',id);if(r.error)throw r.error;msg('Order deleted.','ok');await refresh()}catch(e){msg(e.message||String(e),'error')}}
async function saveExpense(){try{const amount=Number(document.getElementById('expenseAmount').value||0);if(amount<=0)throw new Error('Enter an expense amount.');const r=await db.from('business_expenses').insert({category:document.getElementById('expenseCategory').value,description:document.getElementById('expenseDescription').value||null,amount,payment_method:document.getElementById('expensePayment').value});if(r.error)throw r.error;document.getElementById('expenseAmount').value='';document.getElementById('expenseDescription').value='';msg('Expense saved.','ok');await loadExpenses()}catch(e){msg(e.message||String(e),'error')}}
async function refresh(){await Promise.all([loadOrders(),loadExpenses()])}
async function boot(){try{document.getElementById('date').value=localDateValue();const s=await waitForSession();if(!s){msg('Admin session not found. Please log in at /admin/login.html.','error');return}await loadProducts();resetForm();await refresh();msg('Offline Orders is connected and ready.','ok')}catch(e){msg(e.message||String(e),'error');document.getElementById('orders').textContent='Could not load orders.'}}
boot();
</script>
</body>
</html>
