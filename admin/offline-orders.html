<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Offline Orders</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:15px Arial;margin:0;background:#f7f4ef;color:#222}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:white;padding:18px;border-radius:12px;margin:14px 0;border:1px solid #ddd}.row{border:1px solid #ddd;padding:12px;border-radius:10px;margin:8px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}input,select{padding:10px;width:100%;box-sizing:border-box;margin:5px 0 12px}button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer;background:#222;color:white;margin-right:6px}.gold{background:#b28a4b}.danger{background:#b42318}.ok{color:#287a45}.err{color:#b42318;white-space:pre-wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>Offline Orders</h1><div id="status">Checking admin session…</div><div class="card"><h2>Add / Edit Offline Order</h2><label>Customer</label><input id="customer" placeholder="Walk-in customer"><label>Phone</label><input id="phone"><label>Product / Item</label><input id="product" placeholder="e.g. Scrunchies Medium"><div class="grid"><div><label>Quantity</label><input id="qty" type="number" value="1" min="1"></div><div><label>Sale price</label><input id="price" type="number" value="0" min="0"></div><div><label>Unit cost</label><input id="cost" type="number" value="0" min="0"></div><div><label>Payment</label><select id="payment"><option>Cash</option><option>UPI</option><option>Bank transfer</option><option>Card</option><option>Other</option></select></div></div><button id="save" class="gold">Save Offline Order</button><button id="cancel" style="display:none">Cancel Edit</button><div id="msg"></div></div><div class="card"><h2>Existing Offline Orders</h2><div id="orders">Loading…</div><div id="debug" class="err" style="margin-top:10px"></div></div></div><script>const U="https://ltxrycmreumoqfpcbwnb.supabase.co",K="sb_publishable_wdc4ImKB1f0Q-v4Po9DOwA_xIpPXHkh",db=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,storageKey:"trendsbyak-admin-auth"}});let editId=null;const $=x=>document.getElementById(x),msg=(x,c="err")=>{$("msg").className=c;$("msg").textContent=x};const money=x=>"₹"+Number(x||0).toLocaleString("en-IN");function esc(x){return String(x??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}async function session(){const r=await Promise.race([db.auth.getSession(),new Promise((_,rej)=>setTimeout(()=>rej(new Error("Supabase session check timed out. Please refresh.")),8000))]);if(r.error)throw r.error;return r.data.session}async function load(){const s=await session();if(!s){$("status").innerHTML='<span class="err">Admin login required.</span> <a href="login.html">Login</a>';return}$("status").innerHTML='<span class="ok">✓ Admin session active</span>';const o=await Promise.race([db.from("offline_orders").select("*").order("order_date",{ascending:false}).limit(100),new Promise((_,rej)=>setTimeout(()=>rej(new Error("Offline orders query timed out. Supabase did not respond.")),10000))]);if(o.error)throw o.error;const orders=o.data||[];if(!orders.length){$("orders").textContent="No offline orders found.";return}const ids=orders.map(x=>x.id),ir=await Promise.race([db.from("offline_order_items").select("id,order_id,product_name,sku,quantity,unit_price,unit_cost,discount,line_total,line_cost,created_at").in("order_id",ids),new Promise((_,rej)=>setTimeout(()=>rej(new Error("Offline order items query timed out. Supabase did not respond.")),10000))]);if(ir.error)throw ir.error;const by={};(ir.data||[]).forEach(i=>(by[i.order_id]??=[]).push(i));$("orders").innerHTML=orders.map(x=>'<div class="row"><b>'+esc(x.order_number)+"</b> · "+esc(x.customer_name||"Walk-in")+" · "+money(x.total)+'<br><small>'+new Date(x.order_date).toLocaleString("en-IN")+" · "+esc(x.payment_method||"")+"</small><br>"+((by[x.id]||[]).map(i=>esc(i.product_name)+" × "+i.quantity+" @ "+money(i.unit_price)).join("<br>")||"No items")+'<br><button onclick="editOrder(\''+x.id+"\')">Edit</button><button class="danger" onclick="deleteOrder(\''+x.id+"\',\''+esc(x.order_number)+"\')">Delete</button></div>").join("")}async function editOrder(id){try{const o=await db.from("offline_orders").select("*").eq("id",id).single();if(o.error)throw o.error;const i=await db.from("offline_order_items").select("product_name,quantity,unit_price,unit_cost").eq("order_id",id).limit(1).single();if(i.error)throw i.error;editId=id;$("customer").value=o.data.customer_name||"";$("phone").value=o.data.customer_phone||"";$("product").value=i.data.product_name||"";$("qty").value=i.data.quantity||1;$("price").value=i.data.unit_price||0;$("cost").value=i.data.unit_cost||0;$("payment").value=o.data.payment_method||"Cash";$("save").textContent="Update Offline Order";$("cancel").style.display="inline-block";window.scrollTo(0,0)}catch(e){msg("Edit failed: "+e.message)}}async function save(){const name=$("product").value.trim()||"Item",q=Math.max(1,Number($("qty").value||1)),p=Math.max(0,Number($("price").value||0)),c=Math.max(0,Number($("cost").value||0));if(!p&&confirm("Sale price is ₹0. Save anyway?")===false)return;try{if(editId){const r=await db.from("offline_orders").update({customer_name:$("customer").value.trim()||"Walk-in",customer_phone:$("phone").value.trim()||null,payment_method:$("payment").value,total:q*p,subtotal:q*p,product_cost:q*c,profit:q*p-q*c,updated_at:new Date().toISOString()}).eq("id",editId);if(r.error)throw r.error;const d=await db.from("offline_order_items").delete().eq("order_id",editId);if(d.error)throw d.error;const i=await db.from("offline_order_items").insert({order_id:editId,product_name:name,quantity:q,unit_price:p,unit_cost:c,line_total:q*p,line_cost:q*c,discount:0});if(i.error)throw i.error;msg("Order updated.","ok")}else{const n="OFF-"+Date.now().toString().slice(-8),r=await db.from("offline_orders").insert({order_number:n,customer_name:$("customer").value.trim()||"Walk-in",customer_phone:$("phone").value.trim()||null,order_date:new Date().toISOString(),source:"offline",payment_method:$("payment").value,payment_status:"paid",subtotal:q*p,discount:0,shipping:0,total:q*p,product_cost:q*c,other_cost:0,profit:q*p-q*c}).select("id").single();if(r.error)throw r.error;const i=await db.from("offline_order_items").insert({order_id:r.data.id,product_name:name,quantity:q,unit_price:p,unit_cost:c,discount:0,line_total:q*p,line_cost:q*c});if(i.error){await db.from("offline_orders").delete().eq("id",r.data.id);throw i.error}msg("Order saved.","ok")}reset();await load()}catch(e){msg("Save failed: "+e.message)}}function reset(){editId=null;$("customer").value="";$("phone").value="";$("product").value="";$("qty").value=1;$("price").value=0;$("cost").value=0;$("payment").value="Cash";$("save").textContent="Save Offline Order";$("cancel").style.display="none"}async function deleteOrder(id,n){if(!confirm("Delete "+n+"?"))return;try{let r=await db.from("offline_order_items").delete().eq("order_id",id);if(r.error)throw r.error;r=await db.from("offline_orders").delete().eq("id",id);if(r.error)throw r.error;msg("Order deleted.","ok");await load()}catch(e){msg("Delete failed: "+e.message)}}$("save").onclick=save;$("cancel").onclick=reset;load().catch(e=>{console.error(e);$("orders").textContent="Could not load orders.";msg("Load failed: "+e.message)});window.editOrder=editOrder;window.deleteOrder=deleteOrder;</script></body></html>
