<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Trends by AK | Offline Orders</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
<style>
body{font:15px Arial;margin:0;background:#f7f4ef;color:#222}.wrap{max-width:1100px;margin:auto;padding:24px}
.card{background:#fff;padding:18px;border-radius:12px;margin:14px 0;border:1px solid #ddd}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
input,select{padding:10px;width:100%;box-sizing:border-box;margin:5px 0 12px;border:1px solid #ddd;border-radius:8px}
button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer;background:#222;color:#fff;margin-right:6px}.gold{background:#b28a4b}.danger{background:#b42318}
.row{border:1px solid #ddd;padding:12px;border-radius:10px;margin:8px 0}.ok{color:#287a45}.err{color:#b42318;white-space:pre-wrap}.muted{color:#777}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<h1>Offline Orders</h1><div id="status" class="muted">Connecting to admin session…</div>
<div class="card"><h2>Add / Edit Offline Order</h2>
<label>Customer</label><input id="customer" placeholder="Walk-in customer">
<label>Phone</label><input id="phone" placeholder="Optional">
<label>Product / Item</label><select id="product"><option value="">Loading products…</option></select>
<input id="custom" placeholder="Custom item name (optional)" style="display:none">
<div class="grid">
<div><label>Quantity</label><input id="qty" type="number" value="1" min="1"></div>
<div><label>Sale price</label><input id="price" type="number" value="0" min="0"></div>
<div><label>Unit cost</label><input id="cost" type="number" value="0" min="0"></div>
<div><label>Payment</label><select id="payment"><option>Cash</option><option>UPI</option><option>Bank transfer</option><option>Card</option><option>Other</option></select></div>
</div>
<button id="save" class="gold">Save Offline Order</button><button id="cancel" style="display:none">Cancel Edit</button><div id="msg"></div>
</div>
<div class="card"><h2>Existing Offline Orders</h2><div id="orders">Loading…</div></div>
</div>
<script>
const U="https://ltxrycmreumoqfpcbwnb.supabase.co",K="sb_publishable_wdc4ImKB1f0Q-v4Po9DOwA_xIpPXHkh";
const db=window.supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,storageKey:"trendsbyak-admin-auth",lock:(name,timeout,fn)=>fn()}});
const $=id=>document.getElementById(id);
const money=x=>"₹"+Number(x||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
let products=[],editId=null;

function message(t,ok=false){$("msg").className=ok?"ok":"err";$("msg").textContent=t}
async function getSession(){
 const r=await db.auth.getSession();
 if(r.error) throw r.error;
 if(!r.data.session) throw new Error("Admin session not found. Open Admin Login first, then return here.");
 return r.data.session;
}
async function loadProducts(){
 const r=await db.from("products").select("id,name,price,sale_price,cost_price,sku,status").order("name").limit(2000);
 if(r.error) throw r.error;
 products=(r.data||[]).filter(p=>p.status==="active");
 if(!products.length) products=r.data||[];
 const s=$("product");
 s.innerHTML='<option value="">Select product…</option>'+products.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+(p.sku?" · "+esc(p.sku):"")+"</option>").join("")+'<option value="custom">Custom item</option>';
}
$("product").onchange=()=>{
 const v=$("product").value,p=products.find(x=>String(x.id)===v);
 $("custom").style.display=v==="custom"?"block":"none";
 if(p){$("price").value=Number(p.sale_price||p.price||0);$("cost").value=Number(p.cost_price||0)}
};
async function loadOrders(){
 const o=await db.from("offline_orders").select("*").order("order_date",{ascending:false}).limit(100);
 if(o.error) throw o.error;
 const orders=o.data||[];
 if(!orders.length){$("orders").innerHTML='<div class="muted">No offline orders found.</div>';return}
 const ids=orders.map(x=>x.id);
 const ir=await db.from("offline_order_items").select("id,order_id,product_name,sku,quantity,unit_price,unit_cost,line_total,line_cost").in("order_id",ids);
 if(ir.error) throw ir.error;
 const by={};(ir.data||[]).forEach(i=>(by[i.order_id]??=[]).push(i));
 $("orders").innerHTML=orders.map(x=>{
  const items=(by[x.id]||[]).map(i=>esc(i.product_name)+" × "+i.quantity+" @ "+money(i.unit_price)).join("<br>")||"No items";
  const profit=Number(x.total||0)-Number(x.product_cost||0)-Number(x.other_cost||0);
  return '<div class="row"><b>'+esc(x.order_number)+'</b> · '+esc(x.customer_name||"Walk-in")+' · <b>'+money(x.total)+'</b><br><small class="muted">'+new Date(x.order_date).toLocaleString("en-IN")+" · "+esc(x.payment_method||"")+"</small><br>"+items+'<br><small class="muted">Subtotal '+money(x.subtotal)+" · Cost "+money(Number(x.product_cost||0)+Number(x.other_cost||0))+" · Profit "+money(profit)+'</small><br><button onclick="editOrder(\''+x.id+"\')">Edit</button><button class="danger" onclick="deleteOrder(\''+x.id+"\',\''+esc(x.order_number)+"\')">Delete</button></div>"
 }).join("");
}
async function editOrder(id){
 try{
  const o=await db.from("offline_orders").select("*").eq("id",id).single(); if(o.error)throw o.error;
  const i=await db.from("offline_order_items").select("*").eq("order_id",id).limit(1).single(); if(i.error)throw i.error;
  editId=id;$("customer").value=o.data.customer_name||"";$("phone").value=o.data.customer_phone||"";
  const match=products.find(p=>String(p.name)===String(i.data.product_name));
  $("product").value=match?String(match.id):"custom";$("custom").style.display=match?"none":"block";$("custom").value=match?"":(i.data.product_name||"");
  $("qty").value=i.data.quantity||1;$("price").value=i.data.unit_price||0;$("cost").value=i.data.unit_cost||0;$("payment").value=o.data.payment_method||"Cash";
  $("save").textContent="Update Offline Order";$("cancel").style.display="inline-block";window.scrollTo(0,0);
 }catch(e){message("Edit failed: "+e.message)}
}
async function saveOrder(){
 const productId=$("product").value,p=products.find(x=>String(x.id)===productId),name=productId==="custom"?$("custom").value.trim():(p?.name||"");
 const q=Math.max(1,Number($("qty").value||1)),price=Math.max(0,Number($("price").value||0)),cost=Math.max(0,Number($("cost").value||0));
 if(!name){message("Select a product or enter a custom item.");return}
 if(price<=0){message("Enter the sale price.");return}
 try{
  $("save").disabled=true;
  if(editId){
   const r=await db.from("offline_orders").update({customer_name:$("customer").value.trim()||"Walk-in",customer_phone:$("phone").value.trim()||null,payment_method:$("payment").value,subtotal:q*price,total:q*price,product_cost:q*cost,profit:q*price-q*cost,updated_at:new Date().toISOString()}).eq("id",editId);
   if(r.error)throw r.error;
   const d=await db.from("offline_order_items").delete().eq("order_id",editId);if(d.error)throw d.error;
   const a=await db.from("offline_order_items").insert({order_id:editId,product_name:name,sku:p?.sku||null,quantity:q,unit_price:price,unit_cost:cost,discount:0,line_total:q*price,line_cost:q*cost});if(a.error)throw a.error;
   message("Order updated.",true);
  }else{
   const n="OFF-"+Date.now().toString().slice(-8);
   const r=await db.from("offline_orders").insert({order_number:n,customer_name:$("customer").value.trim()||"Walk-in",customer_phone:$("phone").value.trim()||null,order_date:new Date().toISOString(),source:"offline",payment_method:$("payment").value,payment_status:"paid",subtotal:q*price,discount:0,shipping:0,total:q*price,product_cost:q*cost,other_cost:0,profit:q*price-q*cost}).select("id").single();
   if(r.error)throw r.error;
   const a=await db.from("offline_order_items").insert({order_id:r.data.id,product_name:name,sku:p?.sku||null,quantity:q,unit_price:price,unit_cost:cost,discount:0,line_total:q*price,line_cost:q*cost});
   if(a.error){await db.from("offline_orders").delete().eq("id",r.data.id);throw a.error}
   message("✓ Order "+n+" saved.",true);
  }
  reset();await loadOrders();
 }catch(e){message("Save failed: "+e.message)}finally{$("save").disabled=false}
}
function reset(){editId=null;$("customer").value="";$("phone").value="";$("product").value="";$("custom").value="";$("custom").style.display="none";$("qty").value=1;$("price").value=0;$("cost").value=0;$("payment").value="Cash";$("save").textContent="Save Offline Order";$("cancel").style.display="none"}
async function deleteOrder(id,n){if(!confirm("Delete "+n+"?"))return;try{let r=await db.from("offline_order_items").delete().eq("order_id",id);if(r.error)throw r.error;r=await db.from("offline_orders").delete().eq("id",id);if(r.error)throw r.error;message("Order deleted.",true);await loadOrders()}catch(e){message("Delete failed: "+e.message)}}
$("save").onclick=saveOrder;$("cancel").onclick=reset;
(async()=>{try{await getSession();$("status").innerHTML='<span class="ok">✓ Admin session active</span>';await loadProducts();await loadOrders()}catch(e){$("status").innerHTML='<span class="err">'+esc(e.message)+"</span>";$("orders").innerHTML='<div class="err">Could not load orders.</div>';message(e.message)}})();
window.editOrder=editOrder;window.deleteOrder=deleteOrder;
</script></body></html>
