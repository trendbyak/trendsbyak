<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Offline Orders</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><style>body{font:15px Arial;margin:0;background:#f7f4ef;color:#222}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:white;padding:18px;border-radius:12px;margin:14px 0;border:1px solid #ddd}.row{border:1px solid #ddd;padding:12px;border-radius:10px;margin:8px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}input,select{padding:10px;width:100%;box-sizing:border-box;margin:5px 0 12px}button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer;background:#222;color:white;margin-right:6px}.gold{background:#b28a4b}.danger{background:#b42318}.ok{color:#287a45}.err{color:#b42318;white-space:pre-wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>Offline Orders</h1><div id="status">Connecting to admin session…</div><div class="card"><h2>Add / Edit Offline Order</h2><label>Customer</label><input id="customer" placeholder="Walk-in customer"><label>Phone</label><input id="phone"><label>Product / Item</label><input id="product" placeholder="e.g. Scrunchies Medium"><div class="grid"><div><label>Quantity</label><input id="qty" type="number" value="1" min="1"></div><div><label>Sale price</label><input id="price" type="number" value="0" min="0"></div><div><label>Unit cost</label><input id="cost" type="number" value="0" min="0"></div><div><label>Payment</label><select id="payment"><option>Cash</option><option>UPI</option><option>Bank transfer</option><option>Card</option><option>Other</option></select></div></div><button id="save" class="gold">Save Offline Order</button><button id="cancel" style="display:none">Cancel Edit</button><div id="msg"></div></div><div class="card"><h2>Existing Offline Orders</h2><div id="orders">Loading…</div><div id="debug" class="err" style="margin-top:10px"></div></div></div><script>const U="https://ltxrycmreumoqfpcbwnb.supabase.co",K="sb_publishable_wdc4ImKB1f0Q-v4Po9DOwA_xIpPXHkh",db=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,storageKey:"trendsbyak-admin-auth",lock:(_name,_timeout,fn)=>fn()}});let editId=null;const $=x=>document.getElementById(x),msg=(x,c="err")=>{$("msg").className=c;$("msg").textContent=x};const money=x=>"₹"+Number(x||0).toLocaleString("en-IN");function esc(x){return String(x??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}async function session(){try{const raw=localStorage.getItem("trendsbyak-admin-auth");if(raw){const x=JSON.parse(raw);if(x&&x.access_token)return {access_token:x.access_token,refresh_token:x.refresh_token||null,user:x.user||null}}}catch(e){}throw new Error("Admin session token not found. Please open Admin Login first.")}async function rest(path,opts={}){const s=await session();const h=Object.assign({apikey:K,Authorization:"Bearer "+s.access_token},opts.headers||{});const r=await fetch(U+"/rest/v1/"+path,Object.assign({},opts,{headers:h}));let data=null;try{data=await r.json()}catch(e){}if(!r.ok)throw new Error((data&&data.message)||(data&&data.hint)||("Supabase HTTP "+r.status));return data}async function load(){const s=await session();if(!s){$("status").innerHTML='<span class="err">Admin login required.</span> <a href="login.html">Login</a>';return}$("status").innerHTML='<span class="ok">✓ Admin session active</span>';const orders=await rest("offline_orders?select=*&order=order_date.desc&limit=100");if(!orders.length){$("orders").textContent="No offline orders found.";return}const ids=orders.map(x=>x.id),ir=await rest("offline_order_items?select=id,order_id,product_name,sku,quantity,unit_price,unit_cost,discount,line_total,line_cost,created_at&order_id=in.("+ids.join(",")+")");const by={};(ir||[]).forEach(i=>(by[i.order_id]??=[]).push(i));$("orders").innerHTML=orders.map(x=>'<div class="row"><b>'+esc(x.order_number)+"</b> · "+esc(x.customer_name||"Walk-in")+" · "+money(x.total)+'<br><small>'+new Date(x.order_date).toLocaleString("en-IN")+" · "+esc(x.payment_method||"")+"</small><br>"+((by[x.id]||[]).map(i=>esc(i.product_name)+" × "+i.quantity+" @ "+money(i.unit_price)).join("<br>")||"No items")+'<br><button onclick="editOrder(\''+x.id+"\')">Edit</button><button class="danger" onclick="deleteOrder(\''+x.id+"\',\''+esc(x.order_number)+"\')">Delete</button></div>").join("")}async function editOrder(id){try{const oa=await rest("offline_orders?select=*&id=eq."+encodeURIComponent(id));if(!oa.length)throw new Error("Order not found.");const o={data:oa[0]};const ia=await rest("offline_order_items?select=product_name,quantity,unit_price,unit_cost&order_id=eq."+encodeURIComponent(id)+"&limit=1");if(!ia.length)throw new Error("Order item not found.");const i={data:ia[0]};editId=id;$("customer").value=o.data.customer_name||"";$("phone").value=o.data.customer_phone||"";$("product").value=i.data.product_name||"";$("qty").value=i.data.quantity||1;$("price").value=i.data.unit_price||0;$("cost").value=i.data.unit_cost||0;$("payment").value=o.data.payment_method||"Cash";$("save").textContent="Update Offline Order";$("cancel").style.display="inline-block";window.scrollTo(0,0)}catch(e){msg("Edit failed: "+e.message)}}async function save(){const name=$("product").value.trim()||"Item",q=Math.max(1,Number($("qty").value||1)),p=Math.max(0,Number($("price").value||0)),c=Math.max(0,Number($("cost").value||0));if(!p&&confirm("Sale price is ₹0. Save anyway?")===false)return;try{if(editId){await rest("offline_orders?id=eq."+encodeURIComponent(editId),{method:"PATCH",headers:{"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({customer_name:$("customer").value.trim()||"Walk-in",customer_phone:$("phone").value.trim()||null,payment_method:$("payment").value,total:q*p,subtotal:q*p,product_cost:q*c,profit:q*p-q*c,updated_at:new Date().toISOString()})});await rest("offline_order_items?order_id=eq."+encodeURIComponent(editId),{method:"DELETE"});await rest("offline_order_items",{method:"POST",headers:{"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({order_id:editId,product_name:name,quantity:q,unit_price:p,unit_cost:c,line_total:q*p,line_cost:q*c,discount:0})});msg("Order updated.","ok")}else{const n="OFF-"+Date.now().toString().slice(-8),ra=await rest("offline_orders",{method:"POST",headers:{"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify({order_number:n,customer_name:$("customer").value.trim()||"Walk-in",customer_phone:$("phone").value.trim()||null,order_date:new Date().toISOString(),source:"offline",payment_method:$("payment").value,payment_status:"paid",subtotal:q*p,discount:0,shipping:0,total:q*p,product_cost:q*c,other_cost:0,profit:q*p-q*c})}),oid=ra[0]?.id;if(!oid)throw new Error("Order was not created.");await rest("offline_order_items",{method:"POST",headers:{"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({order_id:oid,product_name:name,quantity:q,unit_price:p,unit_cost:c,discount:0,line_total:q*p,line_cost:q*c})})msg("Order saved.","ok")}reset();await load()}catch(e){msg("Save failed: "+e.message)}}function reset(){editId=null;$("customer").value="";$("phone").value="";$("product").value="";$("qty").value=1;$("price").value=0;$("cost").value=0;$("payment").value="Cash";$("save").textContent="Save Offline Order";$("cancel").style.display="none"}async function deleteOrder(id,n){if(!confirm("Delete "+n+"?"))return;try{await rest("offline_order_items?order_id=eq."+encodeURIComponent(id),{method:"DELETE"});await rest("offline_orders?id=eq."+encodeURIComponent(id),{method:"DELETE"});msg("Order deleted.","ok");await load()}catch(e){msg("Delete failed: "+e.message)}}$("save").onclick=save;$("cancel").onclick=reset;load().catch(e=>{console.error(e);$("orders").textContent="Could not load orders.";msg("Load failed: "+e.message)});window.editOrder=editOrder;window.deleteOrder=deleteOrder;</script></body></html>
