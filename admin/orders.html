<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Orders | Trends by AK</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f7f4ef;
    color: #292929;
}

/* =========================
   HEADER
========================= */

.top {
    height: 64px;
    background: #1b1b1b;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
}

.top strong {
    font-size: 19px;
    letter-spacing: .5px;
}

.top a {
    background: #c7a05d;
    color: #fff;
    text-decoration: none;
    padding: 9px 14px;
    border-radius: 6px;
}

/* =========================
   LAYOUT
========================= */

.layout {
    display: flex;
    min-height: calc(100vh - 64px);
}

.side {
    width: 220px;
    background: #1b1b1b;
    padding: 18px 12px;
    flex-shrink: 0;
}

.side a {
    display: block;
    color: #ddd;
    text-decoration: none;
    padding: 11px 13px;
    border-radius: 6px;
    margin-bottom: 4px;
}

.side a:hover,
.side a.active {
    background: #c7a05d;
    color: #fff;
}

main {
    flex: 1;
    padding: 28px;
    min-width: 0;
}

h1 {
    margin: 0 0 5px;
}

.sub {
    color: #777;
    margin-bottom: 24px;
}

/* =========================
   STAT CARDS
========================= */

.stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
    margin-bottom: 22px;
}

.stat {
    background: #fff;
    padding: 18px;
    border-radius: 11px;
    box-shadow: 0 2px 10px rgba(0,0,0,.03);
}

.stat small {
    color: #777;
    font-size: 11px;
    font-weight: 700;
}

.stat b {
    display: block;
    font-size: 24px;
    margin-top: 7px;
}

/* =========================
   SEARCH / FILTER
========================= */

.tools,
.list {
    background: #fff;
    border-radius: 11px;
    padding: 15px;
    margin-bottom: 15px;
    box-shadow: 0 2px 10px rgba(0,0,0,.03);
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 7px;
    font: inherit;
}

.filters {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    margin-top: 11px;
}

.filter {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 20px;
    padding: 8px 13px;
    cursor: pointer;
}

.filter.active {
    background: #292929;
    color: #fff;
}

/* =========================
   TABLE
========================= */

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 850px;
}

.wrap {
    overflow: auto;
}

th {
    background: #292929;
    color: #fff;
    padding: 12px;
    text-align: left;
    font-size: 12px;
}

td {
    padding: 12px;
    border-bottom: 1px solid #eee;
    font-size: 13px;
    vertical-align: top;
}

.btn {
    border: 0;
    border-radius: 6px;
    padding: 8px 11px;
    cursor: pointer;
    background: #292929;
    color: #fff;
}

.btn:hover {
    opacity: .85;
}

/* =========================
   STATUS
========================= */

.status {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 15px;
    font-size: 11px;
    font-weight: 700;
    text-transform: capitalize;
}

.s-pending {
    background: #fff1d6;
    color: #8a5b00;
}

.s-confirmed {
    background: #e8f0ff;
    color: #24549a;
}

.s-processing {
    background: #eee8ff;
    color: #5b3aa4;
}

.s-packed {
    background: #e5f6ed;
    color: #197044;
}

.s-shipped {
    background: #e5f5f7;
    color: #126b78;
}

.s-delivered {
    background: #dff5df;
    color: #267326;
}

.s-cancelled {
    background: #ffe4e4;
    color: #a42626;
}

.s-default {
    background: #eee;
    color: #555;
}

/* =========================
   STATES
========================= */

.loading,
.empty,
.error {
    text-align: center;
    padding: 50px;
    color: #777;
}

.error {
    color: #c62828;
}

/* =========================
   MODAL
========================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 50;
    padding: 20px;
    overflow: auto;
}

.modal.open {
    display: block;
}

.box {
    max-width: 950px;
    margin: 25px auto;
    background: #fff;
    border-radius: 11px;
    overflow: hidden;
}

.head {
    background: #292929;
    color: #fff;
    padding: 15px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.close {
    background: none;
    border: 0;
    color: #fff;
    font-size: 26px;
    cursor: pointer;
}

.body {
    padding: 20px;
}

/* =========================
   DETAILS
========================= */

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.info {
    background: #f7f4ef;
    padding: 14px;
    border-radius: 8px;
}

.info h3 {
    font-size: 13px;
    margin: 0 0 7px;
}

.info p {
    font-size: 13px;
    margin: 0;
    line-height: 1.5;
    word-break: break-word;
}

/* =========================
   ACTIONS
========================= */

.actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.actions button {
    border: 0;
    padding: 10px 13px;
    border-radius: 7px;
    color: #fff;
    cursor: pointer;
    font-weight: 700;
}

.invoice {
    background: #292929;
}

.pdf {
    background: #c7a05d;
}

.wa {
    background: #25d366;
}

.update {
    background: #292929;
    color: #fff;
    border: 0;
    padding: 10px 14px;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 10px;
}

.update:disabled {
    opacity: .6;
    cursor: not-allowed;
}

select {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font: inherit;
}

.tracking {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
}

.notice {
    padding: 10px 12px;
    background: #eef8ee;
    border-radius: 7px;
    color: #286b28;
    font-size: 13px;
    margin-bottom: 15px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:1100px) {

    .stats {
        grid-template-columns: repeat(3, 1fr);
    }

}

@media(max-width:800px) {

    .layout {
        display: block;
    }

    .side {
        width: 100%;
        padding: 10px;
    }

    .side a {
        display: inline-block;
        margin-right: 4px;
    }

    .stats {
        grid-template-columns: 1fr 1fr;
    }

    .grid,
    .tracking {
        grid-template-columns: 1fr;
    }

    main {
        padding: 15px;
    }

    .top {
        padding: 0 14px;
    }

}
</style>
</head>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://ltxrycmreumoqfpcbwnb.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_wdc4ImKB1f0Q-v4Po9DOwA_xIpPXHkh";

const client =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   STATE
===================================================== */

let orders = [];

let filter = "all";

let currentOrder = null;

let currentItems = [];


/* =====================================================
   HELPERS
===================================================== */

function esc(value) {

    return String(
        value == null ? "" : value
    )
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function money(value) {

    return "₹" +
        Number(value || 0)
        .toLocaleString(
            "en-IN",
            {
                maximumFractionDigits: 2
            }
        );

}


function norm(value) {

    return String(
        value || ""
    )
    .trim()
    .toLowerCase();

}


function dateText(value) {

    if (!value) {
        return "—";
    }

    const date =
        new Date(value);

    if (
        isNaN(
            date.getTime()
        )
    ) {
        return "—";
    }

    return date.toLocaleString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


function statusClass(status) {

    const value =
        norm(status);

    const allowed = [
        "pending",
        "confirmed",
        "processing",
        "packed",
        "shipped",
        "delivered",
        "cancelled"
    ];

    return (
        "status s-" +
        (
            allowed.includes(value)
                ? value
                : "default"
        )
    );

}


function getName(order) {

    return (
        order.customer_name ||
        order.name ||
        "Guest"
    );

}


function getEmail(order) {

    return (
        order.customer_email ||
        order.email ||
        ""
    );

}


function getPhone(order) {

    return (
        order.customer_phone ||
        order.phone ||
        ""
    );

}


/* =====================================================
   ADDRESS
===================================================== */

function getAddress(order) {

    let address =
        order.shipping_address ||
        order.billing_address;

    if (
        typeof address === "string"
    ) {

        try {

            address =
                JSON.parse(address);

        } catch (error) {

            return esc(address);

        }

    }

    if (
        address &&
        typeof address === "object"
    ) {

        const parts = [

            address.name,

            address.address_line1,

            address.address_line2,

            address.city,

            address.state,

            address.postal_code,

            address.zip,

            address.country

        ].filter(Boolean);

        if (parts.length) {

            return esc(
                parts.join(", ")
            );

        }

    }

    const parts = [

        order.address_line1,

        order.address_line2,

        order.city,

        order.state,

        order.postal_code,

        order.country

    ].filter(Boolean);

    return parts.length
        ? esc(parts.join(", "))
        : "—";

}


/* =====================================================
   SELECT OPTION
===================================================== */

function option(
    value,
    current
) {

    return (
        "<option value=\"" +
        esc(value) +
        "\" " +
        (
            norm(current) === value
                ? "selected"
                : ""
        ) +
        ">" +
        esc(
            value
                .charAt(0)
                .toUpperCase() +
            value.slice(1)
        ) +
        "</option>"
    );

}


/* =====================================================
   START
===================================================== */

async function start() {

    const session =
        await client.auth.getSession();

    if (
        !session.data.session
    ) {

        window.location.href =
            "login.html";

        return;

    }

    await loadOrders();

}


/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders() {

    const box =
        document.getElementById(
            "orders"
        );

    box.innerHTML =
        '<div class="loading">' +
        'Loading orders...' +
        '</div>';


    const result =
        await client
            .from("orders")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (result.error) {

        box.innerHTML =
            '<div class="error">' +
            'Could not load orders.' +
            '<br><br>' +
            esc(
                result.error.message
            ) +
            '</div>';

        return;

    }


    orders =
        result.data || [];


    updateStats();

    render();

}


/* =====================================================
   UPDATE STATS
===================================================== */

function updateStats() {

    document.getElementById(
        "total"
    ).textContent =
        orders.length;


    document.getElementById(
        "pending"
    ).textContent =
        orders.filter(
            order =>
                norm(
                    order.order_status
                ) === "pending"
        ).length;


    document.getElementById(
        "processing"
    ).textContent =
        orders.filter(
            order =>
                norm(
                    order.order_status
                ) === "processing"
        ).length;


    document.getElementById(
        "delivered"
    ).textContent =
        orders.filter(
            order =>
                norm(
                    order.order_status
                ) === "delivered"
        ).length;


    const paidRevenue =
        orders
            .filter(
                order =>
                    [
                        "paid",
                        "captured",
                        "success",
                        "successful"
                    ].includes(
                        norm(
                            order.payment_status
                        )
                    )
            )
            .reduce(
                (
                    total,
                    order
                ) =>
                    total +
                    Number(
                        order.total || 0
                    ),
                0
            );


    document.getElementById(
        "revenue"
    ).textContent =
        money(
            paidRevenue
        );

}


/* =====================================================
   RENDER TABLE
===================================================== */

function render() {

    const query =
        document
            .getElementById(
                "search"
            )
            .value
            .toLowerCase()
            .trim();


    const list =
        orders.filter(
            order => {

                const status =
                    norm(
                        order.order_status ||
                        "pending"
                    );


                if (
                    filter !== "all" &&
                    status !== filter
                ) {

                    return false;

                }


                if (!query) {

                    return true;

                }


                const searchable = [

                    order.order_number,

                    getName(order),

                    getEmail(order),

                    getPhone(order),

                    order.gateway_order_id,

                    order.gateway_payment_id,

                    order.invoice_number,

                    order.tracking_number

                ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();


                return searchable.includes(
                    query
                );

            }
        );


    if (!list.length) {

        document.getElementById(
            "orders"
        ).innerHTML =
            '<div class="empty">' +
            'No orders found.' +
            '</div>';

        return;

    }


    let html =
        '<div class="wrap">' +
        '<table>' +
        '<thead>' +
        '<tr>' +

        '<th>Order</th>' +
        '<th>Customer</th>' +
        '<th>Date</th>' +
        '<th>Amount</th>' +
        '<th>Payment</th>' +
        '<th>Status</th>' +
        '<th>Action</th>' +

        '</tr>' +
        '</thead>' +
        '<tbody>';


    list.forEach(
        order => {

            const status =
                norm(
                    order.order_status ||
                    "pending"
                );


            const payment =
                order.payment_status ||
                "pending";


            html +=

                '<tr>' +

                '<td>' +

                '<strong>' +
                esc(
                    order.order_number ||
                    order.id
                ) +
                '</strong>' +

                (
                    order.invoice_number
                    ?
                    '<br><small>Invoice: ' +
                    esc(
                        order.invoice_number
                    ) +
                    '</small>'
                    :
                    ''
                ) +

                '</td>' +


                '<td>' +

                '<strong>' +
                esc(
                    getName(order)
                ) +
                '</strong>' +

                '<br><small>' +
                esc(
                    getEmail(order)
                ) +
                '</small>' +

                (
                    getPhone(order)
                    ?
                    '<br><small>' +
                    esc(
                        getPhone(order)
                    ) +
                    '</small>'
                    :
                    ''
                ) +

                '</td>' +


                '<td>' +
                dateText(
                    order.created_at
                ) +
                '</td>' +


                '<td>' +

                '<strong>' +
                money(
                    order.total
                ) +
                '</strong>' +

                '</td>' +


                '<td>' +
                esc(payment) +
                '</td>' +


                '<td>' +

                '<span class="' +
                statusClass(status) +
                '">' +

                esc(status) +

                '</span>' +

                '</td>' +


                '<td>' +

                '<button ' +
                'class="btn" ' +
                'onclick="viewOrder(\'' +
                esc(
                    String(order.id)
                ) +
                '\')">' +

                'View' +

                '</button>' +

                '</td>' +


                '</tr>';

        }
    );


    html +=
        '</tbody>' +
        '</table>' +
        '</div>';


    document.getElementById(
        "orders"
    ).innerHTML =
        html;

}


/* =====================================================
   VIEW ORDER
===================================================== */

async function viewOrder(id) {

    const order =
        orders.find(
            item =>
                String(item.id) ===
                String(id)
        );


    if (!order) {

        alert(
            "Order not found."
        );

        return;

    }


    currentOrder =
        order;


    document.getElementById(
        "title"
    ).textContent =
        "Order " +
        (
            order.order_number ||
            order.id
        );


    document.getElementById(
        "modal"
    ).classList.add(
        "open"
    );


    document.getElementById(
        "body"
    ).innerHTML =
        '<div class="loading">' +
        'Loading order details...' +
        '</div>';


    const result =
        await client
            .from("order_items")
            .select("*")
            .eq(
                "order_id",
                order.id
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (result.error) {

        document.getElementById(
            "body"
        ).innerHTML =
            '<div class="error">' +
            esc(
                result.error.message
            ) +
            '</div>';

        return;

    }


    currentItems =
        result.data || [];


    renderOrderDetails(
        order,
        currentItems
    );

}


/* =====================================================
   ORDER DETAILS
===================================================== */

function renderOrderDetails(
    order,
    items
) {

    let rows = "";


    items.forEach(
        item => {

            rows +=

                '<tr>' +

                '<td>' +
                esc(
                    item.product_name ||
                    "Product"
                ) +
                '</td>' +

                '<td>' +
                Number(
                    item.quantity || 0
                ) +
                '</td>' +

                '<td>' +
                money(
                    item.unit_price
                ) +
                '</td>' +

                '<td>' +
                money(
                    item.line_total
                ) +
                '</td>' +

                '</tr>';

        }
    );


    if (!rows) {

        rows =
            '<tr>' +
            '<td colspan="4">' +
            'No order items found.' +
            '</td>' +
            '</tr>';

    }


    document.getElementById(
        "body"
    ).innerHTML =


        /* ACTIONS */

        '<div class="actions">' +

        '<button ' +
        'class="invoice" ' +
        'onclick="printInvoice()">' +

        '🧾 Print Invoice' +

        '</button>' +


        '<button ' +
        'class="pdf" ' +
        'onclick="printInvoice()">' +

        '📄 Save as PDF' +

        '</button>' +


        '<button ' +
        'class="wa" ' +
        'onclick="whatsappCustomer()">' +

        '📱 WhatsApp' +

        '</button>' +

        '</div>' +


        /* CUSTOMER */

/* =====================================================
   SAVE ORDER
===================================================== */

async function saveOrderChanges() {

    if (!currentOrder) {
        return;
    }


    const status =
        document.getElementById(
            "statusSelect"
        ).value;


    const trackingNumber =
        document.getElementById(
            "trackingNumber"
        ).value.trim();


    const trackingUrl =
        document.getElementById(
            "trackingUrl"
        ).value.trim();


    const button =
        document.querySelector(
            ".update"
        );


    button.disabled = true;

    button.textContent =
        "Saving...";


    const result =
        await client
            .from("orders")
            .update({

                order_status:
                    status,

                tracking_number:
                    trackingNumber ||
                    null,

                tracking_url:
                    trackingUrl ||
                    null,

                updated_at:
                    new Date()
                        .toISOString()

            })
            .eq(
                "id",
                currentOrder.id
            );


    button.disabled =
        false;


    button.textContent =
        "Save Order Changes";


    if (result.error) {

        alert(
            "Could not update order:\n\n" +
            result.error.message
        );

        return;

    }


    currentOrder.order_status =
        status;


    currentOrder.tracking_number =
        trackingNumber ||
        null;


    currentOrder.tracking_url =
        trackingUrl ||
        null;


    const index =
        orders.findIndex(
            order =>
                String(order.id) ===
                String(currentOrder.id)
        );


    if (index >= 0) {

        orders[index] =
            currentOrder;

    }


    updateStats();

    render();


    renderOrderDetails(
        currentOrder,
        currentItems
    );


    const notice =
        document.createElement(
            "div"
        );


    notice.className =
        "notice";


    notice.textContent =
        "Order updated successfully.";


    document.getElementById(
        "body"
    ).prepend(
        notice
    );

}


/* =====================================================
   WHATSAPP
===================================================== */

function whatsappCustomer() {

    if (!currentOrder) {
        return;
    }


    let phone =
        getPhone(
            currentOrder
        )
        .replace(
            /\D/g,
            ""
        );


    if (!phone) {

        alert(
            "No customer phone number is saved on this order."
        );

        return;

    }


    if (
        phone.length === 10
    ) {

        phone =
            "91" +
            phone;

    }


    const message =

        "Hi " +

        getName(
            currentOrder
        ) +

        ", your Trends by AK order " +

        (
            currentOrder.order_number ||
            ""
        ) +

        " is currently " +

        (
            currentOrder.order_status ||
            "pending"
        ) +

        ". Order total: " +

        money(
            currentOrder.total
        ) +

        ". Thank you for shopping with us!";


    window.open(

        "https://wa.me/" +
        phone +
        "?text=" +
        encodeURIComponent(
            message
        ),

        "_blank"

    );

}
