<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Orders | Trends by AK</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f7f4ef;
    color:#292929;
}

.top{
    height:64px;
    background:#1b1b1b;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
}

.top strong{
    font-size:19px;
    letter-spacing:.5px;
}

.top a{
    background:#c7a05d;
    color:#fff;
    text-decoration:none;
    padding:9px 14px;
    border-radius:6px;
}

.layout{
    display:flex;
    min-height:calc(100vh - 64px);
}

.side{
    width:220px;
    background:#1b1b1b;
    padding:18px 12px;
    flex-shrink:0;
}

.side a{
    display:block;
    color:#ddd;
    text-decoration:none;
    padding:11px 13px;
    border-radius:6px;
    margin-bottom:4px;
}

.side a:hover,
.side a.active{
    background:#c7a05d;
    color:#fff;
}

main{
    flex:1;
    padding:28px;
    min-width:0;
}

h1{
    margin:0 0 5px;
}

.sub{
    color:#777;
    margin-bottom:24px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:14px;
    margin-bottom:22px;
}

.stat{
    background:#fff;
    padding:18px;
    border-radius:11px;
    box-shadow:0 2px 10px rgba(0,0,0,.03);
}

.stat small{
    color:#777;
    font-size:11px;
    font-weight:700;
}

.stat b{
    display:block;
    font-size:24px;
    margin-top:7px;
}

.tools,
.list{
    background:#fff;
    border-radius:11px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.03);
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:7px;
    font:inherit;
}

.filters{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-top:11px;
}

.filter{
    background:#fff;
    border:1px solid #ddd;
    border-radius:20px;
    padding:8px 13px;
    cursor:pointer;
}

.filter.active{
    background:#292929;
    color:#fff;
}

.wrap{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th{
    background:#292929;
    color:#fff;
    padding:12px;
    text-align:left;
    font-size:12px;
}

td{
    padding:12px;
    border-bottom:1px solid #eee;
    font-size:13px;
    vertical-align:top;
}

.btn{
    border:0;
    border-radius:6px;
    padding:8px 11px;
    cursor:pointer;
    background:#292929;
    color:#fff;
}

.btn:hover{
    opacity:.85;
}

.status{
    display:inline-block;
    padding:5px 9px;
    border-radius:15px;
    font-size:11px;
    font-weight:700;
    text-transform:capitalize;
}

.s-pending{background:#fff1d6;color:#8a5b00}
.s-confirmed{background:#e8f0ff;color:#24549a}
.s-processing{background:#eee8ff;color:#5b3aa4}
.s-packed{background:#e5f6ed;color:#197044}
.s-shipped{background:#e5f5f7;color:#126b78}
.s-delivered{background:#dff5df;color:#267326}
.s-cancelled{background:#ffe4e4;color:#a42626}
.s-default{background:#eee;color:#555}

.loading,
.empty,
.error{
    text-align:center;
    padding:50px;
    color:#777;
}

.error{
    color:#c62828;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    z-index:50;
    padding:20px;
    overflow:auto;
}

.modal.open{
    display:block;
}

.box{
    max-width:950px;
    margin:25px auto;
    background:#fff;
    border-radius:11px;
    overflow:hidden;
}

.head{
    background:#292929;
    color:#fff;
    padding:15px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.close{
    background:none;
    border:0;
    color:#fff;
    font-size:26px;
    cursor:pointer;
}

.body{
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.info{
    background:#f7f4ef;
    padding:14px;
    border-radius:8px;
}

.info h3{
    font-size:13px;
    margin:0 0 7px;
}

.info p{
    font-size:13px;
    margin:0;
    line-height:1.5;
    word-break:break-word;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.actions button{
    border:0;
    padding:10px 13px;
    border-radius:7px;
    color:#fff;
    cursor:pointer;
    font-weight:700;
}

.invoice{background:#292929}
.pdf{background:#c7a05d}
.wa{background:#25d366}

.update{
    background:#292929;
    color:#fff;
    border:0;
    padding:10px 14px;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
}

.update:disabled{
    opacity:.6;
    cursor:not-allowed;
}

select{
    width:100%;
    padding:10px;
    border:1px solid #ddd;
    border-radius:6px;
    font:inherit;
}

.tracking{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:10px;
}

.notice{
    padding:10px 12px;
    background:#eef8ee;
    border-radius:7px;
    color:#286b28;
    font-size:13px;
    margin-bottom:15px;
}

.small{
    color:#777;
    font-size:11px;
}

@media(max-width:1100px){
    .stats{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:800px){

    .layout{
        display:block;
    }

    .side{
        width:100%;
        padding:10px;
    }

    .side a{
        display:inline-block;
        margin-right:4px;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .grid,
    .tracking{
        grid-template-columns:1fr;
    }

    main{
        padding:15px;
    }

    .top{
        padding:0 14px;
    }
}
</style>
</head>

<body>

<header class="top">
    <strong>TRENDS BY AK</strong>

    <a href="../index.html">
        View Store
    </a>
</header>

<div class="layout">

    <aside class="side">

        <a href="index.html">🏠 Dashboard</a>

        <a href="products.html">🛍️ Products</a>

        <a href="bulk-products.html">📥 Bulk Upload</a>

        <a href="collections.html">🎀 Collections</a>

        <a href="banners.html">🖼️ Banners</a>

        <a class="active" href="orders.html">📦 Orders</a>

        <a href="analytics.html">📊 Analytics</a>

        <a href="settings.html">⚙️ Settings</a>

    </aside>

    <main>

        <h1>Orders</h1>

        <div class="sub">
            Manage customer orders, payments, fulfilment and tracking.
        </div>

        <section class="stats">

            <div class="stat">
                <small>TOTAL ORDERS</small>
                <b id="total">0</b>
            </div>

            <div class="stat">
                <small>PENDING</small>
                <b id="pending">0</b>
            </div>

            <div class="stat">
                <small>PROCESSING</small>
                <b id="processing">0</b>
            </div>

            <div class="stat">
                <small>DELIVERED</small>
                <b id="delivered">0</b>
            </div>

            <div class="stat">
                <small>PAID REVENUE</small>
                <b id="revenue">₹0</b>
            </div>

        </section>

        <section class="tools">

            <input
                id="search"
                placeholder="Search order number, customer, email or phone"
            >

            <div class="filters">

                <button class="filter active" data-status="all">
                    All
                </button>

                <button class="filter" data-status="pending">
                    Pending
                </button>

                <button class="filter" data-status="confirmed">
                    Confirmed
                </button>

                <button class="filter" data-status="processing">
                    Processing
                </button>

                <button class="filter" data-status="packed">
                    Packed
                </button>

                <button class="filter" data-status="shipped">
                    Shipped
                </button>

                <button class="filter" data-status="delivered">
                    Delivered
                </button>

                <button class="filter" data-status="cancelled">
                    Cancelled
                </button>

            </div>

        </section>

        <section class="list" id="orders">

            <div class="loading">
                Loading orders...
            </div>

        </section>

    </main>

</div>

<div class="modal" id="modal">

    <div class="box">

        <div class="head">

            <strong id="title">
                Order Details
            </strong>

            <button
                class="close"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>

        <div class="body" id="body"></div>

    </div>

</div>

<script src="orders.js"></script>

</body>
</html>
