<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders | Trends by AK</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f4ef;color:#292929}
.top{height:64px;background:#1b1b1b;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.top strong{font-size:19px}
.top a{background:#c7a05d;color:#fff;text-decoration:none;padding:9px 14px;border-radius:6px}
.layout{display:flex;min-height:calc(100vh - 64px)}
.side{width:220px;background:#1b1b1b;padding:18px 12px;flex-shrink:0}
.side a{display:block;color:#ddd;text-decoration:none;padding:11px 13px;border-radius:6px;margin-bottom:4px}
.side a:hover,.side a.active{background:#c7a05d;color:#fff}
main{flex:1;padding:28px;min-width:0}
h1{margin:0 0 5px}.sub{color:#777;margin-bottom:24px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{background:#fff;padding:18px;border-radius:11px}
.stat small{color:#777}.stat b{display:block;font-size:24px;margin-top:7px}
.tools,.list{background:#fff;border-radius:11px;padding:15px;margin-bottom:15px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:7px}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.filter{background:#fff;border:1px solid #ddd;border-radius:20px;padding:8px 13px;cursor:pointer}
.filter.active{background:#292929;color:#fff}
table{width:100%;border-collapse:collapse;min-width:800px}
.wrap{overflow:auto}
th{background:#292929;color:#fff;padding:12px;text-align:left;font-size:12px}
td{padding:12px;border-bottom:1px solid #eee;font-size:13px}
.btn{border:0;border-radius:6px;padding:8px 11px;cursor:pointer;background:#292929;color:#fff}
.loading,.empty,.error{text-align:center;padding:50px;color:#777}.error{color:#c62828}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;padding:20px;overflow:auto}
.modal.open{display:block}
.box{max-width:900px;margin:25px auto;background:#fff;border-radius:11px;overflow:hidden}
.head{background:#292929;color:#fff;padding:15px 18px;display:flex;justify-content:space-between}
.close{background:none;border:0;color:#fff;font-size:26px;cursor:pointer}
.body{padding:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.info{background:#f7f4ef;padding:14px;border-radius:8px}
.info h3{font-size:13px;margin:0 0 7px}.info p{font-size:13px;margin:0;line-height:1.5}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.actions button{border:0;padding:10px 13px;border-radius:7px;color:#fff;cursor:pointer;font-weight:700}
.invoice{background:#292929}.pdf{background:#c7a05d}.wa{background:#25d366}
select{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px}
.save{margin-top:10px;background:#292929;color:#fff;border:0;padding:10px 14px;border-radius:6px;cursor:pointer}
@media(max-width:800px){.layout{display:block}.side{width:100%}.side a{display:inline-block}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}main{padding:15px}}
</style>
</head>
<body>
<header class="top">
<strong>TRENDS BY AK</strong>
<a href="../index.html">View Store</a>
</header>

<div class="layout">
<aside class="side">
<a href="index.html">🏠 Dashboard</a>
<a href="products.html">🛍️ Products</a>
<a href="bulk-products.html">📥 Bulk Upload</a>
<a href="collections.html">🎀 Collections</a>
<a href="banners.html">🖼️ Banners</a>
<a class="active" href="orders.html">📦 Orders</a>
<a href="settings.html">⚙️ Settings</a>
</aside>

<main>
<h1>Orders</h1>
<div class="sub">Manage your customer orders.</div>

<section class="stats">
<div class="stat"><small>TOTAL ORDERS</small><b id="total">0</b></div>
<div class="stat"><small>PENDING</small><b id="pending">0</b></div>
<div class="stat"><small>PROCESSING</small><b id="processing">0</b></div>
<div class="stat"><small>REVENUE</small><b id="revenue">₹0</b></div>
</section>

<section class="tools">
<input id="search" placeholder="Search order number, customer, email or phone">
<div class="filters">
<button class="filter active" data-status="all">All</button>
<button class="filter" data-status="pending">Pending</button>
<button class="filter" data-status="confirmed">Confirmed</button>
<button class="filter" data-status="processing">Processing</button>
<button class="filter" data-status="packed">Packed</button>
<button class="filter" data-status="shipped">Shipped</button>
<button class="filter" data-status="delivered">Delivered</button>
<button class="filter" data-status="cancelled">Cancelled</button>
</div>
</section>

<section class="list" id="orders"><div class="loading">Loading orders...</div></section>
</main>
</div>

<div class="modal" id="modal">
<div class="box">
<div class="head"><strong id="title">Order Details</strong><button class="close" onclick="closeModal()">×</button></div>
<div class="body" id="body"></div>
</div>
</div>

<script>
const SUPABASE_URL = "https://ltxrycmreumoqfpcbwnb.supabase.co";
const SUPABASE_KEY = "sb_publishable_wdc4ImKB1f0Q-v4Po9DOwA_xIpPXHkh";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let orders = [];
let filter = "all";

function esc(v) {
  return String(v == null ? "" : v)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function money(v) {
  return "₹" + Number(v || 0).toLocaleString("en-IN", {maximumFractionDigits:2});
}

function dateText(v) {
  if (!v) return "—";
  const d = new Date(v);
  return isNaN(d.getTime()) ? "—" : d.toLocaleString("en-IN", {
    day:"2-digit", month:"short", year:"numeric",
    hour:"2-digit", minute:"2-digit"
  });
}

function norm(v) {
  return String(v || "").trim().toLowerCase();
}

async function start() {
  const session = await client.auth.getSession();

  if (!session.data.session) {
    window.location.href = "login.html";
    return;
  }

  await loadOrders();
}

async function loadOrders() {
  const box = document.getElementById("orders");
  box.innerHTML = '<div class="loading">Loading orders...</div>';

  const result = await client
    .from("orders")
    .select("*")
    .order("created_at", {ascending:false});

  if (result.error) {
    box.innerHTML =
      '<div class="error">Could not load orders.<br><br>' +
      esc(result.error.message) + '</div>';
    return;
  }

  orders = result.data || [];

  document.getElementById("total").textContent = orders.length;
  document.getElementById("pending").textContent =
    orders.filter(function(o){return norm(o.order_status) === "pending";}).length;
  document.getElementById("processing").textContent =
    orders.filter(function(o){return norm(o.order_status) === "processing";}).length;

  const paid = orders
    .filter(function(o){return norm(o.payment_status) === "paid";})
    .reduce(function(sum,o){return sum + Number(o.total || 0);},0);

  document.getElementById("revenue").textContent = money(paid);

  render();
}

function render() {
  const q = document.getElementById("search").value.toLowerCase().trim();

  const list = orders.filter(function(o) {
    const status = norm(o.order_status || "pending");

    if (filter !== "all" && status !== filter) return false;

    if (!q) return true;

    const text = [
      o.order_number, o.customer_name, o.customer_email,
      o.customer_phone, o.email, o.phone
    ].filter(Boolean).join(" ").toLowerCase();

    return text.indexOf(q) !== -1;
  });

  if (!list.length) {
    document.getElementById("orders").innerHTML =
      '<div class="empty">No orders found.</div>';
    return;
  }

  let html = '<div class="wrap"><table><thead><tr>' +
    '<th>Order</th><th>Customer</th><th>Date</th>' +
    '<th>Amount</th><th>Payment</th><th>Status</th><th></th>' +
    '</tr></thead><tbody>';

  list.forEach(function(o) {
    const status = norm(o.order_status || "pending");

    html += '<tr>' +
      '<td><strong>' + esc(o.order_number || o.id) + '</strong></td>' +
      '<td>' + esc(o.customer_name || o.name || "Guest") +
        '<br><small>' + esc(o.customer_email || o.email || "") + '</small></td>' +
      '<td>' + dateText(o.created_at) + '</td>' +
      '<td><strong>' + money(o.total) + '</strong></td>' +
      '<td>' + esc(o.payment_status || "Pending") + '</td>' +
      '<td><span>' + esc(status) + '</span></td>' +
      '<td><button class="btn" onclick="viewOrder(\'' +
        esc(String(o.id)) + '\')">View</button></td>' +
      '</tr>';
  });

  html += '</tbody></table></div>';
  document.getElementById("orders").innerHTML = html;
}

async function viewOrder(id) {
  const order = orders.find(function(o){return String(o.id) === String(id);});
  if (!order) return alert("Order not found.");

  document.getElementById("title").textContent =
    "Order " + (order.order_number || order.id);

  document.getElementById("modal").classList.add("open");
  document.getElementById("body").innerHTML =
    '<div class="loading">Loading order details...</div>';

  const result = await client
    .from("order_items")
    .select("*")
    .eq("order_id", order.id)
    .order("created_at", {ascending:true});

  if (result.error) {
    document.getElementById("body").innerHTML =
      '<div class="error">' + esc(result.error.message) + '</div>';
    return;
  }

  const items = result.data || [];
  let rows = "";

  items.forEach(function(item) {
    rows += '<tr>' +
      '<td>' + esc(item.product_name || item.name || "Product") + '</td>' +
      '<td>' + Number(item.quantity || 0) + '</td>' +
      '<td>' + money(item.unit_price || item.price) + '</td>' +
      '<td>' + money(item.line_total || item.total) + '</td>' +
      '</tr>';
  });

  if (!rows) rows = '<tr><td colspan="4">No order items found.</td></tr>';

  const address = getAddress(order);

  document.getElementById("body").innerHTML =
    '<div class="actions">' +
      '<button class="invoice" onclick="printInvoice(\'' + esc(String(order.id)) + '\')">🧾 Print Invoice</button>' +
      '<button class="pdf" onclick="printInvoice(\'' + esc(String(order.id)) + '\')">📄 Save as PDF</button>' +
      '<button class="wa" onclick="whatsappCustomer(\'' + esc(String(order.id)) + '\')">📱 WhatsApp</button>' +
    '</div>' +

    '<h3>Customer</h3>' +
    '<div class="grid">' +
      '<div class="info"><h3>Name</h3><p>' + esc(order.customer_name || order.name || "Guest") + '</p></div>' +
      '<div class="info"><h3>Phone</h3><p>' + esc(order.customer_phone || order.phone || "—") + '</p></div>' +
      '<div class="info"><h3>Email</h3><p>' + esc(order.customer_email || order.email || "—") + '</p></div>' +
      '<div class="info"><h3>Address</h3><p>' + address + '</p></div>' +
    '</div>' +

    '<h3 style="margin-top:24px">Products</h3>' +
    '<div class="wrap"><table><thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead><tbody>' +
    rows + '</tbody></table></div>' +

    '<h3 style="margin-top:24px">Order Summary</h3>' +
    '<div class="info">' +
      '<p>Subtotal: <b>' + money(order.subtotal) + '</b></p>' +
      '<p>Discount: <b>- ' + money(order.discount) + '</b></p>' +
      '<p>Shipping: <b>' + money(order.shipping_fee || order.shipping) + '</b></p>' +
      '<p>Tax: <b>' + money(order.tax) + '</b></p>' +
      '<p>Total: <b>' + money(order.total) + '</b></p>' +
    '</div>' +

    '<h3 style="margin-top:24px">Payment</h3>' +
    '<div class="grid">' +
      '<div class="info"><h3>Status</h3><p>' + esc(order.payment_status || "Pending") + '</p></div>' +
      '<div class="info"><h3>Method</h3><p>' + esc(order.payment_method || "—") + '</p></div>' +
      '<div class="info"><h3>Gateway</h3><p>' + esc(order.gateway || "—") + '</p></div>' +
      '<div class="info"><h3>Payment ID</h3><p>' + esc(order.gateway_payment_id || order.payment_id || "—") + '</p></div>' +
    '</div>' +

    '<div style="margin-top:24px">' +
      '<label><b>Order Status</b></label>' +
      '<select id="statusSelect">' +
        option("pending",order.order_status) +
        option("confirmed",order.order_status) +
        option("processing",order.order_status) +
        option("packed",order.order_status) +
        option("shipped",order.order_status) +
        option("delivered",order.order_status) +
        option("cancelled",order.order_status) +
      '</select>' +
      '<button class="save" onclick="saveStatus(\'' + esc(String(order.id)) + '\')">Save Status</button>' +
    '</div>';
}

function option(value,current) {
  return '<option value="' + value + '"' +
    (norm(current) === value ? " selected" : "") + '>' +
    value.charAt(0).toUpperCase() + value.slice(1) +
    '</option>';
}

async function saveStatus(id) {
  const status = document.getElementById("statusSelect").value;

  const result = await client
    .from("orders")
    .update({order_status:status})
    .eq("id",id);

  if (result.error) {
    alert("Could not update status:\n\n" + result.error.message);
    return;
  }

  closeModal();
  await loadOrders();
}

function getAddress(order) {
  let a = order.shipping_address;

  if (typeof a === "string") {
    try { a = JSON.parse(a); } catch(e) {}
  }

  if (a && typeof a === "object") {
    return [
      a.address_line1,a.address_line2,a.address,
      a.city,a.state,a.postal_code || a.pincode,a.country
    ].filter(Boolean).map(esc).join("<br>");
  }

  return [
    order.address_line1,order.address_line2,
    order.city,order.state,order.postal_code || order.pincode,order.country
  ].filter(Boolean).map(esc).join("<br>") || "—";
}

function printInvoice(id) {
  const order = orders.find(function(o){return String(o.id) === String(id);});
  if (!order) return alert("Order not found.");

  client.from("order_items").select("*").eq("order_id",order.id)
    .then(function(result) {
      if (result.error) {
        alert(result.error.message);
        return;
      }

      const items = result.data || [];
      let rows = "";

      items.forEach(function(item) {
        rows += "<tr><td>" + esc(item.product_name || item.name || "Product") +
          "</td><td>" + Number(item.quantity || 0) +
          "</td><td>" + money(item.unit_price || item.price) +
          "</td><td>" + money(item.line_total || item.total) + "</td></tr>";
      });

      if (!rows) rows = "<tr><td colspan='4'>No product details found.</td></tr>";

      const win = window.open("", "_blank", "width=900,height=700");
      if (!win) {
        alert("Please allow pop-ups for the invoice.");
        return;
      }

      const invoice =
        "<!doctype html><html><head><title>Invoice</title>" +
        "<style>body{font-family:Arial;padding:35px;color:#222}.wrap{max-width:850px;margin:auto}" +
        ".head{display:flex;justify-content:space-between;border-bottom:2px solid #222;padding-bottom:18px}" +
        "h1{margin:0}.brand{font-size:25px;font-weight:bold}.muted{color:#777;font-size:12px}" +
        ".boxes{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:25px 0}.box{background:#f7f4ef;padding:15px;border-radius:8px;font-size:13px;line-height:1.6}" +
        "table{width:100%;border-collapse:collapse}th{background:#292929;color:#fff;padding:10px;text-align:left}td{padding:10px;border-bottom:1px solid #ddd}" +
        ".total{margin-left:auto;width:300px;margin-top:20px;border-top:2px solid #222;padding-top:12px;font-size:18px;font-weight:bold}" +
        ".foot{text-align:center;margin-top:45px;color:#777;border-top:1px solid #ddd;padding-top:15px;font-size:11px}</style></head><body>" +
        "<div class='wrap'><div class='head'><div><div class='brand'>TRENDS BY AK</div><div class='muted'>Sustainable Luxury but affordable</div></div>" +
        "<div><h1>INVOICE</h1><div>" + esc(order.invoice_number || ("INV-" + (order.order_number || order.id))) +
        "</div><div class='muted'>" + dateText(order.created_at) + "</div></div></div>" +
        "<div class='boxes'><div class='box'><b>BILL TO</b><br>" +
        esc(order.customer_name || order.name || "Customer") + "<br>" +
        esc(order.customer_email || order.email || "") + "<br>" +
        esc(order.customer_phone || order.phone || "") + "</div>" +
        "<div class='box'><b>SHIPPING ADDRESS</b><br>" + getAddress(order) + "</div></div>" +
        "<table><thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead><tbody>" +
        rows + "</tbody></table>" +
        "<div class='total'>Total: " + money(order.total) + "</div>" +
        "<div class='foot'>Thank you for shopping with Trends by AK.</div></div></body></html>";

      win.document.open();
      win.document.write(invoice);
      win.document.close();
      setTimeout(function(){win.focus();win.print();},500);
    });
}

function whatsappCustomer(id) {
  const order = orders.find(function(o){return String(o.id) === String(id);});
  if (!order) return alert("Order not found.");

  let phone = String(order.customer_phone || order.phone || "").replace(/[^0-9]/g,"");

  if (!phone) {
    alert("This order does not have a customer phone number.");
    return;
  }

  if (phone.length === 10) phone = "91" + phone;

  const message =
    "Hi " + (order.customer_name || "there") +
    "! This is Trends by AK regarding your order " +
    (order.order_number || order.id) +
    ". We wanted to update you about your order. Thank you for shopping with us! 💛";

  window.open(
    "https://wa.me/" + phone + "?text=" + encodeURIComponent(message),
    "_blank"
  );
}

function closeModal() {
  document.getElementById("modal").classList.remove("open");
}

document.getElementById("search").addEventListener("input",render);

document.querySelectorAll(".filter").forEach(function(btn) {
  btn.addEventListener("click",function() {
    document.querySelectorAll(".filter").forEach(function(x){x.classList.remove("active");});
    btn.classList.add("active");
    filter = btn.getAttribute("data-status");
    render();
  });
});

document.getElementById("modal").addEventListener("click",function(e) {
  if (e.target === this) closeModal();
});

start();

</script>
</body>
</html>
