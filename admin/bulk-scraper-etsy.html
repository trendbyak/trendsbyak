<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Etsy Importer | Trends by AK</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:14px Arial;background:#f7f4ef;color:#222;margin:0}.top{background:#171717;color:#fff;padding:16px 20px}.wrap{max-width:1000px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e7e1d8;border-radius:14px;padding:18px;margin-bottom:15px}textarea,input{width:100%;box-sizing:border-box;border:1px solid #ddd;border-radius:8px;padding:10px;font:inherit}textarea{min-height:130px}.btn{border:0;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer;background:#b28a4b;color:#fff;margin-top:10px}.result{border:1px solid #e7e1d8;border-radius:12px;padding:14px;margin-top:12px}.err{background:#fff0f0;color:#a33;padding:10px;border-radius:8px}.ok{background:#edf7ed;color:#356b35;padding:10px;border-radius:8px}.imgs{display:flex;gap:8px;flex-wrap:wrap}.imgs img{width:90px;height:90px;object-fit:cover;border-radius:8px}</style></head><body><div class="top"><b>Trends by AK · Etsy Importer</b></div><main class="wrap"><section class="card"><h2>Import Etsy products</h2><p>This page uses the current public-page Etsy importer, not the old Etsy API importer.</p><textarea id="urls" placeholder="Paste one Etsy listing URL per line"></textarea><button id="go" class="btn">Fetch Etsy Products</button><div id="results"></div></section></main><script>const U='https://ltxrycmreumoqfpcbwnb.supabase.co',K='sb_publishable_wdc4ImKB1f0Q-v4Po9DOwA_xIpPXHkh',db=window.supabase.createClient(U,K),$=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function auth(){const r=await db.auth.getSession();if(r.error||!r.data.session){location.href='login.html';return false}return true}async function run(){const urls=[...new Set($("urls").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean))];if(!urls.length)return;$("go").disabled=true;$("results").innerHTML='Fetching…';const out=[];for(const url of urls){try{const r=await db.functions.invoke('etsy-import',{body:{url}});if(r.error){let d=r.error.message;try{if(r.error.context){const j=await r.error.context.json();d=j.error||j.message||d}}catch{}out.push({error:d,url})}else out.push(r.data||{error:'Empty response',url})}catch(e){out.push({error:e.message,url})}}$("results").innerHTML=out.map(p=>p.error?`<div class="result"><b>Failed</b><div>${esc(p.url||'')}</div><div class="err">${esc(p.error)}</div></div>`:`<div class="result"><div class="ok"><b>Ready:</b> ${esc(p.name)}</div><p><b>Source price:</b> ${esc(p.currency||'')} ${esc(p.price??'')}</p><p><b>SKU:</b> ${esc(p.sku||'')}</p><p><b>Description:</b> ${esc(p.description||'')}</p><div class="imgs">${(p.images||[]).map(x=>`<img src="${esc(x)}">`).join('')}</div></div>`).join('');$("go").disabled=false}$("go").onclick=run;(async()=>{await auth()})();</script></body></html>
