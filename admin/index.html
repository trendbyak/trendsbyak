<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trends by AK | Admin</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f8f5f0;
    color: #292929;
}

.admin-layout {
    display: flex;
    min-height: 100vh;
}

/* SIDEBAR */

.sidebar {
    width: 240px;
    background: #292929;
    color: white;
    padding: 30px 20px;
}

.logo {
    text-align: center;
    margin-bottom: 40px;
}

.logo h1 {
    font-size: 22px;
    color: #d1ad72;
}

.logo p {
    font-size: 11px;
    color: #aaa;
    margin-top: 5px;
}

.menu button,
.menu-link {
    display: block;
    width: 100%;
    border: none;
    background: transparent;
    color: #ddd;
    padding: 14px 15px;
    margin-bottom: 6px;
    text-align: left;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    text-decoration: none;
}

.menu button:hover,
.menu button.active,
.menu-link:hover {
    background: #d1ad72;
    color: white;
}

/* MAIN */

.main {
    flex: 1;
    padding: 35px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 35px;
}

.topbar h2 {
    font-size: 28px;
}

.topbar p {
    margin-top: 5px;
    color: #777;
}

.view-store {
    background: #d1ad72;
    color: white;
    padding: 11px 18px;
    border-radius: 25px;
    text-decoration: none;
    font-size: 14px;
}

/* DASHBOARD CARDS */

.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 35px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 14px;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.card span {
    font-size: 13px;
    color: #777;
}

.card h3 {
    font-size: 30px;
    margin-top: 10px;
}

/* QUICK ACTIONS */

.section {
    background: white;
    padding: 30px;
    border-radius: 14px;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.section h3 {
    margin-bottom: 20px;
}

.actions {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.action {
    border: 1px solid #e5ded4;
    background: #faf8f5;
    padding: 15px 20px;
    border-radius: 10px;
    cursor: pointer;
}

.action:hover {
    border-color: #d1ad72;
}

/* MOBILE */

@media (max-width: 800px) {

    .sidebar {
        width: 75px;
        padding: 20px 10px;
    }

    .logo p,
    .logo h1 {
        font-size: 0;
    }

    .menu button,
    .menu-link {
        text-align: center;
        font-size: 20px;
        padding: 12px 5px;
    }

    .menu button span,
    .menu-link span {
        display: none;
    }

    .main {
        padding: 20px;
    }

    .cards {
        grid-template-columns: repeat(2, 1fr);
    }

}

</style>

</head>


<body>

<div class="admin-layout">


<!-- SIDEBAR -->

<aside class="sidebar">

    <div class="logo">

        <h1>Trends by AK</h1>

        <p>ADMIN PANEL</p>

    </div>


    <div class="menu">

        <button class="active">
            🏠 <span>Dashboard</span>
        </button>


        <a href="products.html" class="menu-link">
            🛍️ <span>Products</span>
            <a href="bulk-products.html" class="menu-link">
    📥 <span>Bulk Upload</span>
        </a>


      <a href="collections.html" class="menu-link">
    🎀 <span>Collections</span>
</a>


<a href="banners.html" class="menu-link">
    🖼️ <span>Banners</span>
</a>

       <a href="orders.html" class="menu-link">
    📦 <span>Orders</span>
</a>


        <button>
            ⭐ <span>Reviews</span>
        </button>


        <button>
            ⚙️ <span>Settings</span>
        </button>

    </div>

</aside>


<!-- MAIN -->

<main class="main">


    <div class="topbar">

        <div>

            <h2>Dashboard</h2>

            <p>Welcome to Trends by AK</p>

        </div>


        <a href="../index.html" class="view-store">
            View Store →
            <button
    onclick="logoutAdmin()"
    style="
        background:#292929;
        color:white;
        border:0;
        padding:11px 18px;
        border-radius:25px;
        cursor:pointer;
        margin-left:10px;
    "
>
    Logout
</button>
        </a>

    </div>


    <!-- CARDS -->

    <div class="cards">


        <div class="card">

            <span>Products</span>

            <h3 id="productCount">0</h3>

        </div>


        <div class="card">

            <span>Collections</span>

            <h3>5</h3>

        </div>


        <div class="card">

            <span>Orders</span>

            <h3>0</h3>

        </div>


        <div class="card">

            <span>Reviews</span>

            <h3>0</h3>

        </div>


    </div>


    <!-- QUICK ACTIONS -->

    <div class="section">

        <h3>Quick Actions</h3>


        <div class="actions">

            <a href="products.html" class="action">
                ➕ Add Product
            </a>


            <a href="collections.html" class="action">
    🎀 Manage Collections
</a>


<a href="banners.html" class="action">
    🖼️ Manage Banners
</a>


            <button class="action">
                ⭐ Add Review
            </button>

        </div>

    </div>


</main>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

const ADMIN_SUPABASE_URL =
    "https://ltxrycmreumoqfpcbwnb.supabase.co";

const ADMIN_SUPABASE_KEY =
    "sb_publishable_wdc4ImKB1f0Q-v4Po9DOwA_xIpPXHkh";

const adminSupabase =
    window.supabase.createClient(
        ADMIN_SUPABASE_URL,
        ADMIN_SUPABASE_KEY
    );


async function protectAdminPage() {

    const {
        data: {
            session
        }
    } =
    await adminSupabase
        .auth
        .getSession();

    if (!session) {

        window.location.href =
            "login.html";

    }

}


protectAdminPage();


async function logoutAdmin() {

    await adminSupabase
        .auth
        .signOut();

    window.location.href =
        "login.html";

}

<script>

const SUPABASE_URL =
    "https://ltxrycmreumoqfpcbwnb.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_wdc4ImKB1f0Q-v4Po9DOwA_xIpPXHkh";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


async function loadProductCount() {

    const { count, error } =
        await supabaseClient
            .from("products")
            .select("*", {
                count: "exact",
                head: true
            });


    if (error) {

        console.error(
            "Could not load product count:",
            error
        );

        return;

    }


    document.getElementById(
        "productCount"
    ).textContent = count || 0;

}


loadProductCount();

</script>

</body>

</html>
