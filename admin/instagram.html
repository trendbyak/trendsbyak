<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Instagram Manager</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><style>body{font:14px Arial;margin:0;background:#f7f4ef;color:#211f1c}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e7dfd4;border-radius:14px;padding:18px;margin-bottom:15px}input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #e7dfd4;border-radius:8px;margin:5px 0 12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.item{border:1px solid #e7dfd4;border-radius:12px;overflow:hidden}.thumb{height:220px;background:#eee}.thumb img{width:100%;height:100%;object-fit:cover}.body{padding:12px}.btn{padding:10px 14px;border:0;border-radius:8px;background:#211f1c;color:#fff;font-weight:bold;cursor:pointer}.light{background:#fff;color:#211f1c;border:1px solid #e7dfd4}.danger{background:#fff0ee;color:#a33}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.msg{padding:10px;border-radius:8px;margin-bottom:12px}.ok{background:#edf7ed}.err{background:#fff0f0}@media(max-width:700px){.grid,.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><p><a href="index.html">← Dashboard</a></p><h1>Instagram Reels</h1><p>Add any Instagram Reel link and your own thumbnail. Each active card on the homepage links directly to that Reel.</p><div id="msg"></div><section class="card"><input id="url" placeholder="Instagram Reel link — https://www.instagram.com/reel/..."><div class="row"><div><input id="title" placeholder="Title"></div><div><input id="order" type="number" value="0" placeholder="Display order"></div></div><input id="thumbUrl" placeholder="Thumbnail image URL (optional)"><label>Or upload thumbnail from computer</label><input id="file" type="file" accept="image/*"><div id="preview"></div><select id="active"><option value="true">Active — show on homepage</option><option value="false">Hidden — do not show</option></select><button class="btn" id="save">Add Reel</button> <button class="btn light" id="cancel" style="display:none">Cancel</button></section><section class="card"><h2>Homepage Reels</h2><div id="list">Loading…</div></section></div><script>
const db=window.supabase.createClient('https://ltxrycmreumoqfpcbwnb.supabase.co','sb_publishable_wdc4ImKB1f0Q-v4Po9DOwA_xIpPXHkh',{auth:{persistSession:true,autoRefreshToken:true,storageKey:'trendsbyak-admin-auth'}});let editing=null,rows=[];const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function note(t,e=false){$('msg').textContent=t;$('msg').className='msg '+(e?'err':'ok');setTimeout(()=>$('msg').className='msg',3000)}function dataUrl(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}function reset(){editing=null;$('url').value='';$('title').value='';$('order').value=0;$('thumbUrl').value='';$('file').value='';$('active').value='true';$('preview').innerHTML='';$('save').textContent='Add Reel';$('cancel').style.display='none'}async function load(){let s=await db.auth.getSession();if(!s.data.session){location.href='login.html';return}let r=await db.from('instagram_reels').select('*').order('display_order').order('id');if(r.error){note(r.error.message,true);return}rows=r.data||[];$('list').innerHTML=rows.length?'<div class="grid">'+rows.map(x=>'<article class="item"><div class="thumb">'+(x.thumbnail_url?'<img src="'+esc(x.thumbnail_url)+'">':'')+'</div><div class="body"><b>'+esc(x.title||'Trends by AK')+'</b><p>'+esc(x.reel_url)+'</p><small>'+(x.is_active?'Active':'Hidden')+' · Order '+esc(x.display_order)+'</small><p><button class="btn light" onclick="editRow('+x.id+')">Edit</button> <button class="btn danger" onclick="delRow('+x.id+')">Delete</button></p></div></article>').join('')+'</div>':'No reels added yet.'}window.editRow=id=>{let x=rows.find(r=>r.id==id);editing=x.id;$('url').value=x.reel_url||'';$('title').value=x.title||'';$('order').value=x.display_order||0;$('thumbUrl').value=(x.thumbnail_url||'').startsWith('data:')?'':(x.thumbnail_url||'');$('active').value=String(x.is_active!==false);$('preview').innerHTML=x.thumbnail_url?'<img src="'+esc(x.thumbnail_url)+'" style="width:150px;height:150px;object-fit:cover;border-radius:8px">':'';$('save').textContent='Update Reel';$('cancel').style.display='inline-block';scrollTo(0,0)};window.delRow=async id=>{if(!confirm('Delete this reel?'))return;let r=await db.from('instagram_reels').delete().eq('id',id);if(r.error)note(r.error.message,true);else{note('Reel deleted');load()}};$('file').onchange=async()=>{let f=$('file').files[0];if(f)$('preview').innerHTML='<img src="'+await dataUrl(f)+'" style="width:150px;height:150px;object-fit:cover;border-radius:8px">'};$('cancel').onclick=reset;$('save').onclick=async()=>{let url=$('url').value.trim();if(!url)return note('Instagram Reel link is required.',true);let thumb=$('thumbUrl').value.trim();let f=$('file').files[0];if(f)thumb=await dataUrl(f);let p={reel_url:url,title:$('title').value.trim()||'Trends by AK',thumbnail_url:thumb||null,is_active:$('active').value==='true',display_order:Number($('order').value)||0};let r=editing?await db.from('instagram_reels').update(p).eq('id',editing):await db.from('instagram_reels').insert(p);if(r.error)note(r.error.message,true);else{note(editing?'Reel updated':'Reel added');reset();load()}};load();</script></body></html>
