<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bulk Scraper | Trends by AK</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--b:#171717;--g:#b28a4b;--c:#f7f4ef;--l:#e7e1d8;--m:#777;--ok:#edf7ed;--err:#fff0f0}*{box-sizing:border-box}body{margin:0;background:var(--c);color:#222;font:14px Arial,sans-serif}.top{background:var(--b);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}.top a{color:#fff;text-decoration:none}.wrap{max-width:1200px;margin:auto;padding:18px 12px 50px}.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:18px;margin-bottom:14px}.h{margin:0 0 8px}.note{background:#faf8f4;border-radius:10px;padding:12px;color:#666;line-height:1.5}.urls{width:100%;min-height:150px;border:1px solid var(--l);border-radius:10px;padding:12px;font:14px Arial;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:var(--g);color:#fff}.light{background:#fff;border:1px solid var(--l)}.danger{background:#fff;border:1px solid #edd5d5;color:#a33}.status{display:none;padding:11px;border-radius:9px;margin-top:10px}.status.show{display:block}.ok{background:var(--ok);color:#356b35}.err{background:var(--err);color:#a33}.results{display:grid;gap:12px;margin-top:14px}.item{border:1px solid var(--l);border-radius:12px;padding:12px;background:#fff}.item.failed{border-color:#efd0d0}.head{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}.name{font-weight:700;font-size:15px}.url{font-size:11px;color:var(--m);word-break:break-all;margin-top:4px}.thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.thumb{width:82px;height:82px;border-radius:8px;object-fit:cover;background:#f3f1ed;border:1px solid var(--l)}.fields{display:grid;grid-template-columns:1.5fr .7fr .7fr .8fr;gap:8px;margin-top:10px}.field label{display:block;font-size:11px;color:var(--m);font-weight:700;margin-bottom:4px}.field input,.field textarea{width:100%;border:1px solid var(--l);border-radius:8px;padding:9px;font:inherit}.field textarea{min-height:70px}.full{grid-column:1/-1}.check{display:flex;gap:8px;align-items:center}.check input{width:17px;height:17px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#f5efe7;font-size:11px}.summary{display:flex;gap:10px;flex-wrap:wrap}.stat{border:1px solid var(--l);border-radius:10px;padding:10px 14px;min-width:120px}.stat span{display:block;font-size:11px;color:var(--m)}.stat b{display:block;font-size:20px;margin-top:3px}@media(max-width:720px){.wrap{padding:12px 9px 40px}.card{padding:14px}.fields{grid-template-columns:1fr 1fr}.full{grid-column:1/-1}.btn{flex:1}.head{display:block}.thumb{width:72px;height:72px}}@media(max-width:480px){.fields{grid-template-columns:1fr}.full{grid-column:auto}.btn{width:100%;flex:auto}}</style></head><body><header class="top"><b>Trends by AK · Bulk Scraper</b><a href="products.html">← Products</a></header><main class="wrap"><section class="card"><h2 class="h">Bulk product scraper</h2><div class="note">Paste one product URL per line. The scraper fetches product details and <b>up to 3 product images</b> when available. Review everything before importing. Maximum 50 URLs per batch.</div><textarea id="urls" class="urls" placeholder="https://example.com/product-1&#10;https://example.com/product-2&#10;https://example.com/product-3"></textarea><div class="actions"><button id="scrape" class="btn primary">Fetch Products</button><button id="clear" class="btn light">Clear</button><a class="btn light" href="bulk-products.html">Excel Import / Export</a></div><div id="status" class="status"></div></section><section class="card" id="resultCard" hidden><div class="summary"><div class="stat"><span>URLs</span><b id="total">0</b></div><div class="stat"><span>Ready</span><b id="ready">0</b></div><div class="stat"><span>Failed</span><b id="failed">0</b></div></div><div class="actions"><button id="importAll" class="btn primary">Import Ready Products</button><button id="selectAll" class="btn light">Select / Deselect All</button></div><div id="results" class="results"></div><div id="importStatus" class="status"></div></section></main><script>const U='https://ltxrycmreumoqfpcbwnb.supabase.co',K='sb_publishable_wdc4ImKB1f0Q-v4Po9DOwA_xIpPXHkh',db=window.supabase.createClient(U,K),$=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let rows=[];function status(id,text,error=false){const e=$(id);e.textContent=text;e.className='status show '+(error?'err':'ok')}async function auth(){const r=await db.auth.getSession();if(r.error||!r.data.session){location.href='login.html';return false}return true}function imageHtml(images){return (images||[]).slice(0,3).map((u,i)=>`<img class="thumb" src="${esc(u)}" alt="Image ${i+1}" onerror="this.style.opacity=.25">`).join('')}function render(){let ok=rows.filter(x=>!x.error),bad=rows.length-ok.length;$('total').textContent=rows.length;$('ready').textContent=ok.length;$('failed').textContent=bad;$('importAll').disabled=!ok.length;$('results').innerHTML=rows.map((p,i)=>`<article class="item ${p.error?'failed':''}" data-i="${i}"><div class="head"><div><div class="name">${esc(p.name||'Failed product')}</div><div class="url">${esc(p.source_url||p.url||'')}</div></div>${p.error?'<span class="pill">Failed</span>':'<span class="pill">Ready</span>'}</div>${p.error?`<div class="status show err">${esc(p.error)}</div>`:`<div class="thumbs">${imageHtml(p.images)}${!p.images?.length?'<span class="meta">No images found</span>':''}</div><div class="fields"><div class="field"><label>Product name</label><input data-k="name" value="${esc(p.name||'')}"></div><div class="field"><label>Price</label><input data-k="price" type="number" min="0" step="0.01" value="${esc(p.price??'')}"></div><div class="field"><label>Sale price</label><input data-k="sale_price" type="number" min="0" step="0.01" value="${esc(p.sale_price??'')}"></div><div class="field"><label>SKU</label><input data-k="sku" value="${esc(p.sku||'')}"></div><div class="field full"><label>Description</label><textarea data-k="description">${esc(p.description||'')}</textarea></div><div class="field full"><label>Collection</label><input data-k="collection" placeholder="e.g. Scrunchies, Jewellery"></div></div><label class="check" style="margin-top:10px"><input type="checkbox" class="pick" checked> Import this product</label>`}</article>`).join('')}function sync(){rows.forEach((p,i)=>{const e=document.querySelector(`.item[data-i="${i}"]`);if(!e||p.error)return;e.querySelectorAll('[data-k]').forEach(x=>p[x.dataset.k]=x.value);p.selected=e.querySelector('.pick').checked})}async function scrape(){const urls=[...new Set($('urls').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean))].slice(0,50);if(!urls.length)return status('status','Paste at least one product URL.',true);$('scrape').disabled=true;status('status',`Fetching ${urls.length} product${urls.length>1?'s':''}…`);try{const r=await db.functions.invoke('bulk-import-products',{body:{urls}});if(r.error){let detail=r.error.message;try{if(r.error.context){const j=await r.error.context.json();detail=j.error||j.message||detail}}catch{}throw Error(detail)}rows=(r.data?.results||[]).map(x=>({...x,selected:!x.error}));render();$('resultCard').hidden=false;status('status',`✓ Fetch complete: ${rows.filter(x=>!x.error).length} ready, ${rows.filter(x=>x.error).length} failed.` ,rows.every(x=>x.error))}catch(e){status('status','Scraper failed: '+e.message,true)}finally{$('scrape').disabled=false}}async function importProducts(){sync();const selected=rows.filter(x=>!x.error&&x.selected);if(!selected.length)return status('importStatus','Select at least one product.',true);$('importAll').disabled=true;status('importStatus',`Importing ${selected.length} product${selected.length>1?'s':''}…`);let done=0,errors=[];for(const p of selected){const images=(p.images||[]).slice(0,3);const payload={name:p.name||'Imported Product',price:Number(p.price)||0,sale_price:p.sale_price===''?0:(Number(p.sale_price)||0),sku:p.sku||null,description:p.description||null,image_url:images[0]||p.image_url||null,image_urls:images};if(p.collection)payload.collection=p.collection;const q=await db.from('products').insert(payload).select('id').single();if(q.error)errors.push(`${p.name||'Product'}: ${q.error.message}`);else done++}if(errors.length){status('importStatus',`Imported ${done}. ${errors.length} failed: ${errors.slice(0,3).join(' | ')}`,true)}else status('importStatus',`✓ ${done} product${done>1?'s':''} imported successfully with up to 3 images each.`);$('importAll').disabled=false}function selectAll(){document.querySelectorAll('.pick').forEach(x=>x.checked=!x.checked)}$('scrape').onclick=scrape;$('importAll').onclick=importProducts;$('selectAll').onclick=selectAll;$('clear').onclick=()=>{$('urls').value='';rows=[];$('resultCard').hidden=true;$('status').className='status'};(async()=>{if(await auth()){} })();</script></body></html>
