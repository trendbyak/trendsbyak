<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | Trends by AK</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f8f5f0;
    font-family: Arial, sans-serif;
    color: #292929;
}

.login-box {
    width: min(420px, 90%);
    background: white;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 8px 35px rgba(0,0,0,.08);
}

.logo {
    text-align: center;
    margin-bottom: 30px;
}

.logo h1 {
    margin: 0;
    color: #292929;
}

.logo p {
    color: #d1ad72;
    font-size: 12px;
    letter-spacing: 2px;
}

label {
    display: block;
    margin: 18px 0 7px;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    border: 0;
    border-radius: 8px;
    background: #d1ad72;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
}

.message {
    display: none;
    margin-top: 18px;
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
}

.error {
    display: block;
    background: #ffebee;
    color: #c62828;
}

</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        <h1>Trends by AK</h1>
        <p>ADMIN PANEL</p>
    </div>

    <form id="loginForm">

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            autocomplete="email"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            autocomplete="current-password"
            required
        >

        <button
            type="submit"
            id="loginButton"
        >
            Login
        </button>

    </form>

    <div
        id="message"
        class="message"
    ></div>

</div>


<script>

const SUPABASE_URL =
    "https://ltxrycmreumoqfpcbwnb.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_wdc4ImKB1f0Q-v4Po9DOwA_xIpPXHkh";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        }
    );


async function checkExistingSession() {

    const {
        data: {
            session
        }
    } =
    await supabaseClient
        .auth
        .getSession();

    if (session) {

       window.location.href =
    "../index.html";

    }

}


checkExistingSession();


document
.getElementById("loginForm")
.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const email =
            document
            .getElementById("email")
            .value
            .trim();

        const password =
            document
            .getElementById("password")
            .value;

        const button =
            document
            .getElementById("loginButton");

        const message =
            document
            .getElementById("message");

        button.disabled = true;
        button.textContent = "Logging in...";

        message.className =
            "message";

        try {

            const {
                data,
                error
            } =
            await supabaseClient
                .auth
                .signInWithPassword({
                    email,
                    password
                });

            if (error) {

                throw error;

            }

            if (!data.session) {

                throw new Error(
                    "Login succeeded but no session was created."
                );

            }

           window.location.href =
    "../index.html";

        } catch (error) {

            console.error(error);

            message.textContent =
                error.message ||
                "Login failed.";

            message.className =
                "message error";

            button.disabled = false;
            button.textContent = "Login";

        }

    }
);

</script>

</body>
</html>
