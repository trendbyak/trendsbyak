<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trends by AK | Admin Dashboard</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f7f4ef;color:#211f1c;font:14px Arial,sans-serif}.main{max-width:1200px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #e7dfd4;border-radius:13px;padding:17px;margin-bottom:12px}.metric b{display:block;font-size:25px;margin-top:8px}.green{color:#287a45}.red{color:#b42318}.muted{color:#777}.row{display:flex;justify-content:space-between;gap:12px;border:1px solid #eee;border-radius:9px;padding:10px;margin:7px 0}.btn{border:0;border-radius:9px;padding:10px 14px;background:#211f1c;color:#fff;font-weight:700;text-decoration:none;cursor:pointer}.gold{background:#b28a4b}.actions{display:flex;gap:8px;flex-wrap:wrap}.error{display:none;background:#ffeded;color:#b42318;padding:11px;border-radius:9px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.main{padding:16px}}@media(max-width:430px){.grid{grid-template-columns:1fr}}</style></head><body><main class="main"><header style="display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:20px"><div><div style="font-size:11px;letter-spacing:1px;color:#b28a4b;font-weight:700">TRENDS BY AK · ADMIN</div><h1>Dashboard</h1><div class="muted" id="status">Live · updating every 15 seconds</div></div><div class="actions"><a class="btn gold" href="../index.html">View Store</a><button class="btn" id="refresh">↻ Refresh</button><button class="btn" id="logout">Logout</button></div></header><div id="error" class="error"></div><section class="grid"><div class="card metric"><small>CUSTOMERS</small><b id="customers">—</b></div><div class="card metric"><small>ONLINE NOW · LAST 3 MIN</small><b class="green" id="online">—</b></div><div class="card metric"><small>VISITORS · 24H</small><b id="visitors">—</b></div><div class="card metric"><small>OPEN CARTS</small><b class="red" id="carts">—</b></div></section><section class="card"><h2>Quick actions</h2><div class="actions"><a class="btn" href="orders.html">📦 Orders</a><a class="btn" href="offline-orders.html">🧾 Offline Sales</a><a class="btn" href="abandoned-carts.html">🛒 Abandoned Carts</a><a class="btn" href="customers.html">👥 Customers</a><a class="btn" href="products.html">🛍️ Products</a><a class="btn" href="analytics.html">📊 Analytics</a></div></section><section class="grid" style="grid-template-columns:1fr 1fr"><div class="card"><h2>Recent activity</h2><div id="events">Loading…</div></div><div class="card"><h2>Open cart queue</h2><div id="cartList">Loading…</div></div></section></main><script>const URL='https://ltxrycmreumoqfpcbwnb.supabase.co',KEY='sb_publishable_wdc4ImKB1f0Q-v4Po9DOwA_xIpPXHkh',db=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id),money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0});function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}function ago(v){if(!v)return'—';let m=Math.max(0,Math.floor((Date.now()-new Date(v))/60000));return m<1?'just now':m+' min ago'}async function auth(){const r=await db.auth.getSession();if(r.error||!r.data.session){location.href='login.html';return false}return true}async function load(){try{$('refresh').disabled=true;$('error').style.display='none';const since=new Date(Date.now()-86400000).toISOString(),onlineSince=new Date(Date.now()-180000).toISOString();const [c,l,e,a]=await Promise.all([db.from('customers').select('id',{count:'exact',head:true}),db.from('live_visitors').select('visitor_id',{count:'exact',head:true}).gt('last_seen',onlineSince),db.from('analytics_events').select('visitor_id').gte('created_at',since),db.from('abandoned_carts').select('id,customer_name,subtotal,last_activity_at,recovery_status').eq('recovery_status','open').order('last_activity_at',{ascending:false}).limit(5)]);for(const r of[c,l,e,a])if(r.error)throw r.error;const visitors=new Set((e.data||[]).map(x=>x.visitor_id).filter(Boolean)).size;$('customers').textContent=c.count??0;$('online').textContent=l.count??0;$('visitors').textContent=visitors;$('carts').textContent=a.data?.length??0;$('status').textContent='Live · updated '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});$('cartList').innerHTML=(a.data||[]).map(x=>`<div class="row"><span><b>${esc(x.customer_name||'Guest')}</b><br><small class="muted">${ago(x.last_activity_at)}</small></span><b>${money(x.subtotal)}</b></div>`).join('')||'<div class="muted">No open carts.</div>';const ev=await db.from('analytics_events').select('event_name,page_path,created_at').order('created_at',{ascending:false}).limit(8);if(ev.error)throw ev.error;$('events').innerHTML=(ev.data||[]).map(x=>`<div class="row"><span><b>${esc(x.event_name)}</b><br><small class="muted">${esc(x.page_path||'')}</small></span><small class="muted">${ago(x.created_at)}</small></div>`).join('')||'<div class="muted">No recent activity.</div>'}catch(e){$('error').textContent=e.message||'Could not load admin data.';$('error').style.display='block';$('status').textContent='Update failed — click Refresh'}finally{$('refresh').disabled=false}}$('refresh').onclick=load;$('logout').onclick=async()=>{await db.auth.signOut();location.href='login.html'};(async()=>{if(await auth())load()})();setInterval(()=>{if(!document.hidden)load()},15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});</script></body></html>
