<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reviews | Trends by AK Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f7f4ef;
    color:#222;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:30px 20px;
}

h1{
    margin-bottom:25px;
}

.card{
    background:#fff;
    padding:25px;
    border-radius:14px;
    margin-bottom:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

label{
    display:block;
    font-weight:600;
    margin-top:12px;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    margin-top:7px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
}

textarea{
    min-height:120px;
    resize:vertical;
}

button{
    border:0;
    padding:11px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
    margin-right:8px;
}

.primary{
    background:#111;
    color:#fff;
}

.secondary{
    background:#eee;
    color:#222;
}

.delete{
    background:#f3dddd;
    color:#a00000;
}

.review{
    border-top:1px solid #eee;
    padding:20px 0;
}

.review:first-child{
    border-top:0;
}

.stars{
    color:#c49a4a;
    letter-spacing:2px;
    margin:7px 0;
}

.status{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    margin:8px 0;
}

.visible{
    background:#e6f6e8;
    color:#217a2b;
}

.hidden{
    background:#eee;
    color:#777;
}

.message{
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
    display:none;
}

.success{
    background:#e7f6e9;
    color:#176b25;
}

.error{
    background:#fde8e8;
    color:#a00000;
}

</style>

</head>

<body>

<div class="container">

<h1>Customer Reviews</h1>

<div id="message" class="message"></div>

<!-- ADD REVIEW -->

<div class="card">

<h2>Add Customer Review</h2>

<label>Customer Name</label>

<input
    id="customerName"
    type="text"
    placeholder="Example: Sana"
>

<label>Rating</label>

<select id="rating">

    <option value="5">★★★★★ — 5 Stars</option>
    <option value="4">★★★★☆ — 4 Stars</option>
    <option value="3">★★★☆☆ — 3 Stars</option>
    <option value="2">★★☆☆☆ — 2 Stars</option>
    <option value="1">★☆☆☆☆ — 1 Star</option>

</select>

<label>Product Name</label>

<input
    id="productName"
    type="text"
    placeholder="Example: Pearl Necklace"
>

<label>Review</label>

<textarea
    id="reviewText"
    placeholder="What did the customer say?"
></textarea>

<label>Customer Image URL (optional)</label>

<input
    id="customerImage"
    type="text"
    placeholder="https://..."
>

<label style="font-weight:normal">

<input
    id="approved"
    type="checkbox"
    checked
    style="width:auto"
>

Show this review on the website

</label>

<br>

<button
    class="primary"
    onclick="addReview()"
>
    Add Review
</button>

</div>


<!-- EXISTING REVIEWS -->

<div class="card">

<h2>Existing Reviews</h2>

<div id="reviews">
    Loading reviews...
</div>

</div>

</div>


<script>

/* ============================================
   SUPABASE CONFIG
   ============================================ */

const SUPABASE_URL = "https://ltxrycmreumoqfpcbwnb.supabase.co";

const SUPABASE_KEY = "sb_publishable_wdc4ImKB1f0Q-v4Po9DOwA_xIpPXHkh";


/* ============================================
   SUPABASE CLIENT
   ============================================ */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth:{
                persistSession:true,
                autoRefreshToken:true,
                detectSessionInUrl:true
            }
        }
    );


/* ============================================
   MESSAGE
   ============================================ */

function showMessage(text, type){

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.className =
        "message " + type;

    box.style.display = "block";

    setTimeout(() => {

        box.style.display = "none";

    }, 4000);
}


/* ============================================
   LOAD REVIEWS
   ============================================ */

async function loadReviews(){

    const container =
        document.getElementById("reviews");

    container.innerHTML =
        "Loading reviews...";


    const { data, error } =
        await supabaseClient
        .from("reviews")
        .select("*")
        .order("created_at", {
            ascending:false
        });


    if(error){

        console.error(error);

        container.innerHTML =
            `<p style="color:red">
                ${escapeHtml(error.message)}
            </p>`;

        return;
    }


    if(!data || data.length === 0){

        container.innerHTML =
            "<p>No reviews added yet.</p>";

        return;
    }


    container.innerHTML =
        data.map(review => {

            const stars =
                "★".repeat(review.rating || 0) +
                "☆".repeat(5 - (review.rating || 0));


            return `

                <div class="review">

                    <strong>
                        ${escapeHtml(
                            review.customer_name || ""
                        )}
                    </strong>

                    <div class="stars">
                        ${stars}
                    </div>

                    ${
                        review.product_name
                        ?
                        `<small>
                            ${escapeHtml(
                                review.product_name
                            )}
                        </small>`
                        :
                        ""
                    }

                    <p>
                        ${escapeHtml(
                            review.review_text || ""
                        )}
                    </p>

                    <span class="status ${
                        review.is_approved
                        ? "visible"
                        : "hidden"
                    }">

                        ${
                            review.is_approved
                            ? "Visible on website"
                            : "Hidden from website"
                        }

                    </span>

                    <br>

                    <button
                        class="secondary"
                        onclick="toggleReview(
                            ${review.id},
                            ${review.is_approved}
                        )"
                    >

                        ${
                            review.is_approved
                            ? "Hide Review"
                            : "Publish Review"
                        }

                    </button>


                    <button
                        class="delete"
                        onclick="deleteReview(${review.id})"
                    >
                        Delete
                    </button>

                </div>

            `;

        }).join("");
}


/* ============================================
   ADD REVIEW
   ============================================ */

async function addReview(){

    const customerName =
        document
        .getElementById("customerName")
        .value
        .trim();


    const rating =
        Number(
            document
            .getElementById("rating")
            .value
        );


    const productName =
        document
        .getElementById("productName")
        .value
        .trim();


    const reviewText =
        document
        .getElementById("reviewText")
        .value
        .trim();


    const customerImage =
        document
        .getElementById("customerImage")
        .value
        .trim();


    const approved =
        document
        .getElementById("approved")
        .checked;


    if(!customerName){

        showMessage(
            "Please enter customer name.",
            "error"
        );

        return;
    }


    if(!reviewText){

        showMessage(
            "Please enter the review.",
            "error"
        );

        return;
    }


    const { error } =
        await supabaseClient
        .from("reviews")
        .insert({

            customer_name:
                customerName,

            rating:
                rating,

            review_text:
                reviewText,

            product_name:
                productName || null,

            customer_image:
                customerImage || null,

            is_approved: false

        });


    if(error){

        console.error(error);

        showMessage(
            error.message,
            "error"
        );

        return;
    }


    document
        .getElementById("customerName")
        .value = "";


    document
        .getElementById("productName")
        .value = "";


    document
        .getElementById("reviewText")
        .value = "";


    document
        .getElementById("customerImage")
        .value = "";


    document
        .getElementById("approved")
        .checked = true;


    showMessage(
        "Review added successfully.",
        "success"
    );


    loadReviews();
}


/* ============================================
   PUBLISH / HIDE
   ============================================ */

async function toggleReview(
    id,
    currentStatus
){

    const { error } =
        await supabaseClient
        .from("reviews")
        .update({

            is_approved:
                !currentStatus

        })
        .eq("id", id);


    if(error){

        console.error(error);

        showMessage(
            error.message,
            "error"
        );

        return;
    }


    showMessage(
        currentStatus
        ? "Review hidden."
        : "Review published.",
        "success"
    );


    loadReviews();
}


/* ============================================
   DELETE
   ============================================ */

async function deleteReview(id){

    if(
        !confirm(
            "Are you sure you want to permanently delete this review?"
        )
    ){

        return;
    }


    const { error } =
        await supabaseClient
        .from("reviews")
        .delete()
        .eq("id", id);


    if(error){

        console.error(error);

        showMessage(
            error.message,
            "error"
        );

        return;
    }


    showMessage(
        "Review deleted.",
        "success"
    );


    loadReviews();
}


/* ============================================
   SECURITY
   ============================================ */

function escapeHtml(value){

    return String(value)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");
}


/* ============================================
   START
   ============================================ */

loadReviews();

</script>

</body>
</html>
