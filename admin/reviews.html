<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reviews | Trends by AK Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f7f4ef;
    color:#222;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:30px 20px;
}

h1{
    margin-bottom:25px;
}

h2{
    margin-top:0;
}

.card{
    background:#fff;
    padding:25px;
    border-radius:14px;
    margin-bottom:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

label{
    display:block;
    font-weight:600;
    margin-top:12px;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    margin-top:7px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
    font-family:inherit;
}

textarea{
    min-height:120px;
    resize:vertical;
}

input[type="checkbox"]{
    width:auto;
}

button{
    border:0;
    padding:11px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
    margin-right:8px;
}

.primary{
    background:#111;
    color:#fff;
}

.primary:hover{
    background:#333;
}

.secondary{
    background:#eee;
    color:#222;
}

.delete{
    background:#f3dddd;
    color:#a00000;
}

.instagram-btn{
    background:#8b6b42;
    color:#fff;
}

.review{
    border-top:1px solid #eee;
    padding:22px 0;
}

.review:first-child{
    border-top:0;
}

.review-type{
    display:inline-block;
    background:#f0e6d7;
    color:#8b6b42;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.5px;
    margin-bottom:8px;
}

.stars{
    color:#c49a4a;
    letter-spacing:2px;
    margin:7px 0;
}

.status{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    margin:8px 0;
}

.visible{
    background:#e6f6e8;
    color:#217a2b;
}

.hidden{
    background:#eee;
    color:#777;
}

.instagram-link{
    display:inline-block;
    margin-top:8px;
    color:#8b6b42;
    font-size:13px;
    word-break:break-all;
}

.instagram-preview{
    margin-top:12px;
    border:1px solid #eee;
    border-radius:10px;
    padding:12px;
    background:#faf8f4;
}

.instagram-preview img{
    width:120px;
    height:150px;
    object-fit:cover;
    border-radius:8px;
    display:block;
    margin-bottom:8px;
}

.message{
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
    display:none;
}

.success{
    background:#e7f6e9;
    color:#176b25;
}

.error{
    background:#fde8e8;
    color:#a00000;
}

.help{
    font-size:12px;
    color:#777;
    margin-top:6px;
    line-height:1.5;
}

.divider{
    height:1px;
    background:#eee;
    margin:25px 0;
}

@media(max-width:600px){

    .container{
        padding:20px 14px;
    }

    .card{
        padding:18px;
    }

    button{
        margin-bottom:8px;
    }

}

</style>

</head>


<body>

<div class="container">


<h1>
    Customer Reviews
</h1>


<div
    id="message"
    class="message"
></div>


<!-- =====================================================
     ADD REVIEW
====================================================== -->

<div class="card">

<h2>
    Add Customer Review
</h2>


<label>
    Review Type
</label>

<select id="reviewType">

    <option value="customer">
        Customer Review
    </option>

    <option value="instagram">
        Instagram Review
    </option>

</select>


<!-- CUSTOMER DETAILS -->

<div id="customerFields">

    <label>
        Customer Name
    </label>

    <input
        id="customerName"
        type="text"
        placeholder="Example: Sana"
    >


    <label>
        Rating
    </label>

    <select id="rating">

        <option value="5">
            ★★★★★ — 5 Stars
        </option>

        <option value="4">
            ★★★★☆ — 4 Stars
        </option>

        <option value="3">
            ★★★☆☆ — 3 Stars
        </option>

        <option value="2">
            ★★☆☆☆ — 2 Stars
        </option>

        <option value="1">
            ★☆☆☆☆ — 1 Star
        </option>

    </select>


    <label>
        Product Name
    </label>

    <input
        id="productName"
        type="text"
        placeholder="Example: Pearl Necklace"
    >


    <label>
        Review
    </label>

    <textarea
        id="reviewText"
        placeholder="What did the customer say?"
    ></textarea>


    <label>
        Customer Image URL
        <span style="font-weight:normal">
            (optional)
        </span>
    </label>

    <input
        id="customerImage"
        type="text"
        placeholder="https://..."
    >

</div>


<!-- INSTAGRAM DETAILS -->

<div
    id="instagramFields"
    style="display:none;"
>

    <label>
        Instagram Post / Reel URL
    </label>

    <input
        id="instagramUrl"
        type="url"
        placeholder="https://www.instagram.com/reel/..."
    >

    <div class="help">

        Paste the complete public Instagram post or Reel URL.
        Example:
        https://www.instagram.com/reel/XXXXXXXX/

    </div>


    <label>
        Instagram Username
    </label>

    <input
        id="instagramUsername"
        type="text"
        placeholder="@username"
    >


    <label>
        Customer Name
        <span style="font-weight:normal">
            (optional)
        </span>
    </label>

    <input
        id="instagramCustomerName"
        type="text"
        placeholder="Example: Sana"
    >


    <label>
        Rating
    </label>

    <select id="instagramRating">

        <option value="5">
            ★★★★★ — 5 Stars
        </option>

        <option value="4">
            ★★★★☆ — 4 Stars
        </option>

        <option value="3">
            ★★★☆☆ — 3 Stars
        </option>

        <option value="2">
            ★★☆☆☆ — 2 Stars
        </option>

        <option value="1">
            ★☆☆☆☆ — 1 Star
        </option>

    </select>


    <label>
        Review / Caption
    </label>

    <textarea
        id="instagramReviewText"
        placeholder="Paste the customer's review or Instagram caption here."
    ></textarea>


    <label>
        Product Name
    </label>

    <input
        id="instagramProductName"
        type="text"
        placeholder="Example: Anti-Tarnish Necklace"
    >


    <label>
        Instagram Thumbnail URL
        <span style="font-weight:normal">
            (optional)
        </span>
    </label>

    <input
        id="instagramThumbnail"
        type="url"
        placeholder="https://..."
    >

    <div class="help">

        Optional. If supplied, the homepage can display the image
        alongside the Instagram review.

    </div>

</div>


<div class="divider"></div>


<label style="font-weight:normal">

    <input
        id="approved"
        type="checkbox"
        checked
    >

    Show this review on the website

</label>


<br>


<button
    class="primary"
    onclick="addReview()"
>
    Add Review
</button>


</div>



<!-- =====================================================
     EXISTING REVIEWS
====================================================== -->

<div class="card">

<h2>
    Existing Reviews
</h2>


<div id="reviews">

    Loading reviews...

</div>

</div>


</div>



<script>


"use strict";


/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
    "https://ltxrycmreumoqfpcbwnb.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_wdc4ImKB1f0Q-v4Po9DOwA_xIpPXHkh";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth:{
                persistSession:true,
                autoRefreshToken:true,
                detectSessionInUrl:true
            }
        }
    );



/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
){

    const box =
        document.getElementById(
            "message"
        );


    box.textContent =
        text;


    box.className =
        "message " + type;


    box.style.display =
        "block";


    setTimeout(
        function(){

            box.style.display =
                "none";

        },
        4000
    );

}



/* =====================================================
   REVIEW TYPE SWITCH
===================================================== */

document
    .getElementById("reviewType")
    .addEventListener(
        "change",
        function(){

            const type =
                this.value;


            const customerFields =
                document.getElementById(
                    "customerFields"
                );


            const instagramFields =
                document.getElementById(
                    "instagramFields"
                );


            if(type === "instagram"){

                customerFields.style.display =
                    "none";

                instagramFields.style.display =
                    "block";

            }else{

                customerFields.style.display =
                    "block";

                instagramFields.style.display =
                    "none";

            }

        }
    );



/* =====================================================
   LOAD REVIEWS
===================================================== */

async function loadReviews(){

    const container =
        document.getElementById(
            "reviews"
        );


    container.innerHTML =
        "Loading reviews...";


    const {
        data,
        error
    } =
        await supabaseClient
        .from("reviews")
        .select("*")
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(error);


        container.innerHTML = `
            <p style="color:red">
                ${escapeHtml(error.message)}
            </p>
        `;


        return;

    }


    if(
        !data ||
        data.length === 0
    ){

        container.innerHTML =
            "<p>No reviews added yet.</p>";


        return;

    }


    container.innerHTML =
        data
        .map(
            function(review){

                const rating =
                    Math.max(
                        1,
                        Math.min(
                            5,
                            Number(
                                review.rating
                            ) || 5
                        )
                    );


                const stars =
                    "★".repeat(
                        rating
                    ) +
                    "☆".repeat(
                        5 - rating
                    );


                const isInstagram =
                    !!review.instagram_url;


                return `

                    <div class="review">

                        <span class="review-type">

                            ${
                                isInstagram
                                ? "INSTAGRAM REVIEW"
                                : "CUSTOMER REVIEW"
                            }

                        </span>


                        <strong>

                            ${
                                escapeHtml(
                                    review.customer_name ||
                                    review.instagram_username ||
                                    "Customer"
                                )
                            }

                        </strong>


                        <div class="stars">

                            ${stars}

                        </div>


                        ${
                            review.product_name

                            ?

                            `
                            <small>

                                ${escapeHtml(
                                    review.product_name
                                )}

                            </small>
                            `

                            :

                            ""
                        }


                        <p>

                            ${escapeHtml(
                                review.review_text || ""
                            )}

                        </p>


                        ${
                            isInstagram

                            ?

                            `
                            <a
                                class="instagram-link"
                                href="${escapeHtml(
                                    review.instagram_url
                                )}"
                                target="_blank"
                                rel="noopener"
                            >

                                View original Instagram post/reel ↗

                            </a>
                            `

                            :

                            ""
                        }


                        ${
                            review.customer_image

                            ?

                            `
                            <div class="instagram-preview">

                                <img
                                    src="${escapeHtml(
                                        review.customer_image
                                    )}"
                                    alt="Customer"
                                >

                            </div>
                            `

                            :

                            ""
                        }


                        ${
                            isInstagram &&
                            review.instagram_thumbnail

                            ?

                            `
                            <div class="instagram-preview">

                                <img
                                    src="${escapeHtml(
                                        review.instagram_thumbnail
                                    )}"
                                    alt="Instagram review"
                                >

                            </div>
                            `

                            :

                            ""
                        }


                        <span class="status ${
                            review.is_approved
                            ? "visible"
                            : "hidden"
                        }">

                            ${
                                review.is_approved
                                ? "Visible on website"
                                : "Hidden from website"
                            }

                        </span>


                        <br>


                        <button
                            class="secondary"
                            onclick="toggleReview(
                                ${review.id},
                                ${review.is_approved}
                            )"
                        >

                            ${
                                review.is_approved
                                ? "Hide Review"
                                : "Publish Review"
                            }

                        </button>


                        ${
                            isInstagram

                            ?

                            `
                            <button
                                class="instagram-btn"
                                onclick="openInstagram(
                                    '${escapeJs(
                                        review.instagram_url
                                    )}'
                                )"
                            >

                                Open Instagram

                            </button>
                            `

                            :

                            ""
                        }


                        <button
                            class="delete"
                            onclick="deleteReview(
                                ${review.id}
                            )"
                        >

                            Delete

                        </button>


                    </div>

                `;

            }
        )
        .join("");

}



/* =====================================================
   ADD REVIEW
===================================================== */

async function addReview(){

    const type =
        document
        .getElementById(
            "reviewType"
        )
        .value;


    const approved =
        document
        .getElementById(
            "approved"
        )
        .checked;


    /* ============================================
       CUSTOMER REVIEW
    ============================================ */

    if(type === "customer"){

        const customerName =
            document
            .getElementById(
                "customerName"
            )
            .value
            .trim();


        const rating =
            Number(
                document
                .getElementById(
                    "rating"
                )
                .value
            );


        const productName =
            document
            .getElementById(
                "productName"
            )
            .value
            .trim();


        const reviewText =
            document
            .getElementById(
                "reviewText"
            )
            .value
            .trim();


        const customerImage =
            document
            .getElementById(
                "customerImage"
            )
            .value
            .trim();


        if(!customerName){

            showMessage(
                "Please enter customer name.",
                "error"
            );

            return;

        }


        if(!reviewText){

            showMessage(
                "Please enter the review.",
                "error"
            );

            return;

        }


        const {
            error
        } =
            await supabaseClient
            .from("reviews")
            .insert({

                customer_name:
                    customerName,

                rating:
                    rating,

                review_text:
                    reviewText,

                product_name:
                    productName ||
                    null,

                customer_image:
                    customerImage ||
                    null,

                is_approved:
                    approved

            });


        if(error){

            console.error(error);


            showMessage(
                error.message,
                "error"
            );


            return;

        }


        clearCustomerForm();


        showMessage(
            approved
            ? "Review added and published."
            : "Review added as hidden.",
            "success"
        );


        loadReviews();


        return;

    }



    /* ============================================
       INSTAGRAM REVIEW
    ============================================ */

    const instagramUrl =
        document
        .getElementById(
            "instagramUrl"
        )
        .value
        .trim();


    const instagramUsername =
        document
        .getElementById(
            "instagramUsername"
        )
        .value
        .trim();


    const instagramCustomerName =
        document
        .getElementById(
            "instagramCustomerName"
        )
        .value
        .trim();


    const instagramRating =
        Number(
            document
            .getElementById(
                "instagramRating"
            )
            .value
        );


    const instagramReviewText =
        document
        .getElementById(
            "instagramReviewText"
        )
        .value
        .trim();


    const instagramProductName =
        document
        .getElementById(
            "instagramProductName"
        )
        .value
        .trim();


    const instagramThumbnail =
        document
        .getElementById(
            "instagramThumbnail"
        )
        .value
        .trim();


    if(!instagramUrl){

        showMessage(
            "Please paste the Instagram post or Reel URL.",
            "error"
        );

        return;

    }


    if(!isInstagramUrl(instagramUrl)){

        showMessage(
            "Please enter a valid Instagram URL.",
            "error"
        );

        return;

    }


    if(!instagramReviewText){

        showMessage(
            "Please add the Instagram review/caption.",
            "error"
        );

        return;

    }


    const {
        error
    } =
        await supabaseClient
        .from("reviews")
        .insert({

            customer_name:
                instagramCustomerName ||
                instagramUsername ||
                "Instagram Customer",

            rating:
                instagramRating,

            review_text:
                instagramReviewText,

            product_name:
                instagramProductName ||
                null,

            customer_image:
                null,

            is_approved:
                approved,

            instagram_url:
                instagramUrl,

            instagram_username:
                instagramUsername ||
                null,

            instagram_thumbnail:
                instagramThumbnail ||
                null

        });


    if(error){

        console.error(error);


        showMessage(
            error.message,
            "error"
        );


        return;

    }


    clearInstagramForm();


    showMessage(
        approved
        ? "Instagram review added and published."
        : "Instagram review added as hidden.",
        "success"
    );


    loadReviews();

}



/* =====================================================
   INSTAGRAM URL VALIDATION
===================================================== */

function isInstagramUrl(url){

    try{

        const parsed =
            new URL(url);


        return (
            parsed.hostname
                .toLowerCase()
                .includes("instagram.com")
        );

    }catch{

        return false;

    }

}



/* =====================================================
   OPEN INSTAGRAM
===================================================== */

function openInstagram(url){

    if(!url){
        return;
    }


    window.open(
        url,
        "_blank",
        "noopener"
    );

}



/* =====================================================
   CLEAR CUSTOMER FORM
===================================================== */

function clearCustomerForm(){

    document
        .getElementById(
            "customerName"
        )
        .value = "";


    document
        .getElementById(
            "productName"
        )
        .value = "";


    document
        .getElementById(
            "reviewText"
        )
        .value = "";


    document
        .getElementById(
            "customerImage"
        )
        .value = "";


    document
        .getElementById(
            "approved"
        )
        .checked = true;

}



/* =====================================================
   CLEAR INSTAGRAM FORM
===================================================== */

function clearInstagramForm(){

    document
        .getElementById(
            "instagramUrl"
        )
        .value = "";


    document
        .getElementById(
            "instagramUsername"
        )
        .value = "";


    document
        .getElementById(
            "instagramCustomerName"
        )
        .value = "";


    document
        .getElementById(
            "instagramReviewText"
        )
        .value = "";


    document
        .getElementById(
            "instagramProductName"
        )
        .value = "";


    document
        .getElementById(
            "instagramThumbnail"
        )
        .value = "";


    document
        .getElementById(
            "approved"
        )
        .checked = true;

}



/* =====================================================
   PUBLISH / HIDE
===================================================== */

async function toggleReview(
    id,
    currentStatus
){

    const {
        error
    } =
        await supabaseClient
        .from("reviews")
        .update({

            is_approved:
                !currentStatus

        })
        .eq(
            "id",
            id
        );


    if(error){

        console.error(error);


        showMessage(
            error.message,
            "error"
        );


        return;

    }


    showMessage(
        currentStatus
        ? "Review hidden."
        : "Review published.",
        "success"
    );


    loadReviews();

}



/* =====================================================
   DELETE
===================================================== */

async function deleteReview(id){

    if(
        !confirm(
            "Are you sure you want to permanently delete this review?"
        )
    ){

        return;

    }


    const {
        error
    } =
        await supabaseClient
        .from("reviews")
        .delete()
        .eq(
            "id",
            id
        );


    if(error){

        console.error(error);


        showMessage(
            error.message,
            "error"
        );


        return;

    }


    showMessage(
        "Review deleted.",
        "success"
    );


    loadReviews();

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}



/* =====================================================
   ESCAPE JAVASCRIPT STRING
===================================================== */

function escapeJs(value){

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /\r?\n/g,
        "\\n"
    );

}



/* =====================================================
   START
===================================================== */

loadReviews();

</script>

</body>
</html>
