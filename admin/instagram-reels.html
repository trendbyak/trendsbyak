<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Instagram Reels | Trends by AK</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f7f4ef;
  color:#222;
  font-family:Arial,sans-serif;
}

header{
  background:#171717;
  color:#fff;
  padding:18px 28px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  margin:0;
  font-size:21px;
}

header a{
  color:#fff;
  text-decoration:none;
  font-size:14px;
}

main{
  max-width:1000px;
  margin:30px auto;
  padding:0 20px;
}

.card{
  background:#fff;
  border-radius:12px;
  padding:24px;
  margin-bottom:22px;
  box-shadow:0 3px 15px #0000000b;
}

h2{
  margin:0 0 6px;
  font-size:28px;
}

.subtitle{
  color:#777;
  font-size:14px;
  margin-bottom:25px;
}

label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:7px;
}

input{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:7px;
  font:inherit;
}

input:focus{
  outline:none;
  border-color:#b28a4b;
}

.field{
  margin-bottom:18px;
}

.help{
  color:#777;
  font-size:12px;
  margin-top:7px;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  border:0;
  border-radius:7px;
  padding:11px 18px;
  cursor:pointer;
  font-weight:600;
}

.primary{
  background:#b28a4b;
  color:#fff;
}

.secondary{
  background:#fff;
  border:1px solid #ddd;
}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

#message{
  display:none;
  padding:12px;
  border-radius:7px;
  margin-bottom:18px;
  font-size:14px;
}

.success{
  background:#edf7ed;
  color:#356b35;
}

.error{
  background:#fff0f0;
  color:#9b3030;
}

.reel{
  display:grid;
  grid-template-columns:1fr auto;
  gap:15px;
  align-items:center;
  border:1px solid #eee;
  border-radius:9px;
  padding:16px;
  margin-bottom:12px;
}

.reel-url{
  font-size:14px;
  font-weight:600;
  word-break:break-all;
}

.reel-order{
  color:#777;
  font-size:12px;
  margin-top:6px;
}

.reel-actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.small-btn{
  border:1px solid #ddd;
  background:#fff;
  padding:7px 10px;
  border-radius:6px;
  cursor:pointer;
  font-size:12px;
}

.delete{
  color:#a33;
}

.status{
  display:inline-block;
  margin-top:8px;
  padding:4px 8px;
  border-radius:20px;
  font-size:11px;
}

.status.active{
  background:#edf7ed;
  color:#356b35;
}

.status.inactive{
  background:#f1f1f1;
  color:#777;
}

.empty{
  text-align:center;
  color:#777;
  padding:30px;
}

.loading{
  text-align:center;
  color:#777;
  padding:30px;
}

@media(max-width:700px){

  header{
    padding:16px;
  }

  header h1{
    font-size:17px;
  }

  main{
    padding:0 15px;
  }

  .reel{
    grid-template-columns:1fr;
  }

  .reel-actions{
    justify-content:flex-start;
  }
}
</style>
</head>

<body>

<header>

  <h1>
    Trends by AK — Instagram Reels
  </h1>

  <a href="index.html">
    ← Admin Dashboard
  </a>

</header>


<main>

  <section class="card">

    <h2>Instagram Reels</h2>

    <div class="subtitle">
      Add Instagram Reels to display on your main website.
    </div>


    <div id="message"></div>


    <form id="reelForm">

      <input
        type="hidden"
        id="reelId"
      >


      <div class="field">

        <label for="reelUrl">
          Instagram Reel URL *
        </label>

        <input
          id="reelUrl"
          type="url"
          required
          placeholder="https://www.instagram.com/reel/ABC123/"
        >

        <div class="help">
          You can paste a Reel link or an Instagram post link.
        </div>

      </div>


      <div class="field">

        <label for="displayOrder">
          Display Order
        </label>

        <input
          id="displayOrder"
          type="number"
          min="0"
          value="0"
        >

        <div class="help">
          0 appears first, then 1, 2, 3...
        </div>

      </div>


      <div class="actions">

        <button
          class="btn primary"
          id="saveBtn"
          type="submit"
        >
          Save Reel
        </button>

        <button
          class="btn secondary"
          type="button"
          onclick="newReel()"
        >
          Clear
        </button>

      </div>

    </form>

  </section>


  <section class="card">

    <h3 style="margin-top:0">
      Saved Reels
    </h3>

    <div id="reelList">

      <div class="loading">
        Loading Reels...
      </div>

    </div>

  </section>

</main>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://ltxrycmreumoqfpcbwnb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_wdc4ImKB1f0Q-v4Po9DOwA_xIpPXHkh";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );


/* =========================================
   HELPERS
========================================= */

function $(id){
  return document.getElementById(id);
}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/[&<>"']/g, function(m){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m];

    });

}


function message(text,type="success"){

  const el = $("message");

  el.textContent = text;

  el.className = type;

  el.style.display = "block";

  clearTimeout(window.messageTimer);

  window.messageTimer =
    setTimeout(function(){

      el.style.display = "none";

    },5000);

}


/* =========================================
   AUTH
========================================= */

async function requireAdmin(){

  const {
    data,
    error
  } =
  await supabaseClient.auth.getSession();

  if(error || !data.session){

    window.location.href = "login.html";

    return false;

  }

  return true;

}


/* =========================================
   VALIDATE INSTAGRAM URL
========================================= */

function validateInstagramUrl(value){

  try{

    const url =
      new URL(value.trim());

    const hostname =
      url.hostname.toLowerCase();

    if(
      hostname !== "instagram.com" &&
      hostname !== "www.instagram.com"
    ){

      return false;

    }


    const path =
      url.pathname;


    /*
      Accept:

      /reel/ABC123/
      /reel/ABC123
      /p/ABC123/
      /p/ABC123
    */

    if(
      /^\/reel\/[^\/]+\/?$/i.test(path)
    ){

      return true;

    }


    if(
      /^\/p\/[^\/]+\/?$/i.test(path)
    ){

      return true;

    }


    return false;

  }catch{

    return false;

  }

}


/* =========================================
   LOAD REELS
========================================= */

async function loadReels(){

  $("reelList").innerHTML =
    `
      <div class="loading">
        Loading Reels...
      </div>
    `;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("instagram_reels")
    .select(
      "id,reel_url,is_active,display_order,created_at"
    )
    .order(
      "display_order",
      {
        ascending:true
      }
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    console.error(
      "LOAD REELS ERROR:",
      error
    );


    $("reelList").innerHTML =
      `
        <div class="empty" style="color:#a33">
          ${escapeHtml(error.message)}
        </div>
      `;

    return;

  }


  renderReels(
    data || []
  );

}


/* =========================================
   RENDER
========================================= */

function renderReels(reels){

  if(!reels.length){

    $("reelList").innerHTML =
      `
        <div class="empty">
          No Instagram Reels added yet.
        </div>
      `;

    return;

  }


  $("reelList").innerHTML =
    reels.map(function(reel){

      return `
        <div class="reel">

          <div>

            <div class="reel-url">
              ${escapeHtml(reel.reel_url)}
            </div>

            <div class="reel-order">
              Display order:
              ${Number(reel.display_order || 0)}
            </div>

            <span
              class="status ${
                reel.is_active
                  ? "active"
                  : "inactive"
              }"
            >
              ${
                reel.is_active
                  ? "Visible on website"
                  : "Hidden"
              }
            </span>

          </div>


          <div class="reel-actions">

            <button
              class="small-btn"
              onclick="editReel(${reel.id})"
            >
              Edit
            </button>


            <button
              class="small-btn"
              onclick="toggleReel(
                ${reel.id},
                ${!reel.is_active}
              )"
            >
              ${
                reel.is_active
                  ? "Hide"
                  : "Show"
              }
            </button>


            <a
              class="small-btn"
              href="${escapeHtml(reel.reel_url)}"
              target="_blank"
              rel="noopener"
            >
              Open
            </a>


            <button
              class="small-btn delete"
              onclick="deleteReel(${reel.id})"
            >
              Delete
            </button>

          </div>

        </div>
      `;

    }).join("");

}


/* =========================================
   SAVE
========================================= */

async function saveReel(e){

  e.preventDefault();

  const saveBtn = document.getElementById("saveBtn");

  const reelUrlEl = document.getElementById("reelUrl");
  const titleEl = document.getElementById("title");
  const captionEl = document.getElementById("caption");
  const thumbnailUrlEl = document.getElementById("thumbnailUrl");
  const displayOrderEl = document.getElementById("displayOrder");
  const isActiveEl = document.getElementById("isActive");
  const reelIdEl = document.getElementById("reelId");

  if(!reelUrlEl){
    message("Reel URL field not found.", "error");
    return;
  }

  const reelUrl = reelUrlEl.value.trim();

  if(!reelUrl){

    message(
      "Please enter an Instagram Reel URL.",
      "error"
    );

    return;
  }

  let parsedUrl;

  try{

    parsedUrl = new URL(reelUrl);

  }catch{

    message(
      "Please enter a valid URL.",
      "error"
    );

    return;
  }

  const hostname =
    parsedUrl.hostname.toLowerCase();

  if(
    hostname !== "instagram.com" &&
    hostname !== "www.instagram.com"
  ){

    message(
      "Please enter a valid Instagram URL.",
      "error"
    );

    return;
  }

  const validPath =
    /^\/(reel|p)\/[^\/]+\/?/.test(
      parsedUrl.pathname
    );

  if(!validPath){

    message(
      "Please enter a valid Instagram Reel URL.",
      "error"
    );

    return;
  }

  const payload = {

    reel_url: reelUrl,

    title:
      titleEl
        ? titleEl.value.trim() || null
        : null,

    caption:
      captionEl
        ? captionEl.value.trim() || null
        : null,

    thumbnail_url:
      thumbnailUrlEl
        ? thumbnailUrlEl.value.trim() || null
        : null,

    display_order:
      displayOrderEl
        ? Number(displayOrderEl.value || 0)
        : 0,

    is_active:
      isActiveEl
        ? isActiveEl.value === "true"
        : true

  };

  const reelId =
    reelIdEl
      ? reelIdEl.value.trim()
      : "";

  saveBtn.disabled = true;

  saveBtn.textContent =
    reelId
      ? "Updating..."
      : "Saving...";

  try{

    let result;

    if(reelId){

      result =
        await supabaseClient
          .from("instagram_reels")
          .update(payload)
          .eq("id", reelId);

    }else{

      result =
        await supabaseClient
          .from("instagram_reels")
          .insert(payload);

    }

    if(result.error){

      console.error(
        "SUPABASE ERROR:",
        result.error
      );

      throw result.error;
    }

    message(
      reelId
        ? "Reel updated successfully."
        : "Reel saved successfully."
    );

    newReel();

    await loadReels();

  }catch(err){

    console.error(
      "SAVE REEL ERROR:",
      err
    );

    message(
      err.message ||
      "Could not save Reel.",
      "error"
    );

  }finally{

    saveBtn.disabled = false;

    saveBtn.textContent =
      "Save Reel";

  }

}

/* =========================================
   EDIT
========================================= */

async function editReel(id){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("instagram_reels")
    .select("*")
    .eq("id",id)
    .maybeSingle();


  if(error || !data){

    message(
      error?.message ||
      "Reel not found.",
      "error"
    );

    return;

  }


  $("reelId").value =
    data.id;


  $("reelUrl").value =
    data.reel_url || "";


  $("displayOrder").value =
    data.display_order ?? 0;


  $("saveBtn").textContent =
    "Update Reel";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================
   TOGGLE
========================================= */

async function toggleReel(id,status){

  const {
    error
  } =
  await supabaseClient
    .from("instagram_reels")
    .update({
      is_active:status
    })
    .eq("id",id);


  if(error){

    message(
      error.message,
      "error"
    );

    return;

  }


  message(
    status
      ? "Reel is now visible."
      : "Reel hidden."
  );


  await loadReels();

}


/* =========================================
   DELETE
========================================= */

async function deleteReel(id){

  if(
    !confirm(
      "Delete this Instagram Reel?"
    )
  ){

    return;

  }


  const {
    error
  } =
  await supabaseClient
    .from("instagram_reels")
    .delete()
    .eq("id",id);


  if(error){

    message(
      error.message,
      "error"
    );

    return;

  }


  message(
    "Reel deleted."
  );


  await loadReels();

}


/* =========================================
   NEW / CLEAR
========================================= */

function newReel(){

  $("reelForm").reset();

  $("reelId").value = "";

  $("displayOrder").value = 0;

  $("saveBtn").textContent =
    "Save Reel";

}


/* =========================================
   FORM
========================================= */

$("reelForm")
  .addEventListener(
    "submit",
    saveReel
  );


/* =========================================
   START
========================================= */

(async function(){

  const authenticated =
    await requireAdmin();


  if(!authenticated){

    return;

  }


  await loadReels();

})();

</script>

</body>
</html>
