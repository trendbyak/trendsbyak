<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Products | Trends by AK</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8f5f0;
            color: #292929;
        }


        /* =========================
           HEADER
        ========================= */

        .admin-header {

            background: #292929;
            color: white;

            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            position: sticky;
            top: 0;

            z-index: 100;

        }


        .admin-header h1 {

            margin: 0;

            font-size: 21px;

            font-weight: 600;

        }


        .header-actions {

            display: flex;

            gap: 10px;

            align-items: center;

        }


        .header-btn {

            text-decoration: none;

            border: 0;

            border-radius: 8px;

            padding: 10px 15px;

            cursor: pointer;

            font-size: 13px;

        }


        .store-btn {

            background: #d1ad72;

            color: white;

        }


        .logout-btn {

            background: #444;

            color: white;

        }


        /* =========================
           LAYOUT
        ========================= */

        .admin-layout {

            display: flex;

            min-height: calc(100vh - 65px);

        }


        .sidebar {

            width: 230px;

            background: #171717;

            padding: 25px 16px;

            flex-shrink: 0;

        }


        .sidebar a {

            display: block;

            color: #ddd;

            text-decoration: none;

            padding: 13px 15px;

            margin-bottom: 6px;

            border-radius: 8px;

            font-size: 14px;

        }


        .sidebar a:hover,

        .sidebar a.active {

            background: #d1ad72;

            color: white;

        }


        .main {

            flex: 1;

            padding: 30px;

            max-width: 1400px;

        }


        /* =========================
           PAGE TITLE
        ========================= */

        .page-title {

            margin-bottom: 25px;

        }


        .page-title h2 {

            margin: 0 0 7px;

            font-size: 28px;

        }


        .page-title p {

            margin: 0;

            color: #777;

        }


        /* =========================
           FORM
        ========================= */

        .form-box {

            background: white;

            padding: 25px;

            border-radius: 14px;

            margin-bottom: 35px;

            box-shadow: 0 3px 15px rgba(0,0,0,.05);

        }


        .form-box h3 {

            margin-top: 0;

        }


        .form-grid {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 18px;

        }


        .form-group {

            display: flex;

            flex-direction: column;

        }


        .form-group.full {

            grid-column: 1 / -1;

        }


        label {

            font-size: 13px;

            margin-bottom: 7px;

            font-weight: 600;

        }


        input,

        textarea,

        select {

            width: 100%;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-family: inherit;

            font-size: 14px;

            background: white;

        }


        textarea {

            min-height: 100px;

            resize: vertical;

        }


        input:focus,

        textarea:focus,

        select:focus {

            outline: none;

            border-color: #d1ad72;

        }


        .form-actions {

            margin-top: 20px;

            display: flex;

            gap: 10px;

        }


        .save-btn {

            background: #d1ad72;

            color: white;

            border: 0;

            padding: 13px 22px;

            border-radius: 8px;

            cursor: pointer;

        }


        .cancel-btn {

            background: #eee;

            color: #333;

            border: 0;

            padding: 13px 22px;

            border-radius: 8px;

            cursor: pointer;

            display: none;

        }


        /* =========================
           STATUS
        ========================= */

        .status {

            margin-top: 15px;

            padding: 12px;

            border-radius: 8px;

            display: none;

            font-size: 14px;

        }


        .status.success {

            display: block;

            background: #e8f5e9;

            color: #2e7d32;

        }


        .status.error {

            display: block;

            background: #ffebee;

            color: #c62828;

        }


        .status.info {

            display: block;

            background: #eef4ff;

            color: #2455a4;

        }


        /* =========================
           PRODUCT HEADER
        ========================= */

        .products-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 15px;

        }


        .products-header h2 {

            margin: 0;

        }


        .product-count {

            color: #777;

            font-size: 14px;

        }


        .bulk-btn {

            text-decoration: none;

            display: inline-block;

            background: #292929;

            color: white;

            padding: 11px 17px;

            border-radius: 8px;

            font-size: 13px;

        }


        /* =========================
           SEARCH
        ========================= */

        .search-box {

            background: white;

            padding: 15px;

            border-radius: 12px;

            margin-bottom: 20px;

        }


        .search-box input {

            max-width: 500px;

        }


        /* =========================
           PRODUCT GRID
        ========================= */

        #productList {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(280px, 1fr)
                );

            gap: 20px;

        }


        .product-card {

            background: white;

            border-radius: 14px;

            overflow: hidden;

            box-shadow:
                0 3px 15px
                rgba(0,0,0,.05);

        }


        .product-image {

            width: 100%;

            height: 240px;

            object-fit: cover;

            background: #f2eee8;

            display: block;

        }


        .no-image {

            height: 240px;

            background: #f2eee8;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #999;

            font-size: 13px;

        }


        .product-content {

            padding: 18px;

        }


        .product-name {

            font-size: 17px;

            font-weight: 600;

            margin-bottom: 7px;

        }


        .product-sku {

            color: #888;

            font-size: 12px;

            margin-bottom: 12px;

        }


        .product-category {

            display: inline-block;

            background: #f4eadb;

            color: #765a30;

            padding: 5px 9px;

            border-radius: 20px;

            font-size: 11px;

            margin-bottom: 12px;

        }


        .price-row {

            display: flex;

            gap: 10px;

            align-items: center;

            margin-bottom: 10px;

        }


        .sale-price {

            font-size: 19px;

            font-weight: bold;

        }


        .original-price {

            color: #999;

            text-decoration: line-through;

            font-size: 13px;

        }


        .product-meta {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 8px;

            margin: 12px 0;

        }


        .meta-box {

            background: #f8f5f0;

            padding: 9px;

            border-radius: 7px;

            font-size: 12px;

        }


        .meta-box strong {

            display: block;

            font-size: 14px;

            margin-top: 3px;

        }


        .active-status {

            color: #2e7d32;

        }


        .inactive-status {

            color: #c62828;

        }


        .product-actions {

            display: flex;

            gap: 8px;

            margin-top: 15px;

        }


        .edit-btn,

        .delete-btn {

            flex: 1;

            padding: 10px;

            border: 0;

            border-radius: 7px;

            cursor: pointer;

            font-size: 12px;

        }


        .edit-btn {

            background: #292929;

            color: white;

        }


        .delete-btn {

            background: #ffebee;

            color: #c62828;

        }


        /* =========================
           EMPTY / LOADING
        ========================= */

        .empty-box {

            background: white;

            padding: 50px;

            border-radius: 14px;

            text-align: center;

            color: #777;

            grid-column: 1 / -1;

        }


        .loading {

            text-align: center;

            padding: 50px;

            color: #777;

            grid-column: 1 / -1;

        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media(max-width: 800px) {

            .admin-layout {

                display: block;

            }


            .sidebar {

                width: 100%;

            }


            .main {

                padding: 20px;

            }


            .form-grid {

                grid-template-columns: 1fr;

            }


            .form-group.full {

                grid-column: auto;

            }


            .products-header {

                align-items: flex-start;

                flex-direction: column;

            }


            .admin-header {

                padding: 15px;

                flex-wrap: wrap;

                gap: 10px;

            }

        }


    </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="admin-header">

    <h1>
        Trends by AK — Admin Panel
    </h1>


    <div class="header-actions">

        <a
            href="../index.html"
            class="header-btn store-btn"
        >
            View Store
        </a>


        <button
            class="header-btn logout-btn"
            onclick="logoutAdmin()"
        >
            Logout
        </button>

    </div>

</header>



<div class="admin-layout">


    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside class="sidebar">

        <a href="index.html">
            🏠 Dashboard
        </a>


        <a
            href="products.html"
            class="active"
        >
            🛍️ Products
        </a>


        <a href="bulk-products.html">
            📥 Bulk Upload
        </a>


        <a href="collections.html">
            🎀 Collections
        </a>


        <a href="banners.html">
            🖼️ Banners
        </a>


        <a href="orders.html">
            📦 Orders
        </a>


        <a href="reviews.html">
            ⭐ Reviews
        </a>


        <a href="settings.html">
            ⚙️ Settings
        </a>

    </aside>



    <!-- =========================
         MAIN
    ========================= -->

    <main class="main">


        <div class="page-title">

            <h2>
                Product Manager
            </h2>

            <p>
                Manage products stored in your
                Supabase database.
            </p>

        </div>



        <!-- =========================
             PRODUCT FORM
        ========================= -->

        <div class="form-box">

            <h3 id="formTitle">
                Add Product
            </h3>


            <form id="productForm">


                <div class="form-grid">


                    <div class="form-group">

                        <label>
                            SKU
                        </label>

                        <input
                            type="text"
                            id="sku"
                            placeholder="TBK-SCR-001"
                        >

                    </div>



                    <div class="form-group">

                        <label>
                            Product Name *
                        </label>

                        <input
                            type="text"
                            id="productName"
                            required
                        >

                    </div>



                    <div class="form-group">

                        <label>
                            Price *
                        </label>

                        <input
                            type="number"
                            id="price"
                            min="0"
                            step="0.01"
                            required
                        >

                    </div>



                    <div class="form-group">

                        <label>
                            Sale Price
                        </label>

                        <input
                            type="number"
                            id="salePrice"
                            min="0"
                            step="0.01"
                        >

                    </div>



                    <div class="form-group">

                        <label>
                            Category
                        </label>

                        <input
                            type="text"
                            id="category"
                            placeholder="Scrunchies"
                        >

                    </div>



                    <div class="form-group">

                        <label>
                            Collection
                        </label>

                        <input
                            type="text"
                            id="collection"
                            placeholder="Best Sellers"
                        >

                    </div>



                    <div class="form-group">

                        <label>
                            Stock
                        </label>

                        <input
                            type="number"
                            id="stock"
                            min="0"
                            value="0"
                        >

                    </div>



                    <div class="form-group">

                        <label>
                            Status
                        </label>

                        <select id="statusSelect">

                            <option value="active">
                                Active
                            </option>

                            <option value="inactive">
                                Inactive
                            </option>

                        </select>

                    </div>



                    <div class="form-group full">

                        <label>
                            Product Image URL
                        </label>

                        <input
                            type="url"
                            id="imageUrl"
                            placeholder="https://..."
                        >

                    </div>



                    <div class="form-group full">

                        <label>
                            Description
                        </label>

                        <textarea
                            id="description"
                            placeholder="Describe your product..."
                        ></textarea>

                    </div>


                </div>



                <div class="form-actions">

                    <button
                        type="submit"
                        class="save-btn"
                        id="saveButton"
                    >
                        Save Product
                    </button>


                    <button
                        type="button"
                        class="cancel-btn"
                        id="cancelButton"
                    >
                        Cancel Edit
                    </button>

                </div>


                <div
                    id="statusMessage"
                    class="status"
                ></div>


            </form>

        </div>



        <!-- =========================
             PRODUCTS HEADER
        ========================= -->

        <div class="products-header">

            <div>

                <h2>
                    Your Products
                </h2>

                <div
                    class="product-count"
                    id="productCount"
                >
                    Loading...
                </div>

            </div>


            <a
                href="bulk-products.html"
                class="bulk-btn"
            >
                📥 Bulk Upload Products
            </a>

        </div>



        <!-- =========================
             SEARCH
        ========================= -->

        <div class="search-box">

            <input
                type="search"
                id="searchInput"
                placeholder="Search products, SKU or category..."
            >

        </div>



        <!-- =========================
             PRODUCT LIST
        ========================= -->

        <div id="productList">

            <div class="loading">
                Loading products...
            </div>

        </div>


    </main>

</div>



<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://ltxrycmreumoqfpcbwnb.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_wdc4ImKB1f0Q-v4Po9DOwA_xIpPXHkh";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =========================================
   VARIABLES
========================================= */

let allProducts = [];

let editingProductId = null;



/* =========================================
   ELEMENTS
========================================= */

const productForm =
    document.getElementById(
        "productForm"
    );


const productList =
    document.getElementById(
        "productList"
    );


const productCount =
    document.getElementById(
        "productCount"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const saveButton =
    document.getElementById(
        "saveButton"
    );


const cancelButton =
    document.getElementById(
        "cancelButton"
    );


const formTitle =
    document.getElementById(
        "formTitle"
    );


const statusMessage =
    document.getElementById(
        "statusMessage"
    );



/* =========================================
   ADMIN PROTECTION
========================================= */

async function protectAdminPage() {

    const {
        data: {
            session
        }
    } =
        await supabaseClient
            .auth
            .getSession();


    if (!session) {

        window.location.href =
            "login.html";

        return false;

    }


    return true;

}



protectAdminPage();



/* =========================================
   LOGOUT
========================================= */

async function logoutAdmin() {

    await supabaseClient
        .auth
        .signOut();


    window.location.href =
        "login.html";

}



/* =========================================
   STATUS MESSAGE
========================================= */

function showStatus(
    message,
    type = "info"
) {

    statusMessage.textContent =
        message;

    statusMessage.className =
        "status " + type;

}



/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts() {

    productList.innerHTML = `
        <div class="loading">
            Loading products...
        </div>
    `;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("products")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(
            "Product loading error:",
            error
        );


        productList.innerHTML = `
            <div class="empty-box">

                <strong>
                    Could not load products.
                </strong>

                <br><br>

                ${escapeHtml(error.message)}

            </div>
        `;


        productCount.textContent =
            "Error loading products";

        return;

    }


    allProducts =
        data || [];


    renderProducts(
        allProducts
    );

}



/* =========================================
   RENDER PRODUCTS
========================================= */

function renderProducts(
    products
) {

    productCount.textContent =
        `${products.length} product${
            products.length === 1
                ? ""
                : "s"
        }`;


    if (!products.length) {

        productList.innerHTML = `
            <div class="empty-box">

                <strong>
                    No products found.
                </strong>

                <br><br>

                Your products will appear
                here after they are added.

            </div>
        `;

        return;

    }


    productList.innerHTML =
        products
            .map(
                productCard
            )
            .join("");

}



/* =========================================
   PRODUCT CARD
========================================= */

function productCard(
    product
) {

    const image =
        product.image_url
            ? `
                <img
                    class="product-image"
                    src="${escapeAttribute(
                        product.image_url
                    )}"
                    alt="${escapeAttribute(
                        product.name
                    )}"
                    loading="lazy"
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                >

                <div
                    class="no-image"
                    style="display:none;"
                >
                    Image unavailable
                </div>
            `
            : `
                <div class="no-image">
                    No image
                </div>
            `;


    const price =
        Number(
            product.price || 0
        );


    const salePrice =
        product.sale_price !== null &&
        product.sale_price !== undefined &&
        product.sale_price !== ""
            ? Number(
                product.sale_price
            )
            : null;


    const displayPrice =
        salePrice !== null &&
        Number.isFinite(
            salePrice
        )
            ? salePrice
            : price;


    const status =
        String(
            product.status ||
            "active"
        ).toLowerCase();


    return `

        <div class="product-card">


            ${image}


            <div class="product-content">


                <div class="product-category">

                    ${escapeHtml(
                        product.category ||
                        "Uncategorised"
                    )}

                </div>


                <div class="product-name">

                    ${escapeHtml(
                        product.name ||
                        "Unnamed Product"
                    )}

                </div>


                <div class="product-sku">

                    SKU:
                    ${escapeHtml(
                        product.sku ||
                        "—"
                    )}

                </div>


                <div class="price-row">

                    <span class="sale-price">

                        ₹${formatPrice(
                            displayPrice
                        )}

                    </span>


                    ${
                        salePrice !== null &&
                        salePrice < price
                            ? `
                                <span
                                    class="original-price"
                                >
                                    ₹${formatPrice(
                                        price
                                    )}
                                </span>
                            `
                            : ""
                    }

                </div>


                <div class="product-meta">


                    <div class="meta-box">

                        Stock

                        <strong>
                            ${Number(
                                product.stock || 0
                            )}
                        </strong>

                    </div>


                    <div class="meta-box">

                        Status

                        <strong
                            class="${
                                status === "active"
                                    ? "active-status"
                                    : "inactive-status"
                            }"
                        >

                            ${
                                status === "active"
                                    ? "Active"
                                    : "Inactive"
                            }

                        </strong>

                    </div>


                    <div class="meta-box">

                        Collection

                        <strong>

                            ${escapeHtml(
                                product.collection ||
                                "—"
                            )}

                        </strong>

                    </div>


                    <div class="meta-box">

                        Category

                        <strong>

                            ${escapeHtml(
                                product.category ||
                                "—"
                            )}

                        </strong>

                    </div>


                </div>


                ${
                    product.description
                        ? `
                            <div
                                style="
                                    color:#777;
                                    font-size:13px;
                                    line-height:1.5;
                                    margin-top:10px;
                                "
                            >
                                ${escapeHtml(
                                    product.description
                                )}
                            </div>
                        `
                        : ""
                }


                <div class="product-actions">

                    <button
                        class="edit-btn"
                        onclick="editProduct(${Number(
                            product.id
                        )})"
                    >
                        Edit
                    </button>


                    <button
                        class="delete-btn"
                        onclick="deleteProduct(${Number(
                            product.id
                        )})"
                    >
                        Delete
                    </button>

                </div>


            </div>

        </div>

    `;

}



/* =========================================
   SEARCH
========================================= */

searchInput.addEventListener(
    "input",
    function() {

        const query =
            this.value
                .trim()
                .toLowerCase();


        if (!query) {

            renderProducts(
                allProducts
            );

            return;

        }


        const filtered =
            allProducts.filter(
                product => {

                    const searchable = [

                        product.name,

                        product.sku,

                        product.category,

                        product.collection,

                        product.description

                    ]
                    .filter(Boolean)
                    .join(" ")
                    .toLowerCase();


                    return searchable
                        .includes(query);

                }
            );


        renderProducts(
            filtered
        );

    }
);



/* =========================================
   ADD / EDIT PRODUCT
========================================= */

productForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        saveButton.disabled =
            true;


        saveButton.textContent =
            editingProductId
                ? "Updating..."
                : "Saving...";


        try {

            const sku =
                document
                    .getElementById("sku")
                    .value
                    .trim();


            const name =
                document
                    .getElementById("productName")
                    .value
                    .trim();


            const price =
                Number(
                    document
                        .getElementById("price")
                        .value
                );


            const salePriceValue =
                document
                    .getElementById("salePrice")
                    .value;


            const salePrice =
                salePriceValue === ""
                    ? null
                    : Number(
                        salePriceValue
                    );


            const category =
                document
                    .getElementById("category")
                    .value
                    .trim();


            const collection =
                document
                    .getElementById("collection")
                    .value
                    .trim();


            const stock =
                Number(
                    document
                        .getElementById("stock")
                        .value || 0
                );


            const description =
                document
                    .getElementById("description")
                    .value
                    .trim();


            const imageUrl =
                document
                    .getElementById("imageUrl")
                    .value
                    .trim();


            const status =
                document
                    .getElementById("statusSelect")
                    .value;


            if (!name) {

                throw new Error(
                    "Product name is required."
                );

            }


            if (
                !Number.isFinite(price) ||
                price < 0
            ) {

                throw new Error(
                    "Please enter a valid price."
                );

            }


            if (
                salePrice !== null &&
                (
                    !Number.isFinite(
                        salePrice
                    ) ||
                    salePrice < 0
                )
            ) {

                throw new Error(
                    "Please enter a valid sale price."
                );

            }


            if (
                salePrice !== null &&
                salePrice > price
            ) {

                throw new Error(
                    "Sale price cannot be higher than the original price."
                );

            }


            if (
                !Number.isFinite(stock) ||
                stock < 0
            ) {

                throw new Error(
                    "Please enter a valid stock quantity."
                );

            }


            const productData = {

                sku:
                    sku || null,

                name,

                price,

                sale_price:
                    salePrice,

                category:
                    category || null,

                collection:
                    collection || null,

                stock,

                description:
                    description || null,

                image_url:
                    imageUrl || null,

                status

            };


            let result;


            if (editingProductId) {

                result =
                    await supabaseClient
                        .from("products")
                        .update(
                            productData
                        )
                        .eq(
                            "id",
                            editingProductId
                        );

            } else {

                result =
                    await supabaseClient
                        .from("products")
                        .insert(
                            productData
                        );

            }


            if (result.error) {

                throw result.error;

            }


            showStatus(
                editingProductId
                    ? "Product updated successfully."
                    : "Product added successfully.",
                "success"
            );


            resetForm();


            await loadProducts();


        } catch (error) {

            console.error(
                "Save product error:",
                error
            );


            showStatus(
                error.message ||
                "Could not save product.",
                "error"
            );

        }


        saveButton.disabled =
            false;


        saveButton.textContent =
            editingProductId
                ? "Update Product"
                : "Save Product";

    }
);



/* =========================================
   EDIT PRODUCT
========================================= */

function editProduct(
    id
) {

    const product =
        allProducts.find(
            item =>
                Number(item.id) ===
                Number(id)
        );


    if (!product) {

        showStatus(
            "Product could not be found.",
            "error"
        );

        return;

    }


    editingProductId =
        product.id;


    document
        .getElementById("sku")
        .value =
            product.sku || "";


    document
        .getElementById("productName")
        .value =
            product.name || "";


    document
        .getElementById("price")
        .value =
            product.price || "";


    document
        .getElementById("salePrice")
        .value =
            product.sale_price ?? "";


    document
        .getElementById("category")
        .value =
            product.category || "";


    document
        .getElementById("collection")
        .value =
            product.collection || "";


    document
        .getElementById("stock")
        .value =
            product.stock ?? 0;


    document
        .getElementById("statusSelect")
        .value =
            product.status || "active";


    document
        .getElementById("imageUrl")
        .value =
            product.image_url || "";


    document
        .getElementById("description")
        .value =
            product.description || "";


    formTitle.textContent =
        "Edit Product";


    saveButton.textContent =
        "Update Product";


    cancelButton.style.display =
        "inline-block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}



/* =========================================
   CANCEL EDIT
========================================= */

cancelButton.addEventListener(
    "click",
    function() {

        resetForm();

    }
);



/* =========================================
   RESET FORM
========================================= */

function resetForm() {

    editingProductId =
        null;


    productForm.reset();


    document
        .getElementById("stock")
        .value = 0;


    document
        .getElementById("statusSelect")
        .value = "active";


    formTitle.textContent =
        "Add Product";


    saveButton.textContent =
        "Save Product";


    cancelButton.style.display =
        "none";

}



/* =========================================
   DELETE PRODUCT
========================================= */

async function deleteProduct(
    id
) {

    const product =
        allProducts.find(
            item =>
                Number(item.id) ===
                Number(id)
        );


    if (!product) {

        return;

    }


    const confirmed =
        confirm(
            `Delete "${product.name}"?\n\nThis cannot be undone.`
        );


    if (!confirmed) {

        return;

    }


    try {

        const {
            error
        } =
            await supabaseClient
                .from("products")
                .delete()
                .eq(
                    "id",
                    id
                );


        if (error) {

            throw error;

        }


        showStatus(
            "Product deleted successfully.",
            "success"
        );


        await loadProducts();


    } catch (error) {

        console.error(
            "Delete product error:",
            error
        );


        showStatus(
            error.message ||
            "Could not delete product.",
            "error"
        );

    }

}



/* =========================================
   PRICE FORMAT
========================================= */

function formatPrice(
    value
) {

    return Number(
        value || 0
    ).toLocaleString(
        "en-IN",
        {
            maximumFractionDigits: 2
        }
    );

}



/* =========================================
   HTML ESCAPE
========================================= */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}



function escapeAttribute(
    value
) {

    return escapeHtml(
        value
    );

}



/* =========================================
   START
========================================= */

async function startPage() {

    const authenticated =
        await protectAdminPage();


    if (!authenticated) {

        return;

    }


    await loadProducts();

}


startPage();
