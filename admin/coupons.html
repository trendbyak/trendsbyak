<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coupons | Trends by AK</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Arial,sans-serif;background:#f7f4ef;color:#292929}.top{height:64px;background:#1b1b1b;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.top a{color:#fff;text-decoration:none;background:#c7a05d;padding:9px 13px;border-radius:7px}.layout{display:flex;min-height:calc(100vh - 64px)}.side{width:220px;background:#1b1b1b;padding:18px 12px}.side a{display:block;color:#ddd;text-decoration:none;padding:11px 13px}.side a.active{background:#c7a05d;color:#fff}.layout main{flex:1;padding:25px}.panel{background:#fff;border:1px solid #eee;border-radius:12px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}input,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:7px;font:inherit}.btn{border:0;background:#292929;color:#fff;padding:10px 14px;border-radius:7px;cursor:pointer}.gold{background:#c7a05d}.red{background:#b42318}.muted{color:#777;font-size:12px}.message{padding:10px 12px;border-radius:7px;margin-bottom:12px;display:none}.success{display:block;background:#edf7ed;color:#34743a}.error{display:block;background:#ffebee;color:#c62828}.saving{opacity:.65;pointer-events:none}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:11px 9px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.table{overflow:auto}.pill{padding:4px 8px;border-radius:12px;background:#eee;font-size:11px}.on{background:#e5f5e5;color:#267326}.off{background:#ffe4e4;color:#a42626}@media(max-width:700px){.layout{display:block}.side{width:auto}.grid{grid-template-columns:1fr}.full{grid-column:auto}.layout main{padding:14px}}</style></head>
<body><header class="top"><strong>TRENDS BY AK — COUPONS</strong><a href="index.html">Dashboard</a></header><div class="layout"><aside class="side"><a href="index.html">🏠 Dashboard</a><a href="customers.html">👥 Customers</a><a href="orders.html">📦 Orders</a><a href="analytics.html">📊 Analytics</a><a class="active" href="coupons.html">🎟️ Coupons</a></aside><main><h1>Coupons</h1><div class="muted">Create general or customer-specific offers and control limits, dates and eligibility.</div><section class="panel"><h2>Create Coupon</h2><div id="msg" class="message"></div><form id="couponForm"><div class="grid"><div><label>Coupon Code *</label><input id="code" required placeholder="AK10"></div><div><label>Description</label><input id="description" placeholder="10% off your next order"></div><div><label>Discount Type</label><select id="type"><option value="percent">Percentage</option><option value="fixed">Fixed amount</option></select></div><div><label>Discount Value *</label><input id="value" type="number" min="0.01" step="0.01" required></div><div><label>Minimum Order Value</label><input id="min" type="number" min="0" value="0"></div><div><label>Maximum Discount</label><input id="max" type="number" min="0" placeholder="Optional"></div><div><label>Starts</label><input id="starts" type="datetime-local"></div><div><label>Expires</label><input id="expires" type="datetime-local"></div><div><label>Usage Limit</label><input id="limit" type="number" min="1" placeholder="Unlimited"></div><div><label>Per Customer</label><input id="per" type="number" min="1" value="1"></div><div class="full"><label>Customer ID (optional — leave blank for everyone)</label><input id="customer" placeholder="Paste customer UUID for a private coupon"></div></div><div style="margin-top:15px"><button type="submit" id="createBtn" class="btn gold">＋ Create Coupon</button></div></form></section><section class="panel"><div><input id="search" placeholder="Search coupon code" style="max-width:350px"><button type="button" id="refreshBtn" class="btn">↻ Refresh</button></div><div class="table"><table><thead><tr><th>Code</th><th>Offer</th><th>Minimum</th><th>Validity</th><th>Usage</th><th>Customer</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="8">Checking login…</td></tr></tbody></table></div></section></main></div>
<script>(function(){'use strict';const URL='https://ltxrycmreumoqfpcbwnb.supabase.co',KEY='sb_publishable_wdc4ImKB1f0Q-v4Po9DOwA_xIpPXHkh',db=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id);function msg(t,ok){const e=$('msg');e.textContent=t;e.className='message '+(ok?'success':'error')}function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0})}function dt(v){return v?new Date(v).toLocaleString('en-IN',{dateStyle:'short',timeStyle:'short'}):'—'}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function session(){const r=await db.auth.getSession();if(r.error){msg('Login check failed: '+r.error.message,false);return null}if(!r.data.session){location.href='login.html';return null}return r.data.session}async function load(){if(!await session())return;const r=await db.from('coupons').select('*').order('created_at',{ascending:false});if(r.error){msg('Could not load coupons: '+r.error.message,false);return}const q=$('search').value.toLowerCase();const data=(r.data||[]).filter(c=>(c.code||'').toLowerCase().includes(q));$('rows').innerHTML=data.length?data.map(c=>'<tr><td><strong>'+esc(c.code)+'</strong><br><span class="muted">'+esc(c.description||'')+'</span></td><td>'+(c.discount_type==='percent'?c.discount_value+'%':money(c.discount_value))+'</td><td>'+money(c.min_order_value)+'</td><td>'+dt(c.starts_at)+'<br>'+(c.expires_at?'→ '+dt(c.expires_at):'No expiry')+'</td><td>'+(c.used_count||0)+(c.usage_limit?' / '+c.usage_limit:'')+'</td><td>'+(c.customer_id?'Private':'Everyone')+'</td><td><span class="pill '+(c.active?'on':'off')+'">'+(c.active?'Active':'Inactive')+'</span></td><td><button type="button" class="btn '+(c.active?'red':'')+'" data-id="'+esc(c.id)+'" data-active="'+(!c.active)+'">'+(c.active?'Disable':'Enable')+'</button></td></tr>').join(''):'<tr><td colspan="8">No coupons found.</td></tr>'}async function create(e){e.preventDefault();if(!await session())return;const code=$('code').value.trim().toUpperCase(),value=Number($('value').value),starts=$('starts').value?new Date($('starts').value):new Date(),expires=$('expires').value?new Date($('expires').value):null;if(!code||!Number.isFinite(value)||value<=0){msg('Coupon code and valid discount value are required.',false);return}if(expires&&expires<=starts){msg('Expiry must be later than start.',false);return}const b=$('createBtn');b.disabled=true;b.classList.add('saving');b.textContent='Saving…';try{const payload={code,description:$('description').value.trim()||null,discount_type:$('type').value,discount_value:value,min_order_value:Number($('min').value||0),max_discount:$('max').value?Number($('max').value):null,starts_at:starts.toISOString(),expires_at:expires?expires.toISOString():null,usage_limit:$('limit').value?Number($('limit').value):null,per_customer_limit:Number($('per').value||1),one_per_customer:true,active:true,customer_id:$('customer').value.trim()||null};const r=await db.from('coupons').insert(payload).select('id,code').single();if(r.error)throw r.error;if(!r.data?.id)throw new Error('Coupon was not returned by the database.');msg('Coupon '+r.data.code+' created successfully.',true);$('couponForm').reset();$('min').value='0';$('per').value='1';await load()}catch(err){console.error(err);msg('Could not create coupon: '+(err.message||err),false)}finally{b.disabled=false;b.classList.remove('saving');b.textContent='＋ Create Coupon'}}async function toggle(id,active){if(!await session())return;const r=await db.from('coupons').update({active,updated_at:new Date().toISOString()}).eq('id',id);if(r.error){msg('Could not update coupon: '+r.error.message,false);return}await load()}$('couponForm').addEventListener('submit',create);$('refreshBtn').addEventListener('click',load);$('search').addEventListener('input',load);$('rows').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)toggle(b.dataset.id,b.dataset.active==='true')});load()})();</script></body></html>
