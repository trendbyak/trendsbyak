<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Activity</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Inter,Arial,sans-serif;margin:0;background:#f7f5f1;color:#171717}header{padding:20px;display:flex;justify-content:space-between;align-items:center;background:#fff;border-bottom:1px solid #ddd}main{padding:20px;max-width:1200px;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #e3e0da;border-radius:14px;padding:16px}.muted{color:#777;font-size:13px}.live{margin-top:20px}.row{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr 1fr;gap:10px;padding:13px 8px;border-bottom:1px solid #eee;align-items:center}.online{display:inline-block;width:8px;height:8px;background:#24a148;border-radius:50%;margin-right:6px}.section{background:#fff;border:1px solid #e3e0da;border-radius:14px;margin-top:20px;overflow:hidden}.section h2{font-size:18px;margin:0;padding:16px}.num{font-size:27px;font-weight:700;margin-top:5px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 1fr}.row>*:nth-child(n+3){display:none}}</style></head><body><header><strong>Trends by AK · Customer Activity</strong><a href="/admin/">Admin</a></header><main><div class="grid"><div class="card"><div class="muted">Live now</div><div class="num" id="live">—</div></div><div class="card"><div class="muted">Visitors today</div><div class="num" id="today">—</div></div><div class="card"><div class="muted">Page views today</div><div class="num" id="views">—</div></div><div class="card"><div class="muted">Abandoned carts</div><div class="num" id="carts">—</div></div></div><div class="section live"><h2>Live visitors <span class="muted">updates automatically</span></h2><div class="row muted"><div>Visitor</div><div>Page</div><div>Device</div><div>Source</div><div>Last active</div></div><div id="list"></div></div></main><script>const SUPABASE_URL='https://ltxrycmreumoqfpcbwnb.supabase.co';const SUPABASE_ANON_KEY='';let sb=null;try{if(window.supabase&&SUPABASE_ANON_KEY)sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)}catch(e){}const $=id=>document.getElementById(id);function ago(d){const s=Math.max(0,Math.floor((Date.now()-new Date(d))/1000));return s<60?s+'s ago':Math.floor(s/60)+'m ago'}async function load(){if(!sb)return;const cutoff=new Date(Date.now()-90000).toISOString();const {data:live}=await sb.from('live_visitors').select('*').gte('last_seen',cutoff).order('last_seen',{ascending:false});$('live').textContent=live?.length||0;$('list').innerHTML=(live||[]).map(v=>`<div class="row"><div><span class="online"></span>${v.customer_id?'Known customer':'Visitor'}<div class="muted">${(v.visitor_id||'').slice(0,8)}</div></div><div>${v.page||'Website'}</div><div>${v.device_type||'—'}</div><div>${v.source||'direct'}</div><div>${v.last_seen?ago(v.last_seen):'—'}</div></div>`).join('')||'<div style="padding:20px">No visitors online right now.</div>';const start=new Date();start.setHours(0,0,0,0);const {count:vc}=await sb.from('live_visitors').select('visitor_id',{count:'exact',head:true}).gte('last_seen',start.toISOString());$('today').textContent=vc||0;const {count:pv}=await sb.from('analytics_events').select('id',{count:'exact',head:true}).eq('event_name','page_view').gte('created_at',start.toISOString());$('views').textContent=pv||0;const {count:ac}=await sb.from('abandoned_carts').select('id',{count:'exact',head:true}).eq('recovery_status','abandoned');$('carts').textContent=ac||0}load();setInterval(load,15000);</script></body></html>
