<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart | Trends by AK</title><style>:root{--black:#171717;--gold:#b28a4b;--cream:#f7f4ef;--line:#e7e1d8}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#222;font:14px Arial,sans-serif}header{background:var(--black);color:#fff;padding:16px 5%;display:flex;justify-content:space-between}header a{color:#fff;text-decoration:none}.wrap{max-width:1000px;margin:auto;padding:30px 15px}.layout{display:grid;grid-template-columns:1fr 320px;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px}.item{display:grid;grid-template-columns:80px 1fr auto;gap:14px;padding:15px 0;border-bottom:1px solid #eee}.item img{width:80px;height:80px;object-fit:cover;border-radius:9px;background:#f3f0eb}.name{font-weight:700}.meta{color:#777;font-size:12px;margin-top:5px}.qty{display:flex;border:1px solid var(--line);border-radius:7px;width:max-content;margin-top:9px}.qty button{border:0;background:#fff;width:30px;height:30px}.total{font-weight:700;text-align:right}.summary{height:max-content}.row{display:flex;justify-content:space-between;padding:9px 0;color:#666}.grand{border-top:1px solid #eee;padding-top:15px;color:#222;font-weight:700;font-size:18px}.btn{display:flex;justify-content:center;text-decoration:none;padding:13px;border-radius:8px;margin-top:12px;font-weight:700}.checkout{background:var(--black);color:#fff}.shop{color:#222}.empty{text-align:center;padding:55px}.remove{border:0;background:none;color:#a33;padding:0;margin-top:8px;cursor:pointer}@media(max-width:700px){.layout{grid-template-columns:1fr}.item{grid-template-columns:60px 1fr}.item img{width:60px;height:60px}.total{grid-column:2;text-align:left}}
</style></head><body><header><a href="index.html">Trends by AK</a><a href="shop.html">Continue Shopping</a></header><main class="wrap"><h1>Your Cart</h1><div id="root"></div></main><script>
function cart(){try{return JSON.parse(localStorage.getItem('trendsbyak_cart')||'[]')}catch{return[]}}function save(c){localStorage.setItem('trendsbyak_cart',JSON.stringify(c));render()}function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}function money(v){return '₹'+Number(v||0).toLocaleString('en-IN')}
function render(){const c=cart();if(!c.length){document.getElementById('root').innerHTML='<div class="card empty"><h2>Your cart is empty</h2><a class="btn shop" href="shop.html">Shop Now</a></div>';return}let subtotal=0;const items=c.map((x,i)=>{const q=Number(x.quantity||1),p=Number(x.price||0);subtotal+=q*p;const option=[x.variant_size,x.variant_color].filter(Boolean).join(' / ');return `<div class="item"><img src="${esc(x.image_url||'')}" alt="${esc(x.name)}"><div><div class="name">${esc(x.name)}</div>${option?`<div class="meta">${esc(option)}</div>`:''}${x.variant_sku?`<div class="meta">SKU: ${esc(x.variant_sku)}</div>`:''}<div class="meta">${money(p)} each</div><div class="qty"><button onclick="change(${i},-1)">−</button><span style="padding:8px 10px">${q}</span><button onclick="change(${i},1)">+</button></div><button class="remove" onclick="removeItem(${i})">Remove</button></div><div class="total">${money(p*q)}</div></div>`}).join('');document.getElementById('root').innerHTML=`<div class="layout"><section class="card">${items}</section><aside class="card summary"><h2>Summary</h2><div class="row"><span>Subtotal</span><span>${money(subtotal)}</span></div><div class="row"><span>Shipping</span><span>Calculated at checkout</span></div><div class="row grand"><span>Total</span><span>${money(subtotal)}</span></div><a class="btn checkout" href="checkout.html">Proceed to Checkout</a></aside></div>`}
function change(i,d){const c=cart(),x=c[i];if(!x)return;x.quantity=Number(x.quantity||1)+d;if(x.quantity<1)c.splice(i,1);save(c)}function removeItem(i){const c=cart();c.splice(i,1);save(c)}render();
</script></body></html>
