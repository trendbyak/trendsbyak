<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Your Order | Trends by AK</title><style>body{margin:0;background:#f7f4ef;color:#222;font-family:Arial,sans-serif}.top{background:#1d1d1d;color:#fff;padding:18px 5%;font-weight:800;letter-spacing:1px}.wrap{max-width:760px;margin:auto;padding:35px 16px}.card{background:#fff;border:1px solid #e7e1d8;border-radius:16px;padding:25px;margin-bottom:16px;box-shadow:0 8px 30px rgba(35,30,20,.06)}h1{margin:0 0 8px}.muted{color:#777;font-size:14px;line-height:1.5}.form,.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.full{grid-column:1/-1}label{display:block;font-size:11px;font-weight:800;margin-bottom:6px;color:#555}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font:inherit;box-sizing:border-box}.btn{border:0;border-radius:9px;padding:12px 18px;background:#1d1d1d;color:#fff;font-weight:700;cursor:pointer}.gold{background:#b58a45}.msg{display:none;margin-top:14px;padding:11px;border-radius:8px;background:#fff0f0;color:#a42626;font-size:13px}.hero{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.orderno{font-weight:800;font-size:20px}.badge{display:inline-block;padding:7px 11px;border-radius:18px;background:#eee8ff;color:#5b3aa4;font-size:12px;font-weight:800;text-transform:capitalize}.timeline{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:25px 0 12px}.step{text-align:center;font-size:10px;color:#aaa;font-weight:700}.dot{width:28px;height:28px;border-radius:50%;background:#e6e2dc;margin:0 auto 7px;display:flex;align-items:center;justify-content:center}.done{color:#547653}.done .dot{background:#dff5df;color:#267326}.current{color:#b58a45}.current .dot{background:#f3e4c8;color:#8a5b00}.box{background:#faf8f4;border-radius:10px;padding:14px}.box small{display:block;color:#888;font-size:10px;font-weight:800;margin-bottom:6px}.items{border-top:1px solid #eee;margin-top:15px;padding-top:12px}.item{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #eee;font-size:13px}.tracklink{display:inline-block;margin-top:15px;color:#fff;background:#1d1d1d;padding:11px 15px;border-radius:8px;text-decoration:none;font-weight:700}@media(max-width:650px){.form,.details{grid-template-columns:1fr}.full{grid-column:auto}.timeline{grid-template-columns:repeat(3,1fr);row-gap:15px}}</style></head><body><header class="top">TRENDS BY AK</header><main class="wrap"><section class="card"><h1>Track your order</h1><p class="muted">Enter your order number and the phone number used at checkout.</p><div class="form"><div><label>ORDER NUMBER</label><input id="order" placeholder="Example: TAK-MUV5RZBO"></div><div><label>PHONE NUMBER</label><input id="phone" inputmode="tel" placeholder="Your checkout phone number"></div><div class="full"><button class="btn gold" id="searchBtn" onclick="track()">Track Order</button></div></div><div id="msg" class="msg"></div></section><section id="result" class="card" style="display:none"></section></main><script>
const API="https://ltxrycmreumoqfpcbwnb.supabase.co/functions/v1/track-order",statuses=["new","confirmed","processing","packed","shipped","delivered"],labels={new:"Order received",confirmed:"Confirmed",processing:"Processing",packed:"Packed",shipped:"Shipped",delivered:"Delivered",cancelled:"Cancelled",returned:"Returned"};
function esc(v){return String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}function money(v){return "₹"+Number(v||0).toLocaleString("en-IN",{maximumFractionDigits:2})}function date(v){const d=new Date(v);return Number.isNaN(d.getTime())?"—":d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})}
function showMsg(t){const e=document.getElementById("msg");e.textContent=t;e.style.display="block"}
function render(o){const st=String(o.order_status||"new").toLowerCase(),idx=statuses.indexOf(st);const tl=["cancelled","returned"].includes(st)?'<span class="badge">'+esc(labels[st]||st)+'</span>':'<div class="timeline">'+statuses.map((s,i)=>'<div class="step '+(i<=idx?"done ":"")+(s===st?"current":"")+'"><div class="dot">'+(i<=idx?"✓":"")+'</div>'+esc(labels[s])+'</div>').join("")+'</div>';const items=(o.items||[]).map(x=>'<div class="item"><span>'+esc(x.product_name)+' × '+Number(x.quantity||0)+'</span><strong>'+money(x.line_total)+'</strong></div>').join("");let h='<div class="hero"><div><div class="orderno">'+esc(o.order_number)+'</div><div class="muted">Placed '+date(o.created_at)+'</div></div><span class="badge">'+esc(labels[st]||st)+'</span></div>'+tl+'<div class="details"><div class="box"><small>PAYMENT</small>'+esc(o.payment_status||"pending")+'</div><div class="box"><small>ORDER TOTAL</small><strong>'+money(o.total)+'</strong></div></div><div class="items">'+(items||'<div class="muted">Order details unavailable.</div>')+'</div>';if(o.tracking_number)h+='<div class="box" style="margin-top:15px"><small>SHIPMENT TRACKING</small><strong>'+esc(o.tracking_number)+'</strong>'+(o.tracking_url?'<br><a class="tracklink" href="'+esc(o.tracking_url)+'" target="_blank" rel="noopener">Track Shipment</a>':"")+'</div>';const r=document.getElementById("result");r.innerHTML=h;r.style.display="block"}
async function track(){const order=document.getElementById("order").value.trim(),phone=document.getElementById("phone").value.trim(),b=document.getElementById("searchBtn");if(!order||!phone){showMsg("Please enter both your order number and phone number.");return}b.disabled=true;b.textContent="Checking...";document.getElementById("msg").style.display="none";try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({order_number:order,phone})}),d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||"Order not found.");render(d.order)}catch(e){document.getElementById("result").style.display="none";showMsg(e.message)}finally{b.disabled=false;b.textContent="Track Order"}}
const p=new URLSearchParams(location.search);if(p.get("order"))document.getElementById("order").value=p.get("order");
</script></body></html>
